// ---------- shared: turn individual sales into grouped buyer leads ----------

/**
 * sales: [{ name, contactFirst, contactLast, email, phone, phoneNote, mailing, addr, city, state,
 *           date (Date), price, type, financing ('cash'|'hard money'|''), saleRef }]
 */
function groupSales_(sales, days, sourceNote) {
  var groups = {}, order = [];
  sales.forEach(function (s) {
    if (!str_(s.name)) return;
    var entity = ENTITY_RE.test(s.name);
    // companies group by name (their sales often carry different contacts); people by email or name + address
    var key = entity ? 'co|' + normKey_(s.name) : (s.email || normKey_(s.name) + '|' + normKey_(String(s.mailing || s.addr).split(',')[0]));
    if (!groups[key]) { groups[key] = { s: s, buys: [] }; order.push(key); }
    var g = groups[key];
    if (!g.s.email && s.email) g.s.email = s.email;
    if (!g.s.phone && s.phone) g.s.phone = s.phone;
    if (!g.s.contactFirst && s.contactFirst) { g.s.contactFirst = s.contactFirst; g.s.contactLast = s.contactLast; }
    g.buys.push(s);
  });
  return order.map(function (k) {
    var g = groups[k], s = g.s;
    g.buys.sort(function (a, b) { return (b.date ? b.date.getTime() : 0) - (a.date ? a.date.getTime() : 0); });
    var prices = g.buys.map(function (b) { return Number(b.price) || 0; }).filter(function (p) { return p >= 1000; });
    var cities = [], types = [], fin = [];
    g.buys.forEach(function (b) {
      var c = titleCase_(b.city);
      if (c && cities.indexOf(c) === -1) cities.push(c);
      var t = normalizePropType_(b.type);
      if (t && types.indexOf(t) === -1) types.push(t);
      if (b.financing && fin.indexOf(b.financing) === -1) fin.push(b.financing);
    });
    var entity = ENTITY_RE.test(s.name);
    var first = '', last = '', company = '';
    if (entity) { company = titleCase_(s.name); first = titleCase_(s.contactFirst || ''); last = titleCase_(s.contactLast || ''); }
    else if (s.contactFirst) { first = titleCase_(s.contactFirst); last = titleCase_(s.contactLast || ''); }
    else if (s.name.indexOf(',') > -1) { last = titleCase_(s.name.split(',')[0]); first = titleCase_(s.name.split(',')[1].trim().split(/\s+/)[0]); }
    else { var p = titleCase_(s.name).split(/\s+/); first = p.shift(); last = p.join(' '); }
    var summary = g.buys.slice(0, 5).map(function (b) {
      return [titleCase_(b.addr), titleCase_(b.city)].filter(String).join(', ') + (b.price ? ' — ' + money_(b.price) : '') +
        (b.financing ? ', ' + b.financing : '') + (/land|lot|development|acre/i.test(String(b.type)) ? ' · land' : '') + (b.date ? ' (' + fmtDate_(b.date, 'MMM d, yyyy') + ')' : '');
    }).join('; ') + (g.buys.length > 5 ? '; +' + (g.buys.length - 5) + ' more' : '');
    var how = fin.length === 1 ? ' with ' + fin[0] : fin.length ? ' (cash / hard money)' : '';
    var landBuys = g.buys.filter(function (b) { return /land|lot|development|acre/i.test(String(b.type)); }).length;
    var cats = [];
    if (fin.indexOf('cash') > -1) cats.push('Cash Buyer');
    if (g.buys.some(function (b) { return /commercial/i.test(String(b.type)); })) {
      cats.push(list_(getSettings_().CATEGORIES).filter(function (c) { return /commercial/i.test(c); })[0] || 'Commercial Buyer');
    }
    if (landBuys) {
      var dev = list_(getSettings_().CATEGORIES).filter(function (c) { return /develop|builder|construction/i.test(c); })[0] || 'Developer';
      cats.push(dev);
    }
    var notes = [];
    if (sourceNote) notes.push(sourceNote);
    if (s.phoneNote) notes.push(s.phoneNote);
    if (!s.email) notes.push('Needs an email address before approval (skip trace this owner).');
    return {
      firstName: first, lastName: last, company: company, email: s.email || '', phone: s.phone || '',
      mailingAddress: s.mailing || '', categories: cats.join(', '),
      markets: cities.join(', '), propertyTypes: types.join(', '),
      minPrice: prices.length ? Math.floor(Math.min.apply(null, prices) * 0.8 / 5000) * 5000 : '',
      maxPrice: prices.length ? Math.ceil(Math.max.apply(null, prices) * 1.2 / 5000) * 5000 : '',
      criteria: (landBuys ? 'New-construction / land buyer. ' : '') + 'Bought ' + g.buys.length + ' propert' + (g.buys.length === 1 ? 'y' : 'ies') +
        (landBuys ? ' (' + landBuys + ' land/lot' + (landBuys === 1 ? '' : 's') + ')' : '') + how + ' in the last ' + days + ' days' +
        (prices.length ? ', ' + money_(Math.min.apply(null, prices)) + (prices.length > 1 ? '–' + money_(Math.max.apply(null, prices)) : '') : '') + '.',
      purchases: summary, purchaseCount: g.buys.length, lastPurchase: g.buys[0].date ? fmtDate_(g.buys[0].date) : '',
      lastPurchaseAddress: [titleCase_(g.buys[0].addr), titleCase_(g.buys[0].city), String(g.buys[0].state || '').toUpperCase() + (g.buys[0].zip ? ' ' + g.buys[0].zip : '')].filter(function (x) { return str_(x); }).join(', '),
      notes: notes.join(' '),
      _refs: g.buys.map(function (b) { return b.saleRef; })
    };
  });
}

/** Adds grouped leads; if the buyer already exists, their purchase history is extended. */
function addRecordLeads_(ctx, sourceLabel, leads) {
  leads.forEach(function (lead) {
    var refs = lead._refs; delete lead._refs;
    var existing = (lead.email && ctx.byEmail[lc_(lead.email)]) || ctx.byKey[ownerKey_(lead)];
    var total = lead._total; delete lead._total;
    if (existing) {
      if (total) {
        // ledger promotions know the buyer's full purchase count; older history may repeat the same sales
        var had = normKey_(existing.purchases);
        var newOnes = (lead._addrs || []).filter(function (a) { return a && had.indexOf(normKey_(a)) === -1; }).length;
        lead.purchaseCount = Math.max(total, (Number(existing.purchaseCount) || 0) + newOnes);
        var seenAddr = {};
        lead.purchases = (lead.purchases + '; ' + str_(existing.purchases)).split(/;\s*/).filter(function (p) {
          var k = normKey_(p.split(' — ')[0]);
          if (!p || /^\+\d+ more$/.test(p) || seenAddr[k]) return false;
          seenAddr[k] = true; return true;
        }).join('; ').slice(0, 900);
      } else {
        lead.purchaseCount = (Number(existing.purchaseCount) || 0) + lead.purchaseCount;
        if (str_(existing.purchases)) lead.purchases = (lead.purchases + '; ' + existing.purchases).slice(0, 900);
      }
    }
    delete lead._addrs;
    addLead_(ctx, sourceLabel, lead, refs.join(';'), lead.purchases);
    refs.forEach(function (r) { ctx.refs[r] = true; });
  });
}

// ---------- DealMachine ----------

function dmKey_() {
  return PropertiesService.getScriptProperties().getProperty('DM_API_KEY') || '';
}

function dmMonthKey_() { return 'DM_CREDITS_' + fmtDate_(new Date(), 'yyyyMM'); }
function dmCreditsUsed_() { return parseInt(PropertiesService.getScriptProperties().getProperty(dmMonthKey_()) || '0', 10) || 0; }
function dmAddCredits_(n) {
  if (!n) return;
  PropertiesService.getScriptProperties().setProperty(dmMonthKey_(), String(dmCreditsUsed_() + Number(n)));
}

/** Calls the DealMachine API. Retries once on rate limit / temporary outage. */
function dmFetch_(method, path, body) {
  var key = dmKey_();
  if (!key) throw new Error('Add your DealMachine API key first (New Buyers → DealMachine).');
  for (var attempt = 0; attempt < 2; attempt++) {
    var opts = { method: method, muteHttpExceptions: true, headers: { Authorization: 'Bearer ' + key } };
    if (body) { opts.contentType = 'application/json'; opts.payload = JSON.stringify(body); }
    var res = UrlFetchApp.fetch(DM_BASE + path, opts);
    var code = res.getResponseCode();
    var json = {};
    try { json = JSON.parse(res.getContentText() || '{}'); } catch (e) { json = {}; }
    if (code >= 200 && code < 300) return json;
    var err = json.error || {};
    if ((code === 429 || code === 503) && attempt === 0) {
      var wait = Number((err.details && err.details.retry_after) || res.getHeaders()['Retry-After'] || 5);
      if (code === 429 && err.details && err.details.limit_type === 'day') break;
      Utilities.sleep(Math.min(Math.max(wait, 1), 25) * 1000);
      continue;
    }
    var msg = {
      401: 'DealMachine rejected the API key (invalid or revoked). Create a new key at dealmachine.com/settings/developer.',
      402: 'Your DealMachine account is out of data credits for this month.',
      403: err.code === 'subscription_required' ? 'Your DealMachine plan does not include API data access. Upgrade your DealMachine plan to use this source.' : 'DealMachine refused this request (permissions).',
      429: 'DealMachine daily request limit reached — it will continue on the next run.'
    }[code] || ('DealMachine error ' + code + ': ' + (err.message || res.getContentText().slice(0, 200)));
    throw new Error(msg);
  }
  throw new Error('DealMachine is busy right now — it will try again on the next run.');
}

function dmAreas_() {
  var chosen = list_(getSettings_().INTAKE_DM_COUNTIES);
  return DM_AREAS.filter(function (a) { return !chosen.length || chosen.indexOf(a.fips) > -1; });
}

/** One search body. kind: 'cash' (no mortgage) or 'hard money' (private-lender first mortgage). */
function dmQuery_(kind, fipsList, s, landIds) {
  var days = Math.max(1, parseInt(s.INTAKE_DM_DAYS, 10) || 14);
  var filters = [
    { filter_id: 'last_sale_date', operator: 'relative_time', value: { value: days, unit: 'days', direction: 'ago', comparison: 'less_than' } },
    { filter_id: 'is_bank_owned', value: false },
    { filter_id: 'is_intra_family_transfer', value: false }
  ];
  if (kind === 'land') {
    // Builders / developers: cash purchases of residential land or lots by owners with several properties
    filters.push({ filter_id: 'num_mortgages', operator: 'equals', value: 0 });
    if (landIds && landIds.additional.length) filters.push({ filter_id: 'additional_property_types', operator: 'contains_any', value: landIds.additional });
    else filters.push({ filter_id: 'property_type', operator: 'contains_any', value: landIds ? landIds.primary : [] });
    var minOwned = Math.max(1, parseInt(s.INTAKE_DM_LAND_MIN_OWNED, 10) || 2);
    filters.push({ filter_id: 'ppm_num_properties_owned_by_owner', operator: 'greater_than_or_equal', value: minOwned });
  } else {
    if (kind === 'cash') filters.push({ filter_id: 'num_mortgages', operator: 'equals', value: 0 });
    else filters.push({ filter_id: 'is_mortgage_1_private_lender', value: true });
    if (bool_(s.INTAKE_DM_ABSENTEE)) filters.push({ filter_id: 'has_absentee_owners', value: true });
  }
  var minPrice = Number(num_(kind === 'land' ? s.INTAKE_DM_LAND_MIN_PRICE : s.INTAKE_DM_MIN_PRICE)) || 0;
  if (minPrice > 0) filters.push({ filter_id: 'last_sale_price', operator: 'greater_than_or_equal', value: minPrice });
  return {
    locations: fipsList.map(function (f) { return { type: 'county', code: f }; }),
    anchor: 'properties',
    contact_audience: bool_(s.INTAKE_DM_CONTACTS) ? 'owners' : 'none',
    filters: filters,
    fields: ['owner_1_full_name', 'owner_mailing_address_full', 'last_sale_date', 'last_sale_price', 'property_type'],
    sort: [{ field_id: 'last_sale_date', direction: 'desc' }]
  };
}

/** Option-ID → label map for property_type (cached; free endpoint). */
function dmTypeLabels_() {
  var cache = CacheService.getScriptCache();
  var hit = cache.get('dm_type_labels');
  if (hit) { try { return JSON.parse(hit); } catch (e) { /* refetch */ } }
  var map = {};
  try {
    var res = dmFetch_('get', '/filters?source_type=properties&search=' + encodeURIComponent('Property Type') + '&per_page=50');
    (res.data || []).forEach(function (f) {
      if (f.filter_id === 'property_type') (f.options || []).forEach(function (o) { map[String(o.option_id)] = o.label; });
    });
    cache.put('dm_type_labels', JSON.stringify(map), 21600);
  } catch (e) { /* labels are optional */ }
  return map;
}

/**
 * Option IDs for residential land: property_type "Vacant Land" / "Development Site", and the granular
 * additional_property_types whose label is residential land or lots (looked up live; cached).
 */
function dmLandTypeIds_() {
  var cache = CacheService.getScriptCache();
  var hit = cache.get('dm_land_ids');
  if (hit) { try { return JSON.parse(hit); } catch (e) { /* refetch */ } }
  var out = { primary: [], additional: [] };
  var page = 1;
  while (page <= 4) {
    var res = dmFetch_('get', '/filters?source_type=properties&search=' + encodeURIComponent('Property Type') + '&per_page=50&page=' + page);
    (res.data || []).forEach(function (f) {
      (f.options || []).forEach(function (o) {
        var l = String(o.label || '');
        if (f.filter_id === 'property_type' && /vacant land|development site/i.test(l)) out.primary.push(o.option_id);
        if (f.filter_id === 'additional_property_types' && /resid|single|sfr|subdivi|townhouse|duplex|multi/i.test(l) && /vacant|land|lot|acre/i.test(l)) out.additional.push(o.option_id);
      });
    });
    if (!res.pagination || !res.pagination.has_next_page) break;
    page++;
  }
  cache.put('dm_land_ids', JSON.stringify(out), 21600);
  return out;
}

/** Picks the best contact: likely owner, mobile not on Do-Not-Call, deliverable email. */
function dmBestContact_(contacts) {
  var cs = (contacts || []).slice().sort(function (a, b) { return (b.is_likely_owner ? 1 : 0) - (a.is_likely_owner ? 1 : 0); });
  var out = { first: '', last: '', email: '', phone: '', phoneNote: '' };
  cs.some(function (c) {
    if (!out.first && (c.first_name || c.last_name)) { out.first = c.first_name || ''; out.last = c.last_name || ''; }
    if (!out.email) {
      var em = (c.emails || []).filter(function (e) { return e && e.address && !/undeliverable|invalid/i.test(e.verification_status || ''); })[0];
      if (em) out.email = lc_(em.address);
    }
    if (!out.phone) {
      var ph = (c.phones || []).filter(function (p) { return p && p.number; });
      var ok = ph.filter(function (p) { return !p.do_not_call; });
      var best = ok.filter(function (p) { return /wireless|mobile/i.test(p.type || ''); })[0] || ok[0];
      if (best) out.phone = formatPhone_(best.number);
      else if (ph.length && !out.phoneNote) out.phoneNote = 'Phone ' + formatPhone_(ph[0].number) + ' is on the Do-Not-Call list.';
    }
    return out.email && out.phone;
  });
  return out;
}

function formatPhone_(n) {
  var d = String(n || '').replace(/\D/g, '');
  if (d.length === 11 && d.charAt(0) === '1') d = d.slice(1);
  return d.length === 10 ? '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6) : String(n || '');
}

function dmLeads_(ctx) {
  var s = getSettings_();
  if (!dmKey_()) return 'Add your DealMachine API key to turn this on.';
  var areas = dmAreas_();
  if (!areas.length) return 'Pick at least one county.';
  var sales = [], fetched = 0, creditsUsed = 0, notes = [];
  var maxRun = Math.max(1, parseInt(s.INTAKE_DM_MAX_PER_RUN, 10) || 100);
  var cap = Math.max(0, parseInt(s.INTAKE_DM_MONTHLY_CAP, 10) || 0);
  var kinds = ['cash'];
  if (bool_(s.INTAKE_DM_HARD_MONEY)) kinds.push('hard money');
  var landIds = null;
  if (bool_(s.INTAKE_DM_LAND)) {
    landIds = dmLandTypeIds_();
    if (landIds.primary.length || landIds.additional.length) kinds.push('land');
    else notes.push('Land search skipped: DealMachine did not return land property types.');
  }
  var labels = dmTypeLabels_();

  var chunks = [];
  for (var i = 0; i < areas.length; i += 15) chunks.push(areas.slice(i, i + 15).map(function (a) { return a.fips; }));

  var perKind = Math.ceil(maxRun / kinds.length); // share the per-run limit fairly between searches
  var counts = { cash: 0, 'hard money': 0, land: 0 };
  outer:
  for (var k = 0; k < kinds.length; k++) {
    var kindFetched = 0;
    for (var c = 0; c < chunks.length; c++) {
      var page = 1;
      while (true) {
        var room = Math.min(perKind - kindFetched, maxRun - fetched);
        if (cap) room = Math.min(room, cap - dmCreditsUsed_());
        if (cap && dmCreditsUsed_() >= cap) { notes.push('Monthly credit limit reached (' + cap + ').'); break outer; }
        if (room <= 0) { if (fetched >= maxRun) { notes.push('Per-run limit reached (' + maxRun + ').'); break outer; } break; }
        var body = dmQuery_(kinds[k], chunks[c], s, landIds);
        body.page = page;
        body.per_page = Math.min(100, room);
        var res = dmFetch_('post', '/properties/search', body);
        var used = (res.credits && Number(res.credits.used)) || 0;
        creditsUsed += used; dmAddCredits_(used);
        (res.data || []).forEach(function (p) {
          fetched++; kindFetched++; counts[kinds[k]]++;
          var ref = 'DM:' + p.dm_property_id + ':' + (p.last_sale_date || '');
          if (ctx.refs[ref]) return;
          var who = dmBestContact_(p.contacts);
          var type = Array.isArray(p.property_type) ? p.property_type.map(function (id) { return labels[String(id)] || ''; }).filter(String)[0] : p.property_type;
          sales.push({
            name: str_(p.owner_1_full_name) || (who.first + ' ' + who.last).trim(), contactFirst: who.first, contactLast: who.last,
            email: who.email, phone: who.phone, phoneNote: who.phoneNote, mailing: titleCase_(p.owner_mailing_address_full || ''),
            addr: p.address, city: p.city, state: p.state, date: parseDateLoose_(p.last_sale_date), price: p.last_sale_price,
            type: type || (kinds[k] === 'land' ? 'Vacant Land' : ''), financing: kinds[k] === 'land' ? 'cash' : kinds[k], saleRef: ref
          });
        });
        var pg = res.pagination || {};
        if (!pg.has_next_page || !(res.data || []).length) break;
        page++;
      }
    }
  }
  var days = Math.max(1, parseInt(s.INTAKE_DM_DAYS, 10) || 14);
  addRecordLeads_(ctx, INTAKE_SOURCES.dealmachine.label, groupSales_(sales, days, 'Found by DealMachine from recorded sales.'));
  return fetched + ' recent sales checked (' + kinds.map(function (x) { return counts[x] + ' ' + x; }).join(', ') + ') · ' + creditsUsed + ' credits used (' + dmCreditsUsed_() + (cap ? ' of ' + cap : '') + ' this month).' + (notes.length ? ' ' + notes.join(' ') : '');
}

// ---------- Free county records: Norfolk open data ----------

var NORFOLK_HOST = 'https://data.norfolk.gov';

/** Finds the newest "Property Assessment and Sales - FYxx" dataset (it rolls over every July). */
function norfolkDataset_() {
  var cache = CacheService.getScriptCache();
  var hit = cache.get('norfolk_sales_ds');
  if (hit) return hit;
  var res = UrlFetchApp.fetch(NORFOLK_HOST + '/api/views/metadata/v1?limit=500', { muteHttpExceptions: true });
  if (res.getResponseCode() !== 200) throw new Error('Norfolk open data is unavailable right now (' + res.getResponseCode() + ').');
  var best = null;
  JSON.parse(res.getContentText()).forEach(function (d) {
    var m = String(d.name || '').match(/^Property Assessment and Sales - FY\s?(\d+)$/i);
    if (m && (!best || Number(m[1]) > best.fy)) best = { fy: Number(m[1]), id: d.id };
  });
  if (!best) throw new Error('Could not find Norfolk\'s property sales dataset.');
  cache.put('norfolk_sales_ds', best.id, 43200);
  return best.id;
}

function countyLeads_(ctx) {
  var s = getSettings_();
  var days = Math.max(1, parseInt(s.INTAKE_COUNTY_DAYS, 10) || 30);
  var minPrice = Number(num_(s.INTAKE_COUNTY_MIN_PRICE)) || 0;
  var since = fmtDate_(new Date(Date.now() - days * 86400000), "yyyy-MM-dd'T'00:00:00");
  var ds = norfolkDataset_();
  var url = NORFOLK_HOST + '/resource/' + ds + '.json?' + [
    '$where=' + encodeURIComponent("transfer_date >= '" + since + "' AND consideration >= " + minPrice),
    '$order=' + encodeURIComponent('transfer_date DESC'),
    '$limit=5000',
    '$select=' + encodeURIComponent('parcel_id,owner,grantee,transfer_date,consideration,property_street_number,property_street_direction,property_street_name,property_street_type,unit_number,property_city,property_zip,property_use')
  ].join('&');
  var res = UrlFetchApp.fetch(url, { muteHttpExceptions: true });
  if (res.getResponseCode() !== 200) throw new Error('Norfolk open data query failed (' + res.getResponseCode() + ').');
  var rows = JSON.parse(res.getContentText());
  var entitiesOnly = bool_(s.INTAKE_COUNTY_ENTITIES_ONLY);
  var sales = [], kept = 0;
  rows.forEach(function (r) {
    var buyer = str_(r.grantee) || str_(r.owner);
    if (!buyer) return;
    if (entitiesOnly && !ENTITY_RE.test(buyer)) return;
    if (INSTITUTION_RE.test(buyer)) return;
    var ref = 'NFK:' + r.parcel_id + ':' + String(r.transfer_date || '').slice(0, 10);
    kept++;
    // each purchase is logged once by the Purchase Ledger (ledgerAdd_ skips refs it already has)
    var addr = [r.property_street_number, r.property_street_direction, r.property_street_name, r.property_street_type].filter(Boolean).join(' ') + (r.unit_number ? ' #' + r.unit_number : '');
    sales.push({
      name: buyer, email: '', phone: '', mailing: '', addr: addr, city: r.property_city || 'Norfolk', state: 'VA',
      date: parseDateLoose_(String(r.transfer_date || '').slice(0, 10)), price: Number(r.consideration) || '', type: propKind_(r.property_use, '', undefined),
      financing: '', saleRef: ref
    });
  });
  var logged = ledgerAdd_(ctx, sales, INTAKE_SOURCES.county.label);
  return rows.length + ' Norfolk sales in the last ' + days + ' days, ' + kept + (entitiesOnly ? ' to companies / LLCs' : ' kept') + ' · ' + logged + ' new investor purchases logged.';
}

// ---- Responses.gs ----
/**
 * Responses.gs — tracks interested buyers and replies.
 *
 * Responses are captured two ways:
 *   1. Automatically: scanInboxForResponses() reads replies in this Gmail inbox whose
 *      subject/body contains a deal ID (e.g. SDI-2026-0001). The email buttons
 *      (I'M INTERESTED / MAKE AN OFFER / Not for me / Unsubscribe) pre-fill subjects
 *      so replies are classified automatically. Runs every 15 min once enabled.
 *   2. Manually: logResponse() from the app (phone calls, texts, etc.).
 */

var DEAL_ID_RE = /SDI-\d{4}-\d{4}/i;
var INVESTOR_REF_RE = /INV-\d{5}/i;

function parseFrom_(from) {
  var s = String(from || '');
  var m = s.match(/<([^>]+)>/);
  var email = (m ? m[1] : s).trim().toLowerCase();
  var name = m ? s.slice(0, s.indexOf('<')).replace(/"/g, '').trim() : '';
  return { email: email, name: name };
}

function stripQuoted_(body) {
  var lines = String(body || '').split(/\r?\n/);
  var out = [];
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    if (/^\s*>/.test(l)) break;
    if (/^On .+wrote:\s*$/i.test(l) || /^-{2,}\s*Original Message/i.test(l) || /^From: /i.test(l)) break;
    out.push(l);
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim().slice(0, 1500);
}

function parseOffer_(text) {
  var m = String(text || '').match(/\$\s?(\d[\d,]*(?:\.\d+)?)\s*(k|m)?\b/i);
  if (!m) return '';
  var n = parseFloat(m[1].replace(/,/g, ''));
  if (m[2] && /k/i.test(m[2])) n *= 1000;
  if (m[2] && /m/i.test(m[2])) n *= 1000000;
  return n > 0 ? n : '';
}

/** Why a buyer passed: Price / Location / Condition / Numbers / Timing / Other. */
function passReasonOf_(text) {
  var t = lc_(text);
  var line = (t.match(/main reason[^\n]*:\s*([^\n]+)/) || [])[1];
  if (line && !/price \/ location/.test(line)) t = line + ' ' + t;
  if (/\bprice\b|too high|overpriced|expensive|asking/.test(t)) return 'Price';
  if (/\bnumbers?\b|\barv\b|comps?|margin|spread|roi|doesn.t pencil|math/.test(t)) return 'Numbers';
  if (/location|area|neighbou?rhood|school|crime|too far|market/.test(t)) return 'Location';
  if (/condition|repairs?|rehab|foundation|roof|too much work|structural/.test(t)) return 'Condition';
  if (/timing|busy|capital|funds|tied up|bandwidth|not buying right now/.test(t)) return 'Timing';
  return 'Other';
}

function classifyReply_(subject, body) {
  var s = String(subject || '').replace(/^(re|fw|fwd)\s*:\s*/ig, '').trim();
  var b = String(body || '').toLowerCase();
  if (/^unsubscribe\b/i.test(s) || /^\s*(unsubscribe|remove me|stop)\b/.test(b)) return 'Unsubscribe';
  if (/^offer\b/i.test(s)) return 'Offer';
  if (/^pass\b/i.test(s)) return 'Not Interested';
  if (/^interested\b/i.test(s)) return 'Interested';
  if (/not interested|pass on (this|it)|no thanks|not for me|i'?ll pass/.test(b)) return 'Not Interested';
  if (/\boffer\b/.test(b) && parseOffer_(body)) return 'Offer';
  if (/interested|i'?ll take it|i want it|send (me )?(the )?(contract|address|info|details)|lock it up|still available|can i see it|schedule a (showing|walk)/.test(b)) return 'Interested';
  if (/\?/.test(b)) return 'Question';
  return 'Reply';
}

/** Recounts the deal's Responses / Interested columns. */
function recountDeal_(dealId) {
  if (!dealId) return;
  var deal = findBy_(SHEET.DEALS, 'id', dealId);
  if (!deal) return;
  var rs = readTable_(SHEET.RESPONSES).rows.filter(function (r) { return r.dealId === dealId; });
  var interested = {};
  rs.forEach(function (r) {
    if (r.type === 'Interested' || r.type === 'Offer') interested[lc_(r.investorEmail) || r.id] = true;
  });
  updateObject_(SHEET.DEALS, deal._row, { responses: rs.length, interested: Object.keys(interested).length });
}

function myAddresses_() {
  var s = getSettings_();
  var mine = [currentUser_(), s.REPLY_TO, s.FROM_ALIAS, s.CONTACT_EMAIL].map(lc_).filter(String);
  try { GmailApp.getAliases().forEach(function (a) { mine.push(lc_(a)); }); } catch (e) { /* ignore */ }
  return mine;
}

// ---------- client API ----------

/** Scans Gmail for investor replies and logs them. Safe to run repeatedly (dedupes by message ID). */
function scanInboxForResponses() {
  return withLock_(function () {
    var settings = getSettings_();
    var days = Math.max(1, parseInt(settings.RESPONSE_LOOKBACK_DAYS, 10) || 14);
    var dealIds = readTable_(SHEET.JOBS).rows.map(function (j) { return j.dealId; })
      .filter(function (v, i, a) { return v && a.indexOf(v) === i; });
    var deals = {};
    readTable_(SHEET.DEALS).rows.forEach(function (d) { deals[String(d.id).toUpperCase()] = d; });
    var investorsTable = readTable_(SHEET.INVESTORS);
    var byEmail = {}, byId = {};
    investorsTable.rows.forEach(function (i) { byEmail[lc_(i.email)] = i; byId[String(i.id).toUpperCase()] = i; });
    var seen = {};
    readTable_(SHEET.RESPONSES).rows.forEach(function (r) { if (r.messageId) seen[r.messageId] = true; });
    var mine = myAddresses_();

    var queries = [];
    for (var i = 0; i < dealIds.length; i += 15) {
      var chunk = dealIds.slice(i, i + 15).map(function (d) { return 'subject:"' + d + '"'; });
      queries.push('newer_than:' + days + 'd -from:me (' + chunk.join(' OR ') + ')');
    }
    queries.push('newer_than:' + days + 'd -from:me subject:unsubscribe');

    var newRows = [], touchedDeals = {}, optOuts = [];
    queries.forEach(function (q) {
      GmailApp.search(q, 0, 100).forEach(function (thread) {
        thread.getMessages().forEach(function (msg) {
          var mid = msg.getId();
          if (seen[mid]) return;
          var from = parseFrom_(msg.getFrom());
          if (!from.email || mine.indexOf(from.email) > -1) return;
          var subject = msg.getSubject();
          var body = stripQuoted_(msg.getPlainBody());
          var full = subject + '\n' + msg.getPlainBody();
          var dm = full.match(DEAL_ID_RE);
          var dealId = dm ? dm[0].toUpperCase() : '';
          var type = classifyReply_(subject, body);
          if (!dealId && type !== 'Unsubscribe') return;
          var inv = byEmail[from.email];
          if (!inv) {
            var rm = full.match(INVESTOR_REF_RE);
            if (rm) inv = byId[rm[0].toUpperCase()];
          }
          seen[mid] = true;
          var deal = deals[dealId] || null;
          newRows.push({
            id: shortId_('R-'), dealId: dealId, property: deal ? dealTitle_(deal) : '',
            investorId: inv ? inv.id : '', investorName: inv ? investorName_(inv) : (from.name || from.email),
            investorEmail: from.email, received: msg.getDate(), type: type,
            offerAmount: type === 'Offer' ? parseOffer_(body) : '', message: body,
            source: 'Email (auto)', followUp: type === 'Unsubscribe' || type === 'Not Interested' ? 'Closed' : 'New',
            passReason: type === 'Not Interested' ? passReasonOf_(body) : '',
            notes: inv ? '' : 'Sender not in investor database', messageId: mid
          });
          if (dealId) touchedDeals[dealId] = true;
          if (type === 'Unsubscribe' && inv) optOuts.push(inv);
        });
      });
    });

    appendObjects_(SHEET.RESPONSES, newRows);
    var offersCreated = 0;
    newRows.forEach(function (r) {
      if (!r.dealId) return;
      if (r.type === 'Offer' && createOfferFromResponse_(r)) offersCreated++;
      if (r.type === 'Interested' || r.type === 'Offer') advanceStage_(r.dealId, 'Buyer Interested');
    });
    optOuts.forEach(function (inv) {
      updateObject_(SHEET.INVESTORS, inv._row, { optOut: true, updated: new Date(), notes: (str_(inv.notes) + ' [Unsubscribed by email ' + fmtDate_(new Date()) + ']').trim() });
    });
    Object.keys(touchedDeals).forEach(recountDeal_);
    setSetting_('LAST_INBOX_SCAN', new Date().toISOString());
    return { found: newRows.length, unsubscribed: optOuts.length, offers: offersCreated, scannedAt: new Date().toISOString() };
  });
}

function listResponses() {
  requireRole_('Viewer');
  return toClient_(readTable_(SHEET.RESPONSES).rows.reverse());
}

/** Manually log a response (phone call, text, in-person). */
function logResponse(r) {
  requireRole_('Rep');
  return withLock_(function () {
    r = r || {};
    if (!r.dealId) throw new Error('Choose a deal.');
    var deal = getDealRow_(r.dealId);
    var inv = r.investorId ? findBy_(SHEET.INVESTORS, 'id', r.investorId) : null;
    if (!inv && !str_(r.investorName) && !str_(r.investorEmail)) throw new Error('Choose an investor or enter a name.');
    var type = RESPONSE_TYPES.indexOf(r.type) > -1 ? r.type : 'Interested';
    var row = {
      id: shortId_('R-'), dealId: deal.id, property: dealTitle_(deal),
      investorId: inv ? inv.id : '', investorName: inv ? investorName_(inv) : str_(r.investorName),
      investorEmail: inv ? lc_(inv.email) : lc_(r.investorEmail), received: new Date(), type: type,
      offerAmount: num_(r.offerAmount), message: str_(r.message), source: 'Manual',
      followUp: FOLLOW_UP_STATUSES.indexOf(r.followUp) > -1 ? r.followUp : 'New', notes: str_(r.notes), messageId: '',
      passReason: type === 'Not Interested' ? (PASS_REASONS.indexOf(r.passReason) > -1 ? r.passReason : passReasonOf_(r.message)) : ''
    };
    appendObjects_(SHEET.RESPONSES, [row]);
    if (type === 'Unsubscribe' && inv) updateObject_(SHEET.INVESTORS, inv._row, { optOut: true, updated: new Date() });
    if (type === 'Interested' || type === 'Offer') advanceStage_(deal.id, 'Buyer Interested');
    if (type === 'Offer') createOfferFromResponse_(row);
    recountDeal_(deal.id);
    return toClient_(row);
  });
}

function updateResponse(id, fields) {
  requireRole_('Rep');
  return withLock_(function () {
    var r = findBy_(SHEET.RESPONSES, 'id', id);
    if (!r) throw new Error('Response not found.');
    var f = {};
    if (fields.followUp !== undefined) f.followUp = str_(fields.followUp);
    if (fields.notes !== undefined) f.notes = str_(fields.notes);
    if (fields.type !== undefined && RESPONSE_TYPES.indexOf(fields.type) > -1) f.type = fields.type;
    if (fields.offerAmount !== undefined) f.offerAmount = num_(fields.offerAmount);
    updateObject_(SHEET.RESPONSES, r._row, f);
    recountDeal_(r.dealId);
    return toClient_(findBy_(SHEET.RESPONSES, 'id', id));
  });
}

/**

 */

var _settings = null;

function settingsSheet_() {
  var ss = ss_();
  var sh = ss.getSheetByName(SHEET.SETTINGS);
  if (!sh) {
    sh = ss.insertSheet(SHEET.SETTINGS);
    sh.getRange(1, 1, 1, 3).setValues([['Setting', 'Value', 'Description']]);
    sh.setFrozenRows(1);
    sh.getRange(1, 1, 1, 3).setFontWeight('bold').setFontColor('#E8F2EC').setBackground('#0B2E21');
    sh.getRange(2, 2, 200, 1).setNumberFormat('@');
  }
  return sh;
}

/** Ensures every default setting exists (never overwrites existing values). */
function ensureSettings_() {
  var sh = settingsSheet_();
  var lastRow = sh.getLastRow();
  var existing = lastRow >= 2 ? sh.getRange(2, 1, lastRow - 1, 1).getValues().map(function (r) { return String(r[0]); }) : [];
  var toAdd = DEFAULT_SETTINGS.filter(function (d) { return existing.indexOf(d[0]) === -1; });
  if (toAdd.length) {
    var me = currentUser_();
    toAdd = toAdd.map(function (d) {
      if ((d[0] === 'TEST_EMAIL' || d[0] === 'REPLY_TO') && !d[1]) return [d[0], me, d[2]];
      return d;
    });
    sh.getRange(sh.getLastRow() + 1, 1, toAdd.length, 3).setValues(toAdd);
  }
  _settings = null;
}

/** Returns all settings as a { KEY: 'value' } map (cached per execution). */
function getSettings_() {
  if (_settings) return _settings;
  var sh = settingsSheet_();
  var out = {};
  DEFAULT_SETTINGS.forEach(function (d) { out[d[0]] = d[1]; });
  var lastRow = sh.getLastRow();
  if (lastRow >= 2) {
    sh.getRange(2, 1, lastRow - 1, 2).getValues().forEach(function (r) {
      if (r[0] !== '') out[String(r[0]).trim()] = r[1] === null ? '' : String(r[1]);
    });
  }
  _settings = out;
  return out;
}

function setSetting_(key, value) {
  var sh = settingsSheet_();
  var lastRow = sh.getLastRow();
  var keys = lastRow >= 2 ? sh.getRange(2, 1, lastRow - 1, 1).getValues().map(function (r) { return String(r[0]); }) : [];
  var idx = keys.indexOf(key);
  var desc = '';
  DEFAULT_SETTINGS.forEach(function (d) { if (d[0] === key) desc = d[2]; });
  if (idx === -1) sh.getRange(sh.getLastRow() + 1, 1, 1, 3).setValues([[key, cellValue_(value), desc]]);
  else sh.getRange(idx + 2, 2).setValue(cellValue_(value));
  _settings = null;
}

// ---- SkipTrace.gs ----
/**
 * Automatic skip tracing (BatchData API, v3 Property Skip Trace).
 *
 * Buyers found in public records usually have no email. After every intake run,
 * buyers missing an email are skip traced automatically: the best email, the best
 * phone and the contact person (for LLCs) are filled in, and the rest are kept in
 * the notes. BatchData only bills for properties it matches, and the app keeps a
 * monthly match limit. The API key is stored privately in script properties.
 *
 * Docs: https://developer.batchdata.com/docs/batchdata/batchdata-v3/operations/create-a-property-skip-trace
 */

var BD_SKIPTRACE_URL = 'https://api.batchdata.com/api/v3/property/skip-trace';
var BD_BATCH = 25;   // properties per request (API allows 100; smaller keeps each call well under the timeout)

function bdKey_() { return PropertiesService.getScriptProperties().getProperty('BD_API_KEY') || ''; }
function bdMonthKey_() { return 'BD_MATCHES_' + fmtDate_(new Date(), 'yyyyMM'); }
function bdMatchesUsed_() { return parseInt(PropertiesService.getScriptProperties().getProperty(bdMonthKey_()) || '0', 10) || 0; }
function bdAddMatches_(n) {
  if (!n) return;
  PropertiesService.getScriptProperties().setProperty(bdMonthKey_(), String(bdMatchesUsed_() + Number(n)));
}

/** POSTs to BatchData. Retries once on rate limit / temporary outage. */
function bdFetch_(body, key) {
  key = key || bdKey_();
  if (!key) throw new Error('Add your BatchData API key first (New Buyers → Automatic Skip Trace).');
  for (var attempt = 0; attempt < 2; attempt++) {
    var res = UrlFetchApp.fetch(BD_SKIPTRACE_URL, {
      method: 'post', contentType: 'application/json', muteHttpExceptions: true, followRedirects: false,
      headers: { Authorization: 'Bearer ' + key, Accept: 'application/json' }, payload: JSON.stringify(body)
    });
    var code = res.getResponseCode();
    var json = {};
    try { json = JSON.parse(res.getContentText() || '{}'); } catch (e) { json = {}; }
    if (code >= 200 && code < 300) return json;
    if ((code === 429 || code >= 502) && attempt === 0) { Utilities.sleep(8000); continue; }
    var msg = (json.status && (json.status.message || json.status.text)) || res.getContentText().slice(0, 200);
    throw new Error({
      401: 'BatchData rejected the API key (' + msg + '). Copy the key again from app.batchdata.com → Settings → API Tokens.',
      403: 'Your BatchData account can\'t use skip trace (' + msg + '). Check the token\'s permissions or your plan.',
      402: 'Your BatchData account is out of funds. Add funds at app.batchdata.com.',
      429: 'BatchData rate limit reached — it will continue on the next run.'
    }[code] || ('BatchData error ' + code + ': ' + msg));
  }
  throw new Error('BatchData is busy right now — it will try again on the next run.');
}

/** "123 Main St, Norfolk, VA 23510" → { street, city, state, zip } (county names go to `county`). */
function parseAddress_(s) {
  var parts = String(s || '').split(',').map(function (x) { return x.trim(); }).filter(String);
  if (!parts.length || !/\d/.test(parts[0])) return null;
  var out = { street: parts[0] };
  var last = parts.length > 1 ? parts[parts.length - 1] : '';
  var m = last.match(/^([A-Za-z]{2})(?:\s+(\d{5})(?:-\d{4})?)?$/);
  var city = parts.slice(1, m ? -1 : undefined).join(', ');
  if (/\bcounty\b/i.test(city)) out.county = city.replace(/\s*county\b.*$/i, '').trim();
  else if (city) out.city = city;
  if (m) { out.state = m[1].toUpperCase(); if (m[2] && m[2] !== '00000') out.zip = m[2]; }
  return out;
}

/** Buyers that still need contact info, new buyers first. */
function skipTraceCandidates_(ids) {
  var s = getSettings_();
  var activeToo = bool_(s.SKIPTRACE_ACTIVE_TOO);
  var t = readTable_(SHEET.INVESTORS);
  var want = ids ? ids.reduce(function (m, id) { m[id] = true; return m; }, {}) : null;
  return t.rows.filter(function (r) {
    if (str_(r.email) || bool_(r.optOut)) return false;
    if (want) return !!want[r.id];
    if (str_(r.skipTraced)) return false;   // each buyer is traced automatically once
    var st = str_(r.status);
    return st === PENDING_REVIEW || (activeToo && st === 'Active');
  }).sort(function (a, b) {
    return (str_(a.status) === PENDING_REVIEW ? 0 : 1) - (str_(b.status) === PENDING_REVIEW ? 0 : 1);
  });
}

/** Property address of the buyer's latest purchase (older rows: read from the purchase history). */
function purchaseAddress_(inv) {
  if (str_(inv.lastPurchaseAddress)) return str_(inv.lastPurchaseAddress);
  var first = str_(inv.purchases).split(';')[0].split(' — ')[0].replace(/\s*\(.*$/, '').trim();
  if (!first || !/\d/.test(first)) return '';
  if (/,\s*[A-Z]{2}(\s+\d{5})?$/.test(first)) return first;
  var nc = /elizabeth city|pasquotank|camden|currituck|moyock|perquimans|hertford|chowan|edenton/i.test(first + ' ' + str_(inv.markets));
  return first + ', ' + (nc ? 'NC' : 'VA');
}

function skipTraceRequest_(inv, useMailingAsProperty) {
  var prop = parseAddress_(purchaseAddress_(inv)), mail = parseAddress_(inv.mailingAddress);
  if (useMailingAsProperty || !prop) { prop = mail; mail = null; }
  if (!prop || (!prop.zip && !prop.city && !prop.county)) return null;
  var req = { requestId: String(inv.id), propertyAddress: prop };
  if (prop.county && !prop.state) prop.state = 'VA';
  if (prop.county) { req.county = prop.county; req.state = prop.state; delete prop.county; }
  if (mail && mail.street) { delete mail.county; req.mailingAddress = mail; }
  var company = str_(inv.company) && ENTITY_RE.test(inv.company);
  if (!company && str_(inv.lastName)) req.name = { first: str_(inv.firstName), last: str_(inv.lastName) };
  return req;
}

/** Picks the best email / phone / contact from a v3 result item. */
function skipTracePick_(item) {
  var persons = (item && item.persons || []).filter(function (p) { return p && p.deceased !== true; });
  persons.sort(function (a, b) { return (b.propertyOwner === true ? 1 : 0) - (a.propertyOwner === true ? 1 : 0); });
  var emails = [], phones = [], contact = null, litigator = false;
  persons.forEach(function (p) {
    if (p.litigator) litigator = true;
    var es = (p.emails || []).slice().sort(function (a, b) { return (b.tested ? 1 : 0) - (a.tested ? 1 : 0) || (a.rank || 99) - (b.rank || 99); });
    es.forEach(function (e) { var v = lc_(e.email); if (isEmail_(v) && emails.indexOf(v) === -1) emails.push(v); });
    var ps = (p.phones || []).filter(function (x) { return x.tcpa !== true; }).sort(function (a, b) {
      var sa = (/mobile/i.test(a.type) ? 0 : 1) + (a.dnc ? 2 : 0) + (a.reachable ? 0 : 1);
      var sb = (/mobile/i.test(b.type) ? 0 : 1) + (b.dnc ? 2 : 0) + (b.reachable ? 0 : 1);
      return sa - sb || (a.rank || 99) - (b.rank || 99);
    });
    ps.forEach(function (x) {
      var n = formatPhone_(x.number);
      if (n && !phones.some(function (q) { return q.n === n; })) phones.push({ n: n, dnc: !!x.dnc, type: x.type || '' });
    });
    if (!contact && p.name && (es.length || ps.length)) contact = p.name;
  });
  return { emails: emails, phones: phones, contact: contact, litigator: litigator };
}

/**
 * Skip traces buyers missing an email and writes what it finds. Caller holds the lock.
 * ids (optional) limits it to specific buyers (manual "Skip trace" buttons).
 */
function skipTraceRun_(ids) {
  var s = getSettings_();
  var out = { status: 'ok', traced: 0, found: 0, emails: 0, phones: 0, noMatch: 0, skipped: 0, note: '' };
  if (!bdKey_()) { out.status = 'off'; out.note = 'Add a BatchData API key to skip trace automatically.'; return out; }
  if (!ids && !bool_(s.SKIPTRACE_ON)) { out.status = 'off'; return out; }
  var cap = parseInt(s.SKIPTRACE_MONTHLY_CAP, 10) || 0;
  var room = cap ? cap - bdMatchesUsed_() : Infinity;
  if (room <= 0) { out.status = 'capped'; out.note = 'Monthly skip-trace limit reached (' + cap + ' matches). Raise it on the Skip Trace card.'; return out; }
  var max = Math.max(1, parseInt(s.SKIPTRACE_MAX_PER_RUN, 10) || 100);
  var cands = skipTraceCandidates_(ids).slice(0, Math.min(max, room));
  if (!cands.length) { out.note = 'No buyers missing an email.'; return out; }
  var t = readTable_(SHEET.INVESTORS);
  var rowOf = {};
  t.rows.forEach(function (r) { rowOf[r.id] = r._row; });
  var byId = {}, results = {};
  cands.forEach(function (c) { byId[c.id] = c; });

  var pass = function (list, mailingAsProperty) {
    var reqs = [];
    list.forEach(function (inv) { var r = skipTraceRequest_(inv, mailingAsProperty); if (r) reqs.push(r); });
    for (var i = 0; i < reqs.length; i += BD_BATCH) {
      var chunk = reqs.slice(i, i + BD_BATCH);
      var json = bdFetch_({ requests: chunk, options: { includeTCPABlacklistedPhones: false, prioritizeMobilePhones: true } });
      var data = (json.result && json.result.data) || [];
      var meta = (json.result && json.result.meta && json.result.meta.results) || {};
      bdAddMatches_(Number(meta.matchCount) || 0);
      data.forEach(function (item, k) {
        var id = (item.input && item.input.requestId) || (chunk[k] && chunk[k].requestId);
        if (!id || !byId[id]) return;
        var pick = skipTracePick_(item);
        if (pick.emails.length || pick.phones.length) results[id] = pick;
      });
    }
    return reqs.length;
  };

  var sent = pass(cands, false);
  // second chance: an LLC's mailing address is often its principal's home or office
  var retry = cands.filter(function (c) { return !results[c.id] && parseAddress_(c.mailingAddress) && parseAddress_(purchaseAddress_(c)); });
  if (retry.length) pass(retry, true);

  var today = fmtDate_(new Date(), 'MMM d, yyyy');
  cands.forEach(function (inv) {
    var r = results[inv.id], f = { skipTraced: new Date(), updated: new Date() };
    if (!skipTraceRequest_(inv, false)) {
      out.skipped++;
      f.skipTraceResult = 'No usable address to skip trace';
    } else if (!r) {
      out.noMatch++;
      f.skipTraceResult = 'No match';
    } else {
      out.found++;
      if (r.emails.length) { f.email = r.emails[0]; out.emails++; }
      if (r.phones.length && !str_(inv.phone)) { f.phone = r.phones[0].n; out.phones++; }
      if (r.contact && str_(inv.company) && !str_(inv.firstName) && !str_(inv.lastName)) {
        f.firstName = titleCase_(r.contact.first || ''); f.lastName = titleCase_(r.contact.last || '');
      }
      f.skipTraceResult = (r.emails.length ? 'Email' : 'No email') + (r.phones.length ? ' + phone' : '') + ' found';
      var extra = [];
      if (r.contact && r.contact.full) extra.push('contact ' + titleCase_(r.contact.full));
      if (r.emails.length > 1) extra.push('other emails ' + r.emails.slice(1, 4).join(', '));
      if (r.phones.length) extra.push('phones ' + r.phones.slice(0, 4).map(function (p) { return p.n + (p.type ? ' (' + p.type.toLowerCase() + ')' : '') + (p.dnc ? ' DNC' : ''); }).join(', '));
      if (r.litigator) extra.push('⚠ known TCPA litigator: do not call or text');
      var notes = str_(inv.notes).replace(/\s*Needs an email address before approval \(skip trace this owner\)\.?/, '');
      if (f.email) notes = notes.replace(/\s*Skip traced[^.]*\./g, '');
      f.notes = (notes + ' Skip traced ' + today + ': ' + extra.join('; ') + '.').trim().slice(0, 1500);
    }
    if (rowOf[inv.id]) updateObject_(SHEET.INVESTORS, rowOf[inv.id], f);
    out.traced++;
  });
  out.note = out.traced + ' skip traced: ' + out.emails + ' emails, ' + out.phones + ' phones found' + (out.noMatch ? ', ' + out.noMatch + ' no match' : '') +
    (sent < cands.length ? ', ' + (cands.length - sent) + ' without an address' : '');
  setSetting_('LAST_SKIPTRACE', JSON.stringify({ at: new Date().toISOString(), note: out.note }));
  return out;
}

function skipTraceStatus_() {
  var s = getSettings_();
  var last = {};
  try { last = JSON.parse(s.LAST_SKIPTRACE || '{}'); } catch (e) { last = {}; }
  var key = bdKey_();
  return {
    hasKey: !!key, keyHint: key ? '…' + key.slice(-4) : '', on: bool_(s.SKIPTRACE_ON),
    matchesThisMonth: bdMatchesUsed_(), cap: parseInt(s.SKIPTRACE_MONTHLY_CAP, 10) || 0,
    waiting: skipTraceCandidates_().length, last: last
  };
}

// ---------- client API ----------

/** Saves and tests the BatchData API key (stored privately, never in the sheet). */
function saveSkipTraceKey(key) {
  requireRole_('Owner');
  key = str_(key).replace(/^Bearer\s+/i, '');
  var props = PropertiesService.getScriptProperties();
  if (!key) { props.deleteProperty('BD_API_KEY'); return getIntakeStatus(); }
  if (!/^[A-Za-z0-9_\-]{20,}$/.test(key)) throw new Error('That doesn\'t look like a BatchData API token (a long string of letters and numbers).');
  // An empty request is free: a bad key answers 401, a good key answers 400 (no properties).
  try { bdFetch_({ requests: [] }, key); } catch (e) {
    if (/rejected the API key|can't use skip trace|out of funds/.test(e.message)) throw e;
  }
  props.setProperty('BD_API_KEY', key);
  return getIntakeStatus();
}

/** "Skip trace now": all buyers missing an email, or just the given ids. */
function skipTraceNow(ids) {
  requireRole_('Rep');
  return withLock_(function () {
    var r = skipTraceRun_(ids && ids.length ? ids : null);
    if (r.status === 'off' && !bdKey_()) throw new Error(r.note);
    if (r.status === 'capped') throw new Error(r.note);
    return { result: r, status: getIntakeStatus() };
  });
}

/** Saves an email / phone found by hand (free people-search lookup). */
function setInvestorContact(id, email, phone) {
  requireRole_('Rep');
  email = lc_(email).replace(/^mailto:/, '');
  phone = str_(phone);
  if (email && !isEmail_(email)) throw new Error('That email address doesn\'t look right.');
  if (!email && !phone) throw new Error('Enter an email or a phone number.');
  return withLock_(function () {
    var t = readTable_(SHEET.INVESTORS);
    var inv = t.rows.filter(function (r) { return r.id === id; })[0];
    if (!inv) throw new Error('Buyer not found.');
    if (email) {
      var dup = t.rows.filter(function (r) { return r.id !== id && lc_(r.email) === email; })[0];
      if (dup) throw new Error('That email already belongs to ' + investorName_(dup) + ' (' + dup.id + ').');
    }
    var f = { updated: new Date(), skipTraced: new Date(), skipTraceResult: 'Looked up by hand' };
    if (email) f.email = email;
    if (phone) f.phone = formatPhone_(phone) || phone;
    if (email) f.notes = str_(inv.notes).replace(/\s*Needs an email address before approval \(skip trace this owner\)\.?/, '').trim();
    updateObject_(SHEET.INVESTORS, inv._row, f);
    Object.keys(f).forEach(function (k) { inv[k] = f[k]; });
    delete inv._row;
    return toClient_(inv);
  });
}

// ---- Verification.gs ----
/**
 * Verification.gs — Buyer Verification Center.
 * Proof of funds (stored privately in Drive), entity, purchase history, completed transactions,
 * contract defaults and an automatic reliability rating. Flags expired / expiring POF and
 * buyers with failed closings.
 */

/** None | Pending (uploaded, not verified) | Verified | Expiring (≤14 days) | Expired */
function pofStatus_(inv) {
  var file = str_(inv.pofFileUrl), verified = inv.pofVerifiedOn;
  if (!file && !verified) return 'None';
  if (!verified) return 'Pending';
  var exp = parseDateLoose_(inv.pofExpires);
  if (exp) {
    var left = exp.getTime() - Date.now();
    if (left < 0) return 'Expired';
    if (left < 14 * 86400000) return 'Expiring';
  }
  return 'Verified';
}

/** 1–5 stars from closings vs defaults; '' when there's no history yet. Manual rating wins if set. */
function reliabilityOf_(inv) {
  var manual = Number(inv.reliability);
  if (manual >= 1 && manual <= 5) return manual;
  var closed = Number(inv.dealsClosed) || 0, defaults = Number(inv.defaults) || 0;
  if (!closed && !defaults) return '';
  return Math.max(1, Math.min(5, Math.round(3 + Math.min(closed, 4) * 0.5 - defaults * 1.5)));
}

function buyerFlags_(inv) {
  var f = [], pof = pofStatus_(inv);
  if (pof === 'Expired') f.push('POF expired');
  if (pof === 'Expiring') f.push('POF expiring soon');
  if (pof === 'Pending') f.push('POF needs verification');
  if (Number(inv.defaults) > 0) f.push(inv.defaults + ' failed closing' + (Number(inv.defaults) > 1 ? 's' : ''));
  return f;
}

function pofFolder_() {
  var props = PropertiesService.getScriptProperties();
  var id = props.getProperty('POF_FOLDER_ID');
  if (id) { try { return DriveApp.getFolderById(id); } catch (e) { /* recreate */ } }
  var folder = rootFolder_().createFolder('Proof of Funds (private)'); // never shared by link
  props.setProperty('POF_FOLDER_ID', folder.getId());
  return folder;
}

/** Upload a proof-of-funds document for a buyer (status becomes Pending until verified). */
function uploadPof(investorId, fileName, mimeType, base64, amount, expires) {
  requireRole_('Rep');
  var inv = findBy_(SHEET.INVESTORS, 'id', investorId);
  if (!inv) throw new Error('Buyer not found.');
  var file = pofFolder_().createFile(blobFromBase64_(base64, mimeType, investorId + ' — POF — ' + (fileName || 'document')));
  return withLock_(function () {
    var fresh = findBy_(SHEET.INVESTORS, 'id', investorId);
    var f = { pofFileUrl: file.getUrl(), pofVerifiedOn: '', updated: new Date() };
    if (amount !== undefined && amount !== '') f.pofAmount = num_(amount);
    if (expires) f.pofExpires = str_(expires);
    updateObject_(SHEET.INVESTORS, fresh._row, f);
    return cleanInvestorRow_(findBy_(SHEET.INVESTORS, 'id', investorId));
  });
}

/** Mark POF verified (sets amount / expiry; default expiry = today + POF_VALID_DAYS). */
function verifyPof(investorId, amount, expires) {
  requireRole_('Rep');
  return withLock_(function () {
    var inv = findBy_(SHEET.INVESTORS, 'id', investorId);
    if (!inv) throw new Error('Buyer not found.');
    var days = parseInt(getSettings_().POF_VALID_DAYS, 10) || 90;
    var exp = str_(expires) || fmtDate_(new Date(Date.now() + days * 86400000));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(exp)) throw new Error('Expiry must be a date.');
    var f = { pofVerifiedOn: new Date(), pofExpires: exp, updated: new Date() };
    if (amount !== undefined && amount !== '') f.pofAmount = num_(amount);
    updateObject_(SHEET.INVESTORS, inv._row, f);
    return cleanInvestorRow_(findBy_(SHEET.INVESTORS, 'id', investorId));
  });
}

function recordBuyerOutcome(investorId, outcome, dealId, note) {
  requireRole_('Rep');

}

function recordBuyerOutcome_(investorId, outcome, dealId, note) {
  var inv = findBy_(SHEET.INVESTORS, 'id', investorId);
  if (!inv) throw new Error('Buyer not found.');
  var f = { updated: new Date() };
  var deal = dealId ? findBy_(SHEET.DEALS, 'id', dealId) : null;
  if (outcome === 'closed') {
    f.dealsClosed = (Number(inv.dealsClosed) || 0) + 1;
    if (deal) f.lastDealBought = deal.id + ' — ' + dealTitle_(deal) + ' (' + fmtDate_(new Date(), 'MMM d, yyyy') + ')';
  } else if (outcome === 'default') {
    f.defaults = (Number(inv.defaults) || 0) + 1;
    f.notes = (str_(inv.notes) + ' [Failed closing' + (deal ? ' on ' + deal.id : '') + ' ' + fmtDate_(new Date()) + (note ? ': ' + note : '') + ']').trim();
  } else throw new Error('Unknown outcome.');
  updateObject_(SHEET.INVESTORS, inv._row, f);
  return cleanInvestorRow_(findBy_(SHEET.INVESTORS, 'id', investorId));
}

function setBuyerRating(investorId, rating) {
  requireRole_('Rep');
  return withLock_(function () {
    var inv = findBy_(SHEET.INVESTORS, 'id', investorId);
    if (!inv) throw new Error('Buyer not found.');
    var r = Number(rating);
    updateObject_(SHEET.INVESTORS, inv._row, { reliability: r >= 1 && r <= 5 ? r : '', updated: new Date() });
    return cleanInvestorRow_(findBy_(SHEET.INVESTORS, 'id', investorId));
  });
}

/** Everything the Verification Center screen needs. */
function getVerificationCenter() {
  requireRole_('Viewer');
  var invs = readTable_(SHEET.INVESTORS).rows.filter(function (i) { return str_(i.status) !== 'Inactive'; });
  var activeOffers = {};
  readTable_(SHEET.OFFERS).rows.forEach(function (o) {
    if (['Received', 'Countered', 'Accepted', 'Backup', 'Under Contract'].indexOf(o.status) > -1) activeOffers[o.investorId] = (activeOffers[o.investorId] || 0) + 1;
  });
  var rows = invs.map(function (i) {
    var c = cleanInvestorRow_(i);
    c.activeOffers = activeOffers[i.id] || 0;
    if (c.activeOffers && c.pofStatus !== 'Verified' && c.pofStatus !== 'Expiring') c.flags.push('Active offer without verified POF');
    return c;
  });
  var count = function (fn) { return rows.filter(fn).length; };
  return {
    buyers: rows,
    summary: {
      verified: count(function (r) { return r.pofStatus === 'Verified'; }),
      expiring: count(function (r) { return r.pofStatus === 'Expiring'; }),
      expired: count(function (r) { return r.pofStatus === 'Expired'; }),
      pending: count(function (r) { return r.pofStatus === 'Pending'; }),
      defaults: count(function (r) { return Number(r.defaults) > 0; }),
      offersNoPof: count(function (r) { return r.activeOffers && ['Verified', 'Expiring'].indexOf(r.pofStatus) === -1; })
    }
  };
}

function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read ' + file.name));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error(file.name + ' is not a supported image (use JPG or PNG; convert HEIC first).'));
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve({ name: file.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', dataUrl: c.toDataURL('image/jpeg', quality) });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function addPhotos(files) {
  const arr = Array.from(files || []).filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif)$/i.test(f.name));
  if (!arr.length) return toast('Please choose image files.', 'warn');
  for (const file of arr) {
    try {
      const p = await compressImage(file, 1600, 0.82);
      if (S.params.id) {
        p.uploading = true; S.pendingPhotos.push(p); renderPhotos();
        await api('uploadDealPhoto', S.params.id, p.name, p.mime, p.dataUrl);
        S.pendingPhotos = S.pendingPhotos.filter(x => x !== p);
        S.photoPreviews = await api('getDealPhotoPreviews', S.params.id);
        syncDealPhotos();
      } else {
        S.pendingPhotos.push(p);
      }
      renderPhotos();
    } catch (e) { S.pendingPhotos = S.pendingPhotos.filter(x => !x.uploading); renderPhotos(); fail(e); }
  }
}
function syncDealPhotos() {
  const d = S.deals.find(x => x.id === S.params.id);
  if (d && S.photoPreviews) d.photoIds = S.photoPreviews.map(p => p.id);
}

function pickVideo(file) {
  if (!file) return;
  if (file.size > 45 * 1024 * 1024) return toast('That video is over 45 MB. Upload it to YouTube, Loom or Google Drive and paste the link instead.', 'warn');
  const r = new FileReader();
  r.onload = () => {
    S.pendingVideo = { name: file.name, mime: file.type || 'video/mp4', dataUrl: r.result };
    if (S.params.id) uploadPendingVideo(S.params.id).then(d => { if (d) { replaceDeal(d); S.form.videoUrl = d.videoUrl; const vi = $('[name=videoUrl]'); if (vi) vi.value = d.videoUrl; } });
    else $('#videoStatus').textContent = file.name + ' (uploads on save)';
  };
  r.readAsDataURL(file);
}
async function uploadPendingVideo(id) {
  if (!S.pendingVideo) return null;
  const v = S.pendingVideo;
  const st = $('#videoStatus'); if (st) st.innerHTML = '<span class="spinner"></span> Uploading ' + esc(v.name) + '…';
  try {
    const d = await api('uploadDealVideo', id, v.name, v.mime, v.dataUrl);
    S.pendingVideo = null;
    if (st) st.textContent = 'Uploaded ✓ ' + v.name;
    toast('Video uploaded.');
    return d;
  } catch (e) { if (st) st.textContent = 'Upload failed'; fail(e); return null; }
}

function replaceDeal(d) {
  const i = S.deals.findIndex(x => x.id === d.id);
  if (i > -1) S.deals[i] = d; else S.deals.unshift(d);
}

async function saveDealForm(thenSend) {
  const form = $('#dealForm');
  const data = formData(form);
  if (!data.address.trim()) return toast('Property address is required.', 'warn');
  if (!data.askingPrice) return toast('Asking / purchase price is required.', 'warn');
  if (S.params.id) data.id = S.params.id;
  const btn = $('#saveDeal'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving…';
  try {
    let d = await api('saveDeal', data);
    S.form = d;
    if (S.pendingPhotos.length) {
      let n = 0;
      for (const p of S.pendingPhotos.slice()) {
        p.uploading = true; renderPhotos();
        btn.innerHTML = '<span class="spinner"></span> Uploading photo ' + (++n) + ' of ' + S.pendingPhotos.length + '…';
        await api('uploadDealPhoto', d.id, p.name, p.mime, p.dataUrl);
      }
      S.pendingPhotos = [];
    }
    if (S.pendingVideo) { btn.innerHTML = '<span class="spinner"></span> Uploading video…'; await uploadPendingVideo(d.id); }
    d = await api('getDeal', d.id);
    replaceDeal(d);
    toast('Deal <b>' + esc(d.id) + '</b> saved.');
    go('deal', { id: d.id });
    if (thenSend) openDistribute(d.id);
  } catch (e) {
    fail(e);
    btn.disabled = false; btn.textContent = S.params.id ? 'Save Changes' : 'Save Deal';
  }
}

async function distConfirm() {

}

async function saveInvestorModal(id) {
  const form = $('#invForm');
  const data = formData(form);
  ['categories', 'markets', 'propertyTypes'].forEach(g => {
    const extra = $('[data-chipextra="' + g + '"]', form);
    data[g] = uniq(chipVals(g, form).concat(extra ? list(extra.value) : [])).join(', ');
  });
  if (id) data.id = id;
  try {
    const saved = await api('saveInvestor', data);
    const ix = S.investors.findIndex(x => x.id === saved.id);
    if (ix > -1) S.investors[ix] = saved; else S.investors.push(saved);
    closeModal(); toast('Saved ' + esc(saved.firstName || saved.company || saved.email) + '.'); render();
  } catch (e) { fail(e); }
}

async function bulk(changes, label) {
  const ids = Array.from(S.selected);
  try {
    const r = await api('updateInvestors', ids, changes);
    S.investors = r.investors; toast(label + ' — ' + r.updated + ' investors updated.'); render();
  } catch (e) { fail(e); }
}

// ---------- free people-search lookups (open in the user's own browser) ----------
function splitAddr(a) {
  const p = String(a || '').split(',').map(x => x.trim()).filter(Boolean);
  if (!p.length || !/\d/.test(p[0]) || /^p\.?\s*o\.?\s*box/i.test(p[0])) return null;
  const m = (p[p.length - 1] || '').match(/^([A-Za-z]{2})(?:\s+(\d{5}))?/);
  const city = p.slice(1, m ? -1 : undefined).join(' ').replace(/\s*county\b.*$/i, '');
  return { street: p[0].replace(/^0+(?=\d)/, '').replace(/\s+(ste|suite|unit|apt|#)\b.*$/i, ''), city, state: m ? m[1].toUpperCase() : '', zip: m && m[2] && m[2] !== '00000' ? m[2] : '' };
}
const slug = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function lookupLinks(i) {
  const isCo = !!i.company && !(i.firstName || i.lastName);
  const mail = splitAddr(i.mailingAddress);
  const name = (i.firstName + ' ' + i.lastName).trim();
  const links = [];
  const csz = a => a.city ? a.city + ', ' + a.state : a.zip || a.state;
  if (!isCo && name && mail) {
    links.push(['TruePeopleSearch', 'https://www.truepeoplesearch.com/results?name=' + encodeURIComponent(name) + '&citystatezip=' + encodeURIComponent(csz(mail))]);
    links.push(['CyberBackgroundChecks', 'https://www.cyberbackgroundchecks.com/people/' + slug(name) + '/' + slug(mail.state) + (mail.city ? '/' + slug(mail.city) : '')]);
  } else if (mail && mail.city) {
    // an LLC's mailing address is often the owner's home or office: search who lives there
    links.push(['TruePeopleSearch', 'https://www.truepeoplesearch.com/resultaddress?streetaddress=' + encodeURIComponent(mail.street) + '&citystatezip=' + encodeURIComponent(csz(mail))]);
    links.push(['CyberBackgroundChecks', 'https://www.cyberbackgroundchecks.com/address/' + slug(mail.street) + '/' + slug(mail.city) + '/' + slug(mail.state)]);
  }
  if (isCo) {
    const nc = /, NC\b/.test(i.mailingAddress || '') || /elizabeth city|camden|currituck|perquimans|chowan/i.test(i.markets || '');
    links.push([nc ? 'NC company owner' : 'VA company owner', nc ? 'https://www.sosnc.gov/online_services/search/by_title/_Business_Registration' : 'https://cis.scc.virginia.gov/EntitySearch/Index', i.company]);
  }
  return '<div class="small" style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px">' +
    links.map(l => '<a href="' + esc(l[1]) + '" target="_blank" rel="noopener"' + (l[2] ? ' data-act="copyName" data-name="' + esc(l[2]) + '" title="Copies the company name so you can paste it into the search"' : '') + '>' + esc(l[0]) + ' ↗</a>').join('') +
    '<a href="#" data-act="contactOpen" data-id="' + esc(i.id) + '">+ Add email</a></div>' +
    (S.contactFor === i.id ? '<div style="display:flex;gap:4px;margin-top:4px"><input id="cEmail" type="email" placeholder="email" style="min-width:150px;padding:5px 8px"><input id="cPhone" type="tel" placeholder="phone" style="width:120px;padding:5px 8px"><button class="btn sm primary" data-act="contactSave" data-id="' + esc(i.id) + '">Save</button></div>' : '');
}

function pofUploadFile(id, file) {
  if (file.size > 20 * 1024 * 1024) return toast('That file is over 20 MB.', 'warn');
  const r = new FileReader();
  r.onload = async () => {
    const amount = window.prompt ? (prompt('Proof of funds amount (optional):', '') || '') : '';
    toast('Uploading proof of funds…');
    try { await api('uploadPof', id, file.name, file.type || 'application/pdf', r.result, amount, ''); S.ver = null; S.investors = await api('listInvestors'); toast('POF uploaded — click Verify once reviewed.'); render(); } catch (e) { fail(e); }
  };
  r.readAsDataURL(file);
}

function fuTable(items) {

/** Horizontal bars (single series, one hue): value label at the tip, tooltip on hover. */
function barList(rows, val, fmt) {
  const max = Math.max(1, ...rows.map(val));
  if (!rows.length) return '<div class="empty" style="padding:24px">No data yet.</div>';
  return '<div role="list" style="display:grid;grid-template-columns:minmax(90px,160px) 1fr;gap:8px 12px;align-items:center">' + rows.map(r => {
    const v = val(r), w = Math.max(v > 0 ? 1.5 : 0, (v / max) * 100);
    return '<div class="small" style="color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(r.name) + '">' + esc(r.name) + '</div>' +
      '<div role="listitem" aria-label="' + esc(r.name + ': ' + fmt(v)) + '" title="' + esc(r.name + ' — ' + fmt(v) + (r.deals !== undefined ? ' · ' + r.deals + ' deal' + (r.deals === 1 ? '' : 's') : '')) + '" style="display:flex;align-items:center;gap:8px;min-height:22px;cursor:default">' +
      '<div style="height:16px;width:' + w + '%;background:var(--accent);border-radius:0 4px 4px 0"></div><span class="small" style="color:var(--text);white-space:nowrap">' + fmt(v) + '</span></div>';
  }).join('') + '</div>';
}
/** Columns over time (single series): value on the cap, tooltip on hover. */
function columns(rows, val, fmt) {
  const max = Math.max(1, ...rows.map(val));
  return '<div style="display:flex;align-items:flex-end;gap:14px;height:190px;padding:18px 4px 0;border-bottom:1px solid var(--line-2)">' + rows.map(r => {
    const v = val(r), h = Math.max(v > 0 ? 2 : 0, (v / max) * 140);
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%" title="' + esc(r.name + ' — ' + fmt(v) + ' · ' + r.deals + ' closed') + '">' +
      '<span class="small" style="color:var(--text);margin-bottom:4px">' + (v ? fmt(v) : '') + '</span><div style="width:22px;height:' + h + 'px;background:var(--accent);border-radius:4px 4px 0 0"></div></div>';
  }).join('') + '</div><div style="display:flex;gap:14px;padding:6px 4px 0">' + rows.map(r => '<div class="small muted" style="flex:1;text-align:center">' + esc(r.name.replace(/ \d{4}$/, '')) + '</div>').join('') + '</div>';
}
const tableOf = (rows, cols) => '<table class="t"><thead><tr>' + cols.map(c => '<th>' + c[0] + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + cols.map(c => '<td>' + c[1](r) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
const heatChip = h => { const c = h >= 70 ? 'var(--accent-2)' : h >= 40 ? 'var(--amber)' : 'var(--muted)'; return '<span title="Heat score" style="color:' + c + ';font-weight:700">' + (h >= 70 ? '🔥 ' : '') + h + '</span>'; };
const loadView = (key, fn, args) => { if (!S[key]) api(fn, ...(args || [])).then(d => { S[key] = d; render(); }).catch(fail); };

        p.fields.map(f => field(IMPORT_LABELS[f], sel('map_' + f, p.mapping[f] !== undefined ? String(p.mapping[f]) : '', colOpts))).join('') + '</div></div>' +
        '<div class="bd" style="padding-top:0"><div class="section-title">Sample rows</div><div class="table-wrap" style="max-height:260px"><table class="t"><thead><tr>' + p.headers.map(hh => '<th>' + esc(hh) + '</th>').join('') + '</tr></thead><tbody>' +
        p.sample.map(r => '<tr>' + r.map(c => '<td class="small">' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div></div></div>' +
        '<div class="card"><div class="hd"><h3>3 · Import</h3></div><div class="bd"><div class="grid g4" style="align-items:end">' +
        field('Default tier (if blank)', sel('impTier', '', L().tiers, '—')) + field('Add category to all', sel('impCat', '', L().categories, '—')) +
        '<div>' + chk('impUpdate', true, 'Update investors that already exist (matched by email)') + '</div>' +
        '<button class="btn primary" data-act="impRun" id="impRun">' + icon('upload') + 'Import ' + p.totalRows + ' rows</button></div>' +
        (m.result ? '<div class="confirm-box test" style="margin-top:18px;border-color:var(--green-600);background:var(--green-900)"><h4>Import complete</h4>' +
          '<b>' + m.result.added + '</b> added · <b>' + m.result.updated + '</b> updated · ' + m.result.skipped + ' already existed (skipped) · ' + m.result.duplicatesInFile + ' duplicates in sheet · ' + m.result.invalid.length + ' invalid emails' +
          (m.result.invalid.length ? '<div class="small muted" style="margin-top:8px">Invalid: ' + m.result.invalid.map(x => 'row ' + x.row + ' (' + esc(x.value) + ')').join(', ') + '</div>' : '') +
          '<div style="margin-top:12px"><button class="btn sm" data-go="investors">View investors →</button></div></div>' : '') + '</div></div>';
    }
    return h;
  }
};

// ============================================================
const ACT = {
  closeModal,
  ceoTable: () => { S.ceoTable = !S.ceoTable; render(); },
  priceDrop: el => openDistribute(el.dataset.id, 'priceDrop'),
  recover: el => openDistribute(el.dataset.id, 'recovery'),

  tiersApply: async el => {
    if (!confirmSafe('Apply ' + S.tiersData.plan.length + ' tier changes?')) return;
    el.disabled = true;
    try { S.tiersData = await api('runTierUpgradesNow'); S.investors = await api('listInvestors'); toast(S.tiersData.applied + ' tier change(s) applied.'); render(); } catch (e) { fail(e); el.disabled = false; }
  },
  reactAll: () => { S.tiersData.reactivation.forEach(r => S.reactSel.add(r.id)); render(); },
  reactLaunch: () => {
    const n = S.reactSel.size, test = S.settings.testMode;
    openModal('Send reactivation email', '<div class="confirm-box ' + (test ? 'test' : 'live') + '"><h4>' + (test ? 'Test mode — delivered to your test address' : n + ' real buyers') + '</h4><p>Each buyer gets an individual "Still buying? Update your buy box" email' + (S.settings.values.BUYER_FORM_URL ? ' linking to your VIP signup form' : '') + '. Buyers are contacted at most once every ' + esc(S.settings.values.REACTIVATE_DAYS) + ' days.</p>' +
      (test ? '' : '<div class="field"><label>Type <b style="color:#fff;letter-spacing:2px">SEND</b> to confirm</label><input type="text" class="confirm-input" id="reactText" autocomplete="off"></div>') + '</div>',
      '<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn-send" data-act="reactGo">' + icon('send') + 'Send</button>');
  },
  reactGo: async el => {
    el.disabled = true;
    try { const r = await api('launchReactivation', Array.from(S.reactSel), ($('#reactText') || {}).value || ''); closeModal(); S.reactSel.clear(); S.tiersData = r; toast('Reactivation sent to ' + r.sent + ' buyer' + (r.sent === 1 ? '' : 's') + '.'); render(); } catch (e) { fail(e); el.disabled = false; }
  },
  saveMarkets: async el => { try { S.settings = await api('saveSettings', formData($('#mkForm'))); S.marketsData = null; toast('Markets saved.'); render(); } catch (e) { fail(e); } },
  setStage: async el => {
    const id = el.dataset.id, st = el.dataset.val, d = S.deals.find(x => x.id === id) || {};
    if (st === d.stage) return;
    if (st === 'Closed' && !confirmSafe('Mark ' + (d.address || id) + ' as CLOSED? This records a completed transaction for the selected buyer.')) return;
    if (st === 'Dead Deal' && !confirmSafe('Mark ' + (d.address || id) + ' as a DEAD deal? It will stop all distribution.')) return;
    try { replaceDeal(await api('setDealStage', id, st, {})); S.pipe = null; toast(esc(d.address || id) + ' → <b>' + esc(st) + '</b>'); render(); } catch (e) { fail(e); }
  },
  matchTab: el => { S.matchTab = el.dataset.val; render(); },
  newOffer: el => offerModal(el.dataset.id, null),
  editOffer: el => { const o = (S.dealOffers || S.offersAll || []).find(x => x.id === el.dataset.id); if (o) offerModal(o.dealId, o); },
  saveOffer: async el => {
    const v = formData($('#offerForm')); v.dealId = el.dataset.deal; if (el.dataset.id) v.id = el.dataset.id;
    try { await api('saveOffer', v); closeModal(); toast('Offer saved.'); await afterOfferChange(v.dealId, null); } catch (e) { fail(e); }
  },
  offerStatus: async el => {
    const st = el.dataset.val;
    const msg = { Accepted: 'Accept this offer? The buyer becomes the selected buyer; other open offers move to Backup.', 'Fell Through': 'Mark as fallen through? This records a failed closing on the buyer\'s profile and reopens the deal.', Rejected: 'Reject this offer?' }[st];
    if (msg && !confirmSafe(msg)) return;
    try { const c = await api('setOfferStatus', el.dataset.id, st, {}); toast('Offer ' + st.toLowerCase() + '.'); await afterOfferChange(c.deal.id, c); } catch (e) { fail(e); }
  },
  offerCounter: el => {
    openModal('Counter offer', '<div class="grid g2" id="ctrForm">' + field('Counter amount', moneyInp('counter', '')) + '</div><p class="small muted">Records the counter on the offer and moves the deal to Negotiating. Send the counter to the buyer by email or phone.</p>',
      '<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveCounter" data-id="' + esc(el.dataset.id) + '">Save counter</button>');
  },
  saveCounter: async el => {
    const v = formData($('#ctrForm'));
    try { const c = await api('setOfferStatus', el.dataset.id, 'Countered', { counter: v.counter }); closeModal(); toast('Counter recorded.'); await afterOfferChange(c.deal.id, c); } catch (e) { fail(e); }
  },
  verTab: el => { S.verFilter = el.dataset.val; render(); },
  pofUpload: el => { S.pofFor = el.dataset.id; $('#pofInput').click(); },

      '<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveVerify" data-id="' + esc(el.dataset.id) + '">Mark verified</button>');

  },
  outcome: async el => {
    const def = el.dataset.val === 'default';

    try { await api('recordBuyerOutcome', el.dataset.id, el.dataset.val, '', ''); S.ver = null; S.investors = await api('listInvestors'); toast(def ? 'Failed closing recorded.' : 'Completed transaction recorded.'); render(); } catch (e) { fail(e); }
  },
  fuToggle: async el => { try { S.fu = await api(el.dataset.val === 'on' ? 'enableFollowUps' : 'disableFollowUps'); S.settings = await api('getSettings'); toast('Automatic follow-ups ' + (el.dataset.val === 'on' ? 'on' : 'off') + '.'); render(); } catch (e) { fail(e); } },
  fuRun: async el => {

    try { S.fu = await api('runFollowUpsNow'); S.fuDue = S.fu.due.length; toast('Sent ' + S.fu.run.sent + ' buyer follow-up' + (S.fu.run.sent === 1 ? '' : 's') + ' and ' + S.fu.run.alerts + ' rep alert' + (S.fu.run.alerts === 1 ? '' : 's') + '.'); render(); } catch (e) { fail(e); el.disabled = false; }
  },
  intakeRun: async el => {
    const old = el.innerHTML; el.disabled = true; el.innerHTML = '<span class="spinner"></span> Finding buyers…';
    try {
      const st = await api('runBuyerIntakeNow');
      S.intake = st; S.investors = await api('listInvestors');
      const errs = Object.keys(st.run.results).filter(k => st.run.results[k].status === 'error');
      const act = st.run.results.active || {}, lg = st.ledger || {};
      const why = st.run.added ? '' : ' Each purchase is only counted once, so a buyer shows up when they reach ' + (lg.minBuys || 3) + ' purchases in ' + (lg.days || 90) + ' days.' +
        (act.logged ? ' ' + act.logged + ' new purchases logged this time.' : '') + (lg.almost ? ' ' + lg.almost + ' investors are one purchase away.' : '') +
        (st.pending ? ' ' + st.pending + ' buyers are already waiting for your review below.' : '');
      toast('<b>' + st.run.added + '</b> new buyer' + (st.run.added === 1 ? '' : 's') + ' added for review.' + why + (errs.length ? ' ' + errs.length + ' source(s) had errors — see below.' : ''), errs.length || !st.run.added ? 'warn' : '');
      render();
    } catch (e) { fail(e); el.disabled = false; el.innerHTML = old; }

  },
  createForm: async el => {

  },
  copyFormUrl: () => {
    const i = $('#formUrl'); i.select();
    const done = () => toast('Signup link copied.');
    if (navigator.clipboard) navigator.clipboard.writeText(i.value).then(done).catch(() => { try { document.execCommand('copy'); done(); } catch (e) { toast('Select the link and copy it.', 'warn'); } });

  contactOpen: (el, e) => { if (e) e.preventDefault(); S.contactFor = S.contactFor === el.dataset.id ? null : el.dataset.id; render(); setTimeout(() => { const x = $('#cEmail'); if (x) x.focus(); }, 0); },
