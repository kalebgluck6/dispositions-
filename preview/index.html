// ---- Distribution.gs ----
/**
 * Distribution.gs — the SEND TO INVESTOR NETWORK engine.
 *
 * Flow:
 *   1. previewAudience(dealId, audience)     → who will receive it (live counts in the UI)
 *   2. prepareDistribution(dealId, audience) → locks the recipient list, returns a one-time token
 *   3. confirmDistribution(token, typed)     → LIVE mode requires typing SEND; queues + sends
 *   4. runQueuedDistributions()              → trigger that continues large sends
 *                                              (6-min execution limit, daily Gmail quota)
 *
 * Every investor gets their OWN email (one recipient in the To field, no CC/BCC),
 * so investor addresses are never exposed to each other.
 *
 * audience = {
 *   mode: 'all' | 'segments' | 'selected',
 *   tiers: [], categories: [], markets: [],   // used when mode = 'segments' (OR within a group, AND across groups)
 *   investorIds: [],                          // used when mode = 'selected'
 *   matchCriteria: bool,                      // only investors whose buy box fits the deal
 *   excludeAlreadySent: bool                  // skip investors who already received this deal live
 * }
 */

function lc_(s) { return str_(s).toLowerCase(); }

function overlap_(a, b) {
  var bl = b.map(lc_);
  return a.some(function (x) { return bl.indexOf(lc_(x)) > -1; });
}

/** Does the investor's buy box fit this deal? Empty criteria = no restriction. */
function matchesCriteria_(inv, deal) {
  var types = list_(inv.propertyTypes);
  if (types.length && str_(deal.propertyType) && !overlap_(types, [deal.propertyType])) return false;
  var price = Number(deal.askingPrice) || 0;
  if (price) {
    if (Number(inv.minPrice) && price < Number(inv.minPrice)) return false;
    if (Number(inv.maxPrice) && price > Number(inv.maxPrice)) return false;
  }
  var markets = list_(inv.markets);
  if (markets.length) {
    var dealPlaces = [deal.market, deal.city, deal.state, deal.zip].map(lc_).filter(String);
    if (dealPlaces.length) {
      var hit = markets.some(function (mk) {
        var x = lc_(mk);
        return dealPlaces.some(function (p) { return p === x || (p.length > 2 && x.indexOf(p) > -1) || (x.length > 2 && p.indexOf(x) > -1); });
      });
      if (!hit) return false;
    }
  }
  return true;
}

function resolveOne_(deal, audience, investors, logRows) {
  audience = audience || { mode: 'all' };
  var mode = audience.mode || 'all';
  var tiers = list_(audience.tiers), cats = list_(audience.categories), mkts = list_(audience.markets);
  var picked = audience.investorIds || [];
  var already = {};
  var priorRecipients = {};
  logRows.forEach(function (l) { if (l.dealId === deal.id && l.mode === 'LIVE' && l.status === 'Sent') priorRecipients[l.investorId] = true; });
  if (mode === 'priceDrop') {
    // everyone who already received it + current matches (smart scoring)
    audience = Object.assign({}, audience, { mode: 'smart', includeOthers: false, waves: false, excludeAlreadySent: false, _priceDrop: true });
    mode = 'smart';
  }
  if (mode === 'recovery') {
    // the next ring of buyers: weaker matches who haven't received it yet
    audience = Object.assign({}, audience, { mode: 'smart', waves: false, includeOthers: false, excludeAlreadySent: true,
      minScore: Math.max(20, (parseInt(getSettings_().MATCH_MIN_SCORE, 10) || 50) - 20) });
    mode = 'smart';
  }
  if (audience.excludeAlreadySent) {
    logRows.forEach(function (l) {
      if (l.dealId === deal.id && l.mode === 'LIVE' && l.status === 'Sent') already[l.investorId] = true;
    });
  }
  var ex = { inactive: 0, optedOut: 0, invalidEmail: 0, duplicate: 0, notInSegment: 0, criteria: 0, alreadySent: 0, notMatched: 0 };
  var smart = null;
  if (mode === 'smart') {
    smart = {};
    var minScore = Number(audience.minScore) || parseInt(getSettings_().MATCH_MIN_SCORE, 10) || 50;
    var ctxM = matchContext_(deal.id);
    investors.forEach(function (inv) {
      var m = matchInvestor_(inv, deal, ctxM);
      m.matched = !m.blockers.length && m.score >= minScore;
      smart[inv.id] = m;
    });
    var topRank = 99;
    investors.forEach(function (inv) { if (smart[inv.id].matched && smart[inv.id].tierRank < topRank) topRank = smart[inv.id].tierRank; });
  }
  var seen = {};
  var included = [];
  var reasons = {};
  investors.forEach(function (inv) {
    if (mode === 'selected' && picked.indexOf(inv.id) === -1) return; // not part of the hand-picked list at all
    if ((str_(inv.status) || 'Active') !== 'Active') { ex.inactive++; reasons[inv.id] = 'inactive'; return; }
    if (bool_(inv.optOut)) { ex.optedOut++; reasons[inv.id] = 'optedOut'; return; }
    var email = lc_(inv.email);
    if (!isEmail_(email)) { ex.invalidEmail++; reasons[inv.id] = 'invalidEmail'; return; }
    if (seen[email]) { ex.duplicate++; reasons[inv.id] = 'duplicate'; return; }
    if (mode === 'segments') {
      if (tiers.length && !overlap_([inv.tier], tiers)) { ex.notInSegment++; reasons[inv.id] = 'notInSegment'; return; }
      if (cats.length && !overlap_(list_(inv.categories), cats)) { ex.notInSegment++; reasons[inv.id] = 'notInSegment'; return; }
      if (mkts.length && !overlap_(list_(inv.markets), mkts)) { ex.notInSegment++; reasons[inv.id] = 'notInSegment'; return; }
    }
    if (audience.matchCriteria && !matchesCriteria_(inv, deal)) { ex.criteria++; reasons[inv.id] = 'criteria'; return; }
    var wave = 1, score = '';
    if (smart) {
      var m = smart[inv.id];
      score = m.score;
      if (!m.matched && !(audience._priceDrop && priorRecipients[inv.id])) {
        if (!audience.includeOthers) { ex.notMatched++; reasons[inv.id] = 'notMatched'; return; }
        wave = 3;
      } else wave = audience.waves === false || m.tierRank === topRank ? 1 : 2;
    }
    if (already[inv.id]) { ex.alreadySent++; reasons[inv.id] = 'alreadySent'; return; }
    seen[email] = true;
    inv._wave = wave; inv._score = score;
    included.push(inv);
  });
  // highest priority first: wave, then match score, then tier
  included.sort(function (a, b) { return (a._wave - b._wave) || ((Number(b._score) || 0) - (Number(a._score) || 0)) || (tierRank_(a.tier) - tierRank_(b.tier)); });
  return { included: included, excluded: ex, reasons: reasons };
}

var AUDIENCE_MODES = ['smart', 'all', 'segments', 'selected'];

/** Audience options picked together (any of smart / all / segments / selected). */
function audienceModes_(audience) {
  var m = (audience && audience.modes || []).filter(function (x, i, arr) { return AUDIENCE_MODES.indexOf(x) > -1 && arr.indexOf(x) === i; });
  return m;
}

/**
 * Resolves who receives a deal. Several audience options can be combined: everyone covered by any
 * of them receives it, once. Smart-match buyers keep their priority waves; buyers added only by
 * the other options go out with the first wave, or last (wave 3) when priority waves are on.
 */
function resolveAudience_(deal, audience, investors, logRows) {
  audience = audience || { mode: 'all' };
  var modes = audienceModes_(audience);
  if (modes.length <= 1 || audience.mode === 'priceDrop' || audience.mode === 'recovery') {
    var single = modes.length === 1 && audience.mode !== 'priceDrop' && audience.mode !== 'recovery' ? Object.assign({}, audience, { mode: modes[0] }) : audience;
    var r1 = resolveOne_(deal, single, investors, logRows);
    return { included: r1.included, excluded: r1.excluded };
  }
  var smartWaves = modes.indexOf('smart') > -1 && audience.waves !== false;
  var best = {}, reasons = {};
  modes.forEach(function (m) {
    var a = Object.assign({}, audience, { mode: m });
    delete a.modes;
    var r = resolveOne_(deal, a, investors, logRows);
    r.included.forEach(function (inv) {
      var w = m === 'smart' ? inv._wave : m === 'selected' ? 1 : (smartWaves ? 3 : 1);
      var b = best[inv.id];
      if (!b) best[inv.id] = { inv: inv, wave: w, score: inv._score };
      else {
        b.wave = Math.min(b.wave, w);
        if (b.score === '' || b.score === undefined) b.score = inv._score;
      }
    });
    Object.keys(r.reasons).forEach(function (id) { if (!(id in reasons)) reasons[id] = r.reasons[id]; });
  });
  var included = Object.keys(best).map(function (id) { var b = best[id]; b.inv._wave = b.wave; b.inv._score = b.score; return b.inv; });
  included.sort(function (a, b) { return (a._wave - b._wave) || ((Number(b._score) || 0) - (Number(a._score) || 0)) || (tierRank_(a.tier) - tierRank_(b.tier)); });
  var ex = { inactive: 0, optedOut: 0, invalidEmail: 0, duplicate: 0, notInSegment: 0, criteria: 0, alreadySent: 0, notMatched: 0 };
  var seen = {}, out = [];
  included.forEach(function (inv) {
    var e = lc_(inv.email);
    if (seen[e]) { ex.duplicate++; return; }
    seen[e] = true; out.push(inv);
  });
  Object.keys(reasons).forEach(function (id) { if (!best[id]) ex[reasons[id]]++; });
  return { included: out, excluded: ex };
}

function describeAudience_(a) {
  a = a || {};
  var modes = audienceModes_(a);
  if (modes.length > 1 && a.mode !== 'priceDrop' && a.mode !== 'recovery') {
    var extra = [];
    if (a.matchCriteria) extra.push('buy-box match');
    if (a.excludeAlreadySent) extra.push('excluding previous recipients');
    return modes.map(function (m) {
      var one = Object.assign({}, a, { mode: m, matchCriteria: false, excludeAlreadySent: false });
      delete one.modes;
      return describeAudience_(one);
    }).join(' + ') + (extra.length ? '; ' + extra.join('; ') : '');
  }
  if (modes.length === 1 && a.mode !== 'priceDrop' && a.mode !== 'recovery') a = Object.assign({}, a, { mode: modes[0] });
  var parts = [];
  if (a.mode === 'priceDrop') parts.push('Price-reduction alert: previous recipients + matched buyers');
  else if (a.mode === 'recovery') parts.push('Dead-deal recovery: next ring of matched buyers');
  else if (a.mode === 'smart') parts.push('Smart match ≥ ' + (Number(a.minScore) || parseInt(getSettings_().MATCH_MIN_SCORE, 10) || 50) + (a.waves === false ? '' : ', priority waves') + (a.includeOthers ? ' + all other active buyers last' : ''));
  else if (a.mode === 'selected') parts.push('Hand-picked (' + (a.investorIds || []).length + ')');
  else if (a.mode === 'segments') {
    if (list_(a.tiers).length) parts.push('Tiers: ' + list_(a.tiers).join('/'));
    if (list_(a.categories).length) parts.push('Categories: ' + list_(a.categories).join('/'));
    if (list_(a.markets).length) parts.push('Markets: ' + list_(a.markets).join('/'));
    if (!parts.length) parts.push('All active investors');
  } else parts.push('All active investors');
  if (a.matchCriteria) parts.push('buy-box match');
  if (a.excludeAlreadySent) parts.push('excluding previous recipients');
  return parts.join('; ');
}

function maskEmail_(e) {
  var p = String(e).split('@');
  if (p.length !== 2) return e;
  return p[0].slice(0, 2) + '•••@' + p[1];
}

// ---------- client API ----------

function previewAudience(dealId, audience) {
  requireRole_('Viewer');
  var deal = getDealRow_(dealId);
  var res = resolveAudience_(deal, audience, readTable_(SHEET.INVESTORS).rows, readTable_(SHEET.LOG).rows);
  return {
    count: res.included.length,
    excluded: res.excluded,
    recipients: res.included.map(function (i) {
      return { id: i.id, name: investorName_(i), email: str_(i.email), tier: str_(i.tier), categories: str_(i.categories), wave: i._wave, score: i._score };
    }),
    waves: [1, 2, 3].map(function (w) { return res.included.filter(function (i) { return i._wave === w; }).length; }),
    testMode: isTestMode_(),
    quota: remainingQuota_()
  };
}

/** Sends a single preview of the deal email to one address (defaults to TEST_EMAIL). */
function sendTestEmail(dealId, toEmail) {
  requireRole_('Rep');
  var settings = getSettings_();
  var to = str_(toEmail) || str_(settings.TEST_EMAIL) || currentUser_();
  if (!isEmail_(to)) throw new Error('Enter a valid email address for the test.');
  var deal = getDealRow_(dealId);
  var imgs = loadInlineImages_(deal, Number(settings.EMAIL_PHOTO_COUNT) || 4);
  var email = buildDealEmail_(deal, settings, { photoCount: imgs.count });
  var sample = { firstName: 'there', id: 'TEST' };
  sendOne_(to, '[TEST] ' + email.subject,
    personalize_(email.text, sample, testBanner_(null, false), false),
    personalize_(email.html, sample, testBanner_(null, true), true),
    imgs.blobs, settings);
  return { sentTo: to, quota: remainingQuota_() };
}

/**
 * Locks in the recipient list and returns a one-time confirmation token (valid 15 minutes).
 */
function prepareDistribution(dealId, audience) {
  requireRole_('Rep');
  var deal = getDealRow_(dealId);
  if (str_(deal.status) === 'Sold') throw new Error('This deal is marked SOLD. Change its status before distributing.');
  if (str_(deal.status) === 'Dead') throw new Error('This deal is marked DEAD. Change its status before distributing.');
  var settings = getSettings_();
  var res = resolveAudience_(deal, audience, readTable_(SHEET.INVESTORS).rows, readTable_(SHEET.LOG).rows);
  if (!res.included.length) throw new Error('No investors match this audience.');
  var testMode = isTestMode_();
  var token = Utilities.getUuid();
  var payload = {
    kind: audience && audience.mode === 'priceDrop' ? 'price_drop' : audience && audience.mode === 'recovery' ? 'recovery' : '',
    dealId: dealId,
    audience: audience || { mode: 'all' },
    ids: res.included.map(function (i) { return i.id; }),
    waves: res.included.map(function (i) { return i._wave || 1; }),
    scores: res.included.map(function (i) { return i._score === undefined ? '' : i._score; }),
    mode: testMode ? 'TEST' : 'LIVE',
    user: currentUser_()
  };
  CacheService.getScriptCache().put('dist_' + token, JSON.stringify(payload), 900);
  var testMax = Math.max(0, parseInt(settings.TEST_MODE_MAX_EMAILS, 10) || 0);
  return {
    token: token,
    mode: payload.mode,
    dealId: dealId,
    dealTitle: dealTitle_(deal),
    dealStatus: str_(deal.status) || 'Available',
    recipientCount: res.included.length,
    excluded: res.excluded,
    audienceLabel: describeAudience_(audience),
    testEmail: str_(settings.TEST_EMAIL),
    testDeliveries: testMode ? Math.min(testMax, res.included.length) : 0,
    quota: remainingQuota_(),
    previouslySent: Number(deal.timesDistributed) || 0,
    waves: [1, 2, 3].map(function (w) { return res.included.filter(function (i) { return (i._wave || 1) === w; }).length; }),
    waveDelays: [0, Number(getSettings_().WAVE2_DELAY_HOURS) || 24, Number(getSettings_().WAVE3_DELAY_HOURS) || 48]
  };
}

/**
 * Executes a prepared distribution. In LIVE mode `typed` must be exactly "SEND".
 */
function confirmDistribution(token, typed) {
  requireRole_('Rep');
  return confirmDistribution_(token, typed, false);
}

/** internal = queued by the system itself (automatic recovery), not from the screen. */
function confirmDistribution_(token, typed, internal) {
  var raw = CacheService.getScriptCache().get('dist_' + token);
  if (!raw) throw new Error('This confirmation has expired. Please review the distribution again.');
  var p = JSON.parse(raw);
  var nowMode = isTestMode_() ? 'TEST' : 'LIVE';
  if (nowMode !== p.mode) throw new Error('Test/Live mode changed since this was prepared. Please review again.');
  if (p.mode === 'LIVE' && String(typed || '').trim().toUpperCase() !== 'SEND') {
    throw new Error('Type SEND to confirm a live distribution.');
  }
  CacheService.getScriptCache().remove('dist_' + token); // one-time use

  var jobId = withLock_(function () {
    var deal = getDealRow_(p.dealId);
    if (str_(deal.status) === 'Sold') throw new Error('This deal is marked SOLD.');
    var settings = getSettings_();
    var investors = readTable_(SHEET.INVESTORS).rows;
    var byId = {};
    investors.forEach(function (i) { byId[i.id] = i; });
    var testMax = Math.max(0, parseInt(settings.TEST_MODE_MAX_EMAILS, 10) || 0);
    var id = 'JOB-' + fmtDate_(new Date(), 'yyyyMMdd-HHmmss') + '-' + Utilities.getUuid().slice(0, 4).toUpperCase();
    var now = new Date();
    var rows = [];
    var delays = [0, Number(settings.WAVE2_DELAY_HOURS) || 24, Number(settings.WAVE3_DELAY_HOURS) || 48];
    p.ids.forEach(function (invId, n) {
      var inv = byId[invId];
      if (!inv) return;
      var status = 'Queued';
      if (p.mode === 'TEST' && n >= testMax) status = 'Simulated';
      var wave = (p.waves && p.waves[n]) || 1;
      var after = wave > 1 && p.mode === 'LIVE' ? new Date(now.getTime() + delays[wave - 1] * 3600000) : '';
      rows.push({
        wave: wave, sendAfter: after, matchScore: p.scores ? p.scores[n] : '',
        id: shortId_('L-'), jobId: id, dealId: p.dealId, investorId: inv.id, investorName: investorName_(inv),
        investorEmail: lc_(inv.email), tier: str_(inv.tier), mode: p.mode, status: status, queuedAt: now,
        sentAt: '', deliveredTo: '', error: ''
      });
    });
    appendObjects_(SHEET.JOBS, [{
      id: id, dealId: p.dealId, property: dealTitle_(deal), mode: p.mode, audience: describeAudience_(p.audience),
      created: now, createdBy: p.user || currentUser_(), total: rows.length, sent: 0, failed: 0,
      simulated: rows.filter(function (r) { return r.status === 'Simulated'; }).length,
      status: 'Sending', completed: '', notes: '', kind: p.kind || ''
    }]);
    appendObjects_(SHEET.LOG, rows);
    return id;
  });

  processQueueSafely_(jobId);
  return getJobStatus(jobId);
}

function getJobStatus(jobId) {
  requireRole_('Viewer');
  var job = findBy_(SHEET.JOBS, 'id', jobId);
  if (!job) throw new Error('Job ' + jobId + ' not found.');
  var queued = readTable_(SHEET.LOG).rows.filter(function (l) { return l.jobId === jobId && l.status === 'Queued'; }).length;
  var o = toClient_(job);
  o.queued = queued;
  o.quota = remainingQuota_();
  return o;
}

function listJobs() {
  requireRole_('Viewer');
  return toClient_(readTable_(SHEET.JOBS).rows.reverse());
}

/** Cancels the not-yet-sent part of a job. */
function cancelJob(jobId) {
  requireRole_('Rep');
  return withLock_(function () {
    var t = readTable_(SHEET.LOG);
    t.rows.forEach(function (l) {
      if (l.jobId === jobId && l.status === 'Queued') updateObject_(SHEET.LOG, l._row, { status: 'Cancelled' });
    });
    refreshJob_(jobId);
    return getJobStatus(jobId);
  });
}

/** Trigger entry point — continues any queued sends. Safe to run any time. */
function runQueuedDistributions() {
  deleteTriggers_('runQueuedDistributions');
  processQueueSafely_(null);
}

// ---------- queue internals ----------

function processQueueSafely_(jobId) {
  if (_lockDepth > 0) { // already inside a locked operation (e.g. nightly automation)
    var r0 = processQueue_(jobId, QUEUE_TIME_BUDGET_MS);
    if (r0 && r0.remaining > 0) scheduleQueue_(r0.dueRemaining ? 60 * 1000 : Math.max(60 * 1000, Math.min(r0.nextDueMs || 0, 6 * 3600 * 1000)));
    return;
  }
  var lock = LockService.getScriptLock();
  if (!lock.tryLock(10000)) { scheduleQueue_(60 * 1000); return; }
  var res;
  try {
    _lockDepth = 1; _lock = lock;
    res = processQueue_(jobId, QUEUE_TIME_BUDGET_MS);
  } finally {
    _lockDepth = 0;
    lock.releaseLock();
  }
  if (res && res.remaining > 0) {
    var wait = res.quotaExhausted ? 60 * 60 * 1000 : res.dueRemaining ? 60 * 1000 : Math.max(60 * 1000, Math.min(res.nextDueMs || 0, 6 * 3600 * 1000));
    scheduleQueue_(wait);
  }
}

function scheduleQueue_(ms) {
  if (hasTrigger_('runQueuedDistributions')) return;
  ScriptApp.newTrigger('runQueuedDistributions').timeBased().after(ms).create();
}

/**
 * Sends queued emails until done, out of time, or out of daily quota.
 * Caller must hold the script lock.
 */
function processQueue_(onlyJobId, budgetMs) {
  var started = Date.now();
  var settings = getSettings_();
  var log = readTable_(SHEET.LOG);
  var nowMs = Date.now();
  var allQueued = log.rows.filter(function (l) { return l.status === 'Queued' && (!onlyJobId || l.jobId === onlyJobId); });
  var future = allQueued.filter(function (l) { var t = asDate_(l.sendAfter); return t && t.getTime() > nowMs; });
  var queued = allQueued.filter(function (l) { return future.indexOf(l) === -1; });
  var nextDue = future.reduce(function (m, l) { var t = asDate_(l.sendAfter).getTime(); return Math.min(m, t); }, Infinity);
  if (!queued.length) {
    if (onlyJobId) refreshJob_(onlyJobId);
    return { remaining: future.length, sent: 0, nextDueMs: future.length ? nextDue - nowMs : 0 };
  }
  var quota = remainingQuota_();
  if (quota < 0) quota = 1e9; // quota unavailable — let Gmail enforce it
  var cache = {};       // dealId+mode+kind → { email, imgs }
  var jobKind = {};
  readTable_(SHEET.JOBS).rows.forEach(function (j) { jobKind[j.id] = str_(j.kind); });
  var investorsById = {};
  readTable_(SHEET.INVESTORS).rows.forEach(function (i) { investorsById[i.id] = i; });
  var sentLive = [];    // investor ids sent live in this run
  var touched = {};     // row numbers changed
  var quotaExhausted = false;
  var processed = 0;
  var testTo = str_(settings.TEST_EMAIL) || currentUser_();

  for (var i = 0; i < queued.length; i++) {
    if (Date.now() - started > budgetMs) break;
    if (quota <= 0) { quotaExhausted = true; break; }
    var row = queued[i];
    var kind = jobKind[row.jobId] || '';
    var key = row.dealId + '|' + row.mode + '|' + kind;
    try {
      if (!cache[key]) {
        var deal = getDealRow_(row.dealId);
        var imgs = loadInlineImages_(deal, Number(settings.EMAIL_PHOTO_COUNT) || 4);
        cache[key] = { email: buildDealEmail_(deal, settings, { photoCount: imgs.count, kind: kind }), imgs: imgs };
      }
      var c = cache[key];
      var inv = investorsById[row.investorId] || { id: row.investorId, firstName: String(row.investorName).split(' ')[0], email: row.investorEmail };
      var isTest = row.mode !== 'LIVE';
      // Re-check opt-out at send time (they may have unsubscribed after queueing)
      if (!isTest && (bool_(inv.optOut) || (str_(inv.status) || 'Active') !== 'Active')) {
        row.status = 'Skipped'; row.error = 'Opted out or deactivated before send';
      } else {
        var to = isTest ? testTo : lc_(row.investorEmail);
        sendOne_(to,
          (isTest ? '[TEST] ' : '') + c.email.subject,
          personalize_(c.email.text, inv, isTest ? testBanner_(inv, false) : '', false),
          personalize_(c.email.html, inv, isTest ? testBanner_(inv, true) : '', true),
          c.imgs.blobs, settings);
        row.status = 'Sent'; row.sentAt = new Date(); row.deliveredTo = to; row.error = '';
        quota--;
        if (!isTest) sentLive.push(row);
      }
    } catch (err) {
      var msg = String(err && err.message || err);
      if (/limit|quota|too many/i.test(msg)) { quotaExhausted = true; break; }
      row.status = 'Failed'; row.error = msg.slice(0, 300);
    }
    touched[row._row] = row;
    processed++;
    if (processed % 25 === 0) flushLog_(log, touched);
  }
  flushLog_(log, touched);
  if (sentLive.length) recordInvestorSends_(sentLive);

  var jobIds = {};
  queued.forEach(function (q) { jobIds[q.jobId] = true; });
  Object.keys(jobIds).forEach(function (j) { refreshJob_(j, quotaExhausted); });

  var remaining = queued.filter(function (q) { return q.status === 'Queued'; }).length;
  return { remaining: remaining + future.length, dueRemaining: remaining, sent: processed, quotaExhausted: quotaExhausted, nextDueMs: future.length ? nextDue - nowMs : 0 };
}

function flushLog_(log, touched) {
  var rowsNums = Object.keys(touched).map(Number).sort(function (a, b) { return a - b; });
  if (!rowsNums.length) return;
  var headers = log.headers;
  var sc = headers.indexOf(LOG_MAP.status);
  var ec = headers.indexOf(LOG_MAP.error);
  var keys = ['status', 'queuedAt', 'sentAt', 'deliveredTo', 'error'];
  var contiguous = ec - sc === 4 && keys.every(function (k, i) { return headers.indexOf(LOG_MAP[k]) === sc + i; });
  // group consecutive rows into blocks for fewer writes
  var blocks = [];
  rowsNums.forEach(function (n) {
    var last = blocks[blocks.length - 1];
    if (last && n === last.end + 1) last.end = n; else blocks.push({ start: n, end: n });
  });
  blocks.forEach(function (b) {
    if (contiguous) {
      var vals = [];
      for (var n = b.start; n <= b.end; n++) {
        var r = touched[n];
        vals.push(keys.map(function (k) { return cellValue_(r[k]); }));
      }
      log.sheet.getRange(b.start, sc + 1, vals.length, 5).setValues(vals);
    } else {
      for (var m = b.start; m <= b.end; m++) {
        var t = touched[m];
        updateObject_(SHEET.LOG, m, { status: t.status, sentAt: t.sentAt, deliveredTo: t.deliveredTo, error: t.error });
      }
    }
  });
  Object.keys(touched).forEach(function (k) { delete touched[k]; });
}

/** Updates "Last Deal Sent" and "Deals Received" for investors who just received a live deal. */
function recordInvestorSends_(rows) {
  var t = readTable_(SHEET.INVESTORS);
  if (!t.rows.length) return;
  var counts = {};
  rows.forEach(function (r) { counts[r.investorId] = (counts[r.investorId] || 0) + 1; });
  var first = t.rows[0]._row, last = t.rows[t.rows.length - 1]._row;
  var lastSent = [], received = [];
  var byRow = {};
  t.rows.forEach(function (r) { byRow[r._row] = r; });
  var sh = t.sheet;
  var lsCol = t.headers.indexOf(INVESTOR_MAP.lastSent) + 1;
  var drCol = t.headers.indexOf(INVESTOR_MAP.dealsReceived) + 1;
  var curLs = sh.getRange(first, lsCol, last - first + 1, 1).getValues();
  var curDr = sh.getRange(first, drCol, last - first + 1, 1).getValues();
  for (var n = first; n <= last; n++) {
    var r = byRow[n];
    var idx = n - first;
    if (r && counts[r.id]) {
      lastSent.push([new Date()]);
      received.push([(Number(curDr[idx][0]) || 0) + counts[r.id]]);
    } else {
      lastSent.push([curLs[idx][0]]);
      received.push([curDr[idx][0]]);
    }
  }
  sh.getRange(first, lsCol, lastSent.length, 1).setValues(lastSent);
  sh.getRange(first, drCol, received.length, 1).setValues(received);
}

/** Recomputes a job's counters/status and, for live jobs, the deal's distribution stats. */
function refreshJob_(jobId, quotaExhausted) {
  var job = findBy_(SHEET.JOBS, 'id', jobId);
  if (!job) return;
  var log = readTable_(SHEET.LOG).rows;
  var rows = log.filter(function (l) { return l.jobId === jobId; });
  var c = { Sent: 0, Failed: 0, Simulated: 0, Queued: 0, Skipped: 0, Cancelled: 0 };
  rows.forEach(function (r) { c[r.status] = (c[r.status] || 0) + 1; });
  var status;
  var waiting = rows.filter(function (r) { var t = asDate_(r.sendAfter); return r.status === 'Queued' && t && t.getTime() > Date.now(); });
  if (c.Queued > 0 && waiting.length === c.Queued) {
    var nxt = waiting.reduce(function (m, r) { return Math.min(m, asDate_(r.sendAfter).getTime()); }, Infinity);
    status = 'Wave ' + waiting[0].wave + ' scheduled — ' + waiting.length + ' buyers at ' + fmtDate_(new Date(nxt), 'MMM d h:mm a');
  } else if (c.Queued > 0) status = quotaExhausted ? 'Paused — daily email limit (resumes automatically)' : 'Sending';
  else if (c.Cancelled > 0) status = 'Cancelled';
  else if (c.Failed > 0) status = 'Completed with errors';
  else status = 'Completed';
  var wasDone = /^Completed|^Cancelled/.test(str_(job.status));
  var f = { sent: c.Sent, failed: c.Failed, simulated: c.Simulated, status: status };
  if (c.Queued === 0 && !job.completed) f.completed = new Date();
  if (c.Skipped) f.notes = c.Skipped + ' skipped (opted out / deactivated before send)';
  updateObject_(SHEET.JOBS, job._row, f);

  if (job.mode === 'LIVE') {
    var deal = findBy_(SHEET.DEALS, 'id', job.dealId);
    if (deal) {
      var uniq = {};
      log.forEach(function (l) { if (l.dealId === job.dealId && l.mode === 'LIVE' && l.status === 'Sent') uniq[l.investorId] = true; });
      var df = { totalRecipients: Object.keys(uniq).length };
      if (c.Sent > 0) df.lastDistributed = new Date();
      if (c.Queued === 0 && !wasDone && c.Sent > 0) df.timesDistributed = (Number(deal.timesDistributed) || 0) + 1;
      updateObject_(SHEET.DEALS, deal._row, df);
      if (c.Sent > 0) advanceStage_(job.dealId, 'Distributed');
      if (c.Sent > 0 && !deal.firstDistributed) updateObject_(SHEET.DEALS, deal._row, { firstDistributed: new Date() });
    }
  }
}

/** Sends exactly one email to exactly one recipient. */
function sendOne_(to, subject, text, html, inlineImages, settings) {
  var opts = {
    htmlBody: html,
    name: str_(settings.SENDER_NAME) || APP_NAME,
    replyTo: replyTo_()
  };
  if (inlineImages && Object.keys(inlineImages).length) opts.inlineImages = inlineImages;
  if (str_(settings.FROM_ALIAS)) opts.from = str_(settings.FROM_ALIAS);
  GmailApp.sendEmail(to, subject, text, opts);
}

// ---------- trigger helpers ----------

function hasTrigger_(fn) {
  return ScriptApp.getProjectTriggers().some(function (t) { return t.getHandlerFunction() === fn; });
}

function deleteTriggers_(fn) {
  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (t.getHandlerFunction() === fn) ScriptApp.deleteTrigger(t);
  });
}

// ---- Email.gs ----
/**
 * Email.gs — builds the branded investment-opportunity email.
 * Table-based, inline-styled HTML for compatibility with Gmail, Outlook and Apple Mail.
 * Photos are embedded inline (cid:) so they display without any public hosting.
 */

var BRAND = {
  black: '#0A0A0A',
  ink: '#111412',
  green: '#0B2E21',
  greenMid: '#14472F',
  accent: '#2E9A63',
  accentSoft: '#7BC8A0',
  paper: '#F4F6F4',
  line: '#DDE5E0',
  text: '#1B1F1D',
  muted: '#5F6B65',
  serif: "Georgia,'Times New Roman',serif",
  sans: "'Helvetica Neue',Helvetica,Arial,sans-serif"
};

function esc_(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function money_(n) {
  if (n === '' || n === null || n === undefined || isNaN(Number(n))) return '';
  var v = Math.round(Number(n));
  var s = String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (v < 0 ? '-$' : '$') + s;
}

function numFmt_(n) {
  if (n === '' || n === null || n === undefined || isNaN(Number(n))) return '';
  return String(Number(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function paragraphs_(text) {
  return esc_(text).split(/\n{2,}/).map(function (p) {
    return '<p style="margin:0 0 14px 0;">' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function fillTokens_(template, deal) {
  var map = {
    ADDRESS: str_(deal.address), CITY: str_(deal.city), STATE: str_(deal.state), ZIP: str_(deal.zip),
    PRICE: money_(deal.askingPrice), ARV: money_(deal.arv), PROPERTY_TYPE: str_(deal.propertyType),
    DEAL_ID: str_(deal.id), MARKET: str_(deal.market)
  };
  return String(template).replace(/\{\{\s*([A-Z_]+)\s*\}\}/g, function (m, k) {
    return map[k] !== undefined ? map[k] : m;
  }).replace(/\s+\|\s+\|/g, ' |').replace(/\s{2,}/g, ' ').trim();
}

function dealSubject_(deal, settings) {
  var subj = fillTokens_(settings.SUBJECT_TEMPLATE || 'New Deal: {{ADDRESS}} [{{DEAL_ID}}]', deal);
  if (subj.indexOf(deal.id) === -1) subj += ' [' + deal.id + ']'; // always keep the ID so replies can be tracked
  return subj;
}

function videoLink_(deal) {
  return str_(deal.videoUrl);
}

function mailto_(to, subject, body) {
  return 'mailto:' + encodeURIComponent(to).replace(/%40/g, '@') +
    '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
}

/**
 * Builds the email. Placeholders replaced per recipient by personalize_():
 *   {{FIRST_NAME}}  {{INVESTOR_REF}}  {{TEST_BANNER}}
 * opts.imageSrc(i) returns the src for photo i (cid:photoN for sending, data: URLs for preview).
 * opts.photoCount = number of photos available.
 */
function buildDealEmail_(deal, settings, opts) {
  opts = opts || {};
  var B = BRAND;
  var m = dealMetrics_(deal);
  var company = str_(settings.COMPANY_NAME) || APP_NAME;
  var reply = replyTo_();
  var contactEmail = contactEmail_();
  var subject = dealSubject_(deal, settings);
  var reduced = Number(deal.previousPrice) > Number(deal.askingPrice);
  if (opts.kind === 'price_drop') subject = 'PRICE REDUCED ' + money_(deal.previousPrice) + ' → ' + money_(deal.askingPrice) + ' | ' + subject;
  var deadline = asDate_(deal.offerDeadline);
  if (deadline && deadline.getTime() < Date.now()) deadline = null;
  var title = dealTitle_(deal);
  var cityLine = [str_(deal.city), [str_(deal.state), str_(deal.zip)].filter(String).join(' ')].filter(String).join(', ');
  var photoCount = opts.photoCount || 0;
  var src = opts.imageSrc || function (i) { return 'cid:photo' + i; };
  var ref = 'Deal: ' + deal.id + ' | Investor ref: {{INVESTOR_REF}}';

  var interestedLink = mailto_(reply, 'INTERESTED - ' + deal.id + ' - ' + str_(deal.address),
    "Hi, I'm interested in " + title + '. Please send me next steps.\n\nBest number to reach me: \n\n' + ref);
  var offerLink = mailto_(reply, 'OFFER - ' + deal.id + ' - ' + str_(deal.address),
    'My offer for ' + title + ' is: $\n\nProof of funds attached: Yes / No\nClosing timeline: \n\n' + ref);
  var passLink = mailto_(reply, 'PASS - ' + deal.id + ' - ' + str_(deal.address),
    'Not for me this time. Main reason (keep one): Price / Location / Condition / Numbers / Timing / Other\n\nAnything that would change your mind?\n\n' + ref);
  var unsubLink = mailto_(reply, 'UNSUBSCRIBE', 'Please remove me from the ' + company + ' investor list.\n\nInvestor ref: {{INVESTOR_REF}}');

  var galleryUrl = '';
  if (deal.folderId && bool_(settings.SHARE_MEDIA_LINKS)) galleryUrl = 'https://drive.google.com/drive/folders/' + deal.folderId;
  var video = videoLink_(deal);

  var h = [];
  h.push('<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">',
    '<meta name="color-scheme" content="light only"><title>', esc_(subject), '</title></head>',
    '<body style="margin:0;padding:0;background:#E9EDEA;">',
    '<div style="display:none;max-height:0;overflow:hidden;opacity:0;">',
    esc_(str_(deal.propertyType) + ' · ' + money_(deal.askingPrice) + (deal.arv ? ' · ARV ' + money_(deal.arv) : '') + ' · ' + cityLine),
    '</div>',

/** Loads up to n photo blobs for inline embedding. */
function loadInlineImages_(deal, n) {
  var blobs = {};
  var count = 0;
  photoIds_(deal).slice(0, n).forEach(function (id) {
    try {
      var f = DriveApp.getFileById(id);
      var blob = f.getBlob();
      if (f.getSize() > 3 * 1024 * 1024) {
        var thumb = f.getThumbnail();
        if (thumb) blob = thumb;
      }
      blob.setName('photo' + count + '.' + (/png/.test(blob.getContentType()) ? 'png' : 'jpg'));
      blobs['photo' + count] = blob;
      count++;
    } catch (e) {
      // missing/unreadable file — skip it
    }
  });
  return { count: count, blobs: blobs };
}

// ---- FollowUps.gs ----
/**
 * FollowUps.gs — Automatic Buyer Follow-Ups.
 *
 * Runs every 2 hours during business hours (8 AM–8 PM). Each rule fires once per buyer/deal
 * (tracked in the "Follow-Ups" sheet) so nobody gets spammed:
 *   Buyer emails
 *     noresp   — matched buyer received the deal, no response after FU_NORESP_HOURS
 *     offer    — buyer said Interested, no offer after FU_OFFER_HOURS
 *     pof      — offer without verified proof of funds (up to 3 reminders, 48h apart)
 *     deadline — offer deadline within 24h, interested buyers without an offer
 *     emd      — buyer selected 2+ days ago, EMD not received
 *     closing  — closing within FU_CLOSING_DAYS
 *   Rep alerts (one digest email per rep)
 *     quiet    — interested buyer / selected buyer silent FU_QUIET_DAYS
 *     stuck    — deal unchanged in its stage FU_STUCK_DAYS
 *     closing / emd — heads-up for the rep
 * Opted-out buyers are never emailed. In TEST mode buyer emails go to TEST_EMAIL.
 */

var FU_TYPES = {
  noresp: 'No response',
  offer: 'Offer reminder',
  pof: 'Proof of funds',
  deadline: 'Offer deadline',
  emd: 'EMD reminder',
  closing: 'Closing reminder',
  quiet: 'Buyer went quiet',
  stuck: 'Deal stuck',
  deadlinepassed: 'Offer deadline passed',
  recovery: 'Needs recovery'
};

function hoursSince_(v) { var d = asDate_(v); return d ? (Date.now() - d.getTime()) / 3600000 : Infinity; }

function repEmail_(deal) {
  var r = str_(deal && deal.rep);
  var m = r.match(/<([^>]+)>/);
  var e = m ? m[1] : r;
  if (isEmail_(e)) return lc_(e);
  var reps = list_(getSettings_().REPS);
  var hit = reps.filter(function (x) { return lc_(x).indexOf(lc_(r)) === 0 && r; })[0];
  if (hit) { var mm = hit.match(/<([^>]+)>/); if (mm && isEmail_(mm[1])) return lc_(mm[1]); }
  return replyTo_();
}

/** Works out every follow-up that is due right now (nothing is sent here). */
function planFollowUps_() {
  var s = getSettings_();
  var H = function (k, d) { var n = Number(s[k]); return isNaN(n) || s[k] === '' ? d : n; };
  var sent = {};
  readTable_(SHEET.FOLLOWUPS).rows.forEach(function (f) {
    if (f.status === 'Sent' || f.status === 'Test') sent[f.key] = f;
  });
  var invById = {};
  readTable_(SHEET.INVESTORS).rows.forEach(function (i) { invById[i.id] = i; });
  var deals = readTable_(SHEET.DEALS).rows.map(function (d) { var c = cleanDealRow_(d); c._raw = d; return c; });
  var respBy = {}, offerBy = {}, sentBy = {};
  readTable_(SHEET.RESPONSES).rows.forEach(function (r) { if (r.dealId && r.investorId) (respBy[r.dealId + '|' + r.investorId] = respBy[r.dealId + '|' + r.investorId] || []).push(r); });
  var offers = readTable_(SHEET.OFFERS).rows;
  offers.forEach(function (o) { if (o.investorId) (offerBy[o.dealId + '|' + o.investorId] = offerBy[o.dealId + '|' + o.investorId] || []).push(o); });
  readTable_(SHEET.LOG).rows.forEach(function (l) { if (l.mode === 'LIVE' && l.status === 'Sent') sentBy[l.dealId + '|' + l.investorId] = l; });
  var minScore = parseInt(s.MATCH_MIN_SCORE, 10) || 50;
  var plan = [];
  var canEmail = function (inv) { return inv && (str_(inv.status) || 'Active') === 'Active' && !bool_(inv.optOut) && isEmail_(inv.email); };
  var add = function (key, type, deal, inv, kind, detail) {
    if (sent[key]) return;
    plan.push({ key: key, type: type, kind: kind, dealId: deal.id, property: deal.title, investorId: inv ? inv.id : '', investorName: inv ? investorName_(inv) : '', to: kind === 'buyer' ? lc_(inv.email) : repEmail_(deal), detail: detail || '' });
  };

  deals.forEach(function (d) {
    if (['Closed', 'Dead Deal'].indexOf(d.stage) > -1) return;
    var idx = d.stageIndex;
    var ctxM = null;

    // noresp — matched buyers who got it but never responded
    if (d.status === 'Available' && idx >= 1 && idx <= 4) {
      Object.keys(sentBy).forEach(function (k) {
        if (k.indexOf(d.id + '|') !== 0) return;
        var l = sentBy[k], inv = invById[l.investorId];
        if (!canEmail(inv) || respBy[k] || offerBy[k]) return;
        if (hoursSince_(l.sentAt) < H('FU_NORESP_HOURS', 48)) return;
        ctxM = ctxM || matchContext_(d.id);
        var m = matchInvestor_(inv, d._raw, ctxM);
        if (m.blockers.length || m.score < minScore) return;
        add('noresp|' + d.id + '|' + inv.id, 'noresp', d, inv, 'buyer', 'Match ' + m.score + ' · sent ' + fmtDate_(asDate_(l.sentAt), 'MMM d'));
      });
    }

    // offer reminders + offer deadline
    var deadline = asDate_(d.offerDeadline);
    Object.keys(respBy).forEach(function (k) {
      if (k.indexOf(d.id + '|') !== 0 || d.status !== 'Available') return;
      var inv = invById[k.split('|')[1]];
      var interested = respBy[k].filter(function (r) { return r.type === 'Interested'; });
      if (!interested.length || offerBy[k] || !canEmail(inv)) return;
      if (hoursSince_(interested[interested.length - 1].received) >= H('FU_OFFER_HOURS', 24)) add('offer|' + d.id + '|' + inv.id, 'offer', d, inv, 'buyer', 'Interested ' + fmtDate_(asDate_(interested[0].received), 'MMM d'));
      if (deadline && deadline.getTime() > Date.now() && deadline.getTime() - Date.now() <= 24 * 3600000) add('deadline|' + d.id + '|' + inv.id, 'deadline', d, inv, 'buyer', 'Deadline ' + fmtDate_(deadline, 'MMM d h:mm a'));
    });

    // quiet buyers → rep alert
    var engaged = {};
    Object.keys(respBy).forEach(function (k) { if (k.indexOf(d.id + '|') === 0 && respBy[k].some(function (r) { return r.type === 'Interested' || r.type === 'Offer'; })) engaged[k] = true; });
    Object.keys(offerBy).forEach(function (k) { if (k.indexOf(d.id + '|') === 0 && offerBy[k].some(function (o) { return ACTIVE_OFFER.indexOf(o.status) > -1; })) engaged[k] = true; });
    if (d.buyerInvestorId) engaged[d.id + '|' + d.buyerInvestorId] = true;
    Object.keys(engaged).forEach(function (k) {
      var inv = invById[k.split('|')[1]];
      if (!inv) return;
      var last = 0;
      (respBy[k] || []).forEach(function (r) { var t = asDate_(r.received); if (t) last = Math.max(last, t.getTime()); });
      (offerBy[k] || []).forEach(function (o) { [o.received, o.updated].forEach(function (v) { var t = asDate_(v); if (t) last = Math.max(last, t.getTime()); }); });
      if (!last) return;
      var days = (Date.now() - last) / 86400000;
      if (days >= H('FU_QUIET_DAYS', 3)) add('quiet|' + d.id + '|' + inv.id + '|' + fmtDate_(new Date(last)), 'quiet', d, inv, 'rep', investorName_(inv) + ' silent ' + Math.floor(days) + ' days');
    });

    // EMD + closing
    if (idx >= 5 && idx <= 8) {
      var buyer = invById[str_(d.buyerInvestorId)];
      if (idx <= 6 && !d.emdReceived && hoursSince_(d._raw.stageUpdated) >= 48) {
        if (canEmail(buyer)) add('emd|' + d.id, 'emd', d, buyer, 'buyer', 'EMD ' + (d.emdAmount ? money_(d.emdAmount) : '') + ' not received');
        add('emdrep|' + d.id, 'emd', d, buyer, 'rep', 'EMD not received from ' + (buyer ? investorName_(buyer) : d.buyer || 'buyer'));
      }
      var close = parseDateLoose_(d.closingDate);
      if (close) {
        var daysTo = (close.getTime() - Date.now()) / 86400000;
        if (daysTo >= -1 && daysTo <= H('FU_CLOSING_DAYS', 3)) {
          if (canEmail(buyer)) add('closing|' + d.id + '|' + d.closingDate, 'closing', d, buyer, 'buyer', 'Closing ' + prettyDate_(d.closingDate));
          add('closingrep|' + d.id + '|' + d.closingDate, 'closing', d, buyer, 'rep', 'Closing ' + prettyDate_(d.closingDate) + (buyer ? ' with ' + investorName_(buyer) : ''));
        }
      }
    }

    // offer deadline passed → rep reviews offers
    if (deadline && deadline.getTime() <= Date.now() && Date.now() - deadline.getTime() < 7 * 86400000 && d.status === 'Available') {
      var nOff = offers.filter(function (o) { return o.dealId === d.id && ACTIVE_OFFER.indexOf(o.status) > -1; }).length;
      add('deadlinepassed|' + d.id + '|' + fmtDate_(deadline, 'yyyyMMddHHmm'), 'deadlinepassed', d, null, 'rep', nOff + ' offer' + (nOff === 1 ? '' : 's') + ' to review');
    }

    // stuck deals → rep
    if (d.stuck) add('stuck|' + d.id + '|' + fmtDate_(asDate_(d._raw.stageUpdated) || asDate_(d._raw.updated) || new Date()), 'stuck', d, null, 'rep', d.stage + ' for ' + d.daysInStage + ' days');
  });

  // dead-deal recovery suggestions → rep (automatic re-send happens nightly only if RECOVERY_AUTO)
  try {
    recoveryCandidates_({ deals: readTable_(SHEET.DEALS).rows, offers: offers, jobs: readTable_(SHEET.JOBS).rows }).forEach(function (c) {
      var d = deals.filter(function (x) { return x.id === c.dealId; })[0];
      if (d) add('recovery|' + c.dealId + '|' + fmtDate_(new Date(), 'yyyyMMdd').slice(0, 6) + Math.floor(new Date().getDate() / 7), 'recovery', d, null, 'rep', c.days + ' days, ' + (c.offers ? 'best offer ' + money_(c.bestOffer) : 'no offers') + ' — re-send to the next ring of buyers');
    });
  } catch (e) { /* optional */ }

  // proof of funds (per offer, up to 3 reminders 48h apart)
  offers.forEach(function (o) {
    if (['Received', 'Countered', 'Accepted', 'Under Contract'].indexOf(o.status) === -1) return;
    var inv = invById[o.investorId];
    if (!canEmail(inv)) return;
    var pof = pofStatus_(inv);
    if (pof === 'Verified' || pof === 'Expiring') return;
    if (hoursSince_(o.received) < H('FU_POF_HOURS', 24)) return;
    var prior = Object.keys(sent).filter(function (k) { return k.indexOf('pof|' + o.id + '|') === 0; }).map(function (k) { return sent[k]; });
    if (prior.length >= 3) return;
    if (prior.some(function (p) { return hoursSince_(p.sentAt) < 48; })) return;
    var d = deals.filter(function (x) { return x.id === o.dealId; })[0];
    if (!d || ['Closed', 'Dead Deal'].indexOf(d.stage) > -1) return;
    add('pof|' + o.id + '|' + (prior.length + 1), 'pof', d, inv, 'buyer', 'Offer ' + money_(o.amount) + ' · POF ' + pof);
  });
  return plan;
}

    '<b>' + esc_(title) + '</b><br><span style="color:' + B.muted + ';">' + esc_(deal.id) + (deal.propertyType ? ' · ' + esc_(deal.propertyType) : '') + ' · ' + esc_(price) + (deal.arv ? ' · ARV ' + esc_(money_(deal.arv)) : '') + '</span></td></tr></table>' +

/** Sends everything that's due. Caller holds the lock. */
function runFollowUps_(force) {
  var s = getSettings_();
  if (!bool_(s.FU_ON) && !force) return { sent: 0, alerts: 0, skipped: 'Follow-ups are turned off.' };
  var hour = Number(fmtDate_(new Date(), 'H'));
  if (!force && (hour < 8 || hour >= 20)) return { sent: 0, alerts: 0, skipped: 'Outside business hours.' };
  var plan = planFollowUps_();
  var test = isTestMode_(), testTo = str_(s.TEST_EMAIL) || currentUser_();
  var invById = {}, dealById = {};
  readTable_(SHEET.INVESTORS).rows.forEach(function (i) { invById[i.id] = i; });
  var comp = competitionMap_({ resp: readTable_(SHEET.RESPONSES).rows, offers: readTable_(SHEET.OFFERS).rows });
  readTable_(SHEET.DEALS).rows.forEach(function (d) { var c = cleanDealRow_(d); c._competition = comp[c.id] || 0; dealById[c.id] = c; });
  var log = [], sentCount = 0, quota = remainingQuota_();
  if (quota < 0) quota = 1e9;
  var digests = {};
  plan.forEach(function (p) {
    if (p.kind === 'rep') { (digests[p.to] = digests[p.to] || []).push(p); return; }
    if (sentCount >= 40 || quota <= 1) return; // keep the rest for the next run
    var inv = invById[p.investorId], deal = dealById[p.dealId];
    var e = fuEmail_(p.type, deal, inv, s);
    var to = test ? testTo : p.to;
    var row = { id: shortId_('F-'), key: p.key, type: FU_TYPES[p.type], dealId: p.dealId, property: p.property, investorId: p.investorId, investorName: p.investorName, to: to, channel: 'Email to buyer', subject: e.subject, sentAt: new Date(), status: test ? 'Test' : 'Sent', mode: test ? 'TEST' : 'LIVE' };
    try {
      sendOne_(to, (test ? '[TEST] ' : '') + e.subject, personalize_(e.text, inv, test ? testBanner_(inv, false) : '', false), personalize_(e.html, inv, test ? testBanner_(inv, true) : '', true), null, s);
      sentCount++; quota--;
    } catch (err) { row.status = 'Failed: ' + String(err.message || err).slice(0, 120); }
    log.push(row);
  });
  var alerts = 0;
  Object.keys(digests).forEach(function (to) {
    var items = digests[to];
    var status = 'Sent';
    try { if (quota > 0) { sendRepDigest_(to, items, s); quota--; } else status = 'Failed: quota'; } catch (err) { status = 'Failed: ' + String(err.message || err).slice(0, 120); }
    items.forEach(function (p) {
      log.push({ id: shortId_('F-'), key: p.key, type: FU_TYPES[p.type], dealId: p.dealId, property: p.property, investorId: p.investorId, investorName: p.investorName, to: to, channel: 'Alert to rep', subject: p.detail, sentAt: new Date(), status: status, mode: test ? 'TEST' : 'LIVE' });
      alerts++;
    });
  });
  appendObjects_(SHEET.FOLLOWUPS, log);
  setSetting_('LAST_FOLLOWUP_RUN', new Date().toISOString());
  return { sent: sentCount, alerts: alerts, due: plan.length };
}

/** Trigger entry point (every 2 hours). */
function runFollowUps() {
  return withLock_(function () { return runFollowUps_(false); });
}

/**
 * Import.gs — import an existing investor list from any Google Sheet.
 * Columns are auto-mapped by common header names and can be adjusted in the app.
 */

var IMPORT_SYNONYMS = {
  fullName: ['name', 'full name', 'investor', 'investor name', 'contact', 'contact name', 'buyer', 'buyer name'],
  firstName: ['first name', 'first', 'fname', 'given name'],
  lastName: ['last name', 'last', 'lname', 'surname', 'family name'],
  company: ['company', 'company name', 'business', 'llc', 'entity', 'organization', 'firm'],
  email: ['email', 'e-mail', 'email address', 'e-mail address', 'mail'],
  phone: ['phone', 'phone number', 'cell', 'mobile', 'cell phone', 'telephone', 'tel', 'phone #'],
  tier: ['tier', 'level', 'rank', 'priority', 'grade', 'vip'],
  categories: ['category', 'categories', 'type', 'investor type', 'buyer type', 'strategy', 'tags', 'group'],
  markets: ['market', 'markets', 'preferred markets', 'area', 'areas', 'city', 'cities', 'county', 'counties', 'location', 'locations', 'zip codes', 'target markets'],
  propertyTypes: ['property type', 'property types', 'asset type', 'asset class', 'product type'],
  minPrice: ['min price', 'minimum price', 'min', 'price min', 'budget min', 'min budget'],
  maxPrice: ['max price', 'maximum price', 'max', 'price max', 'budget', 'max budget', 'budget max'],
  criteria: ['criteria', 'buying criteria', 'buy box', 'buybox', 'requirements', 'looking for', 'wants'],
  status: ['status', 'active'],
  notes: ['notes', 'note', 'comments', 'comment', 'remarks']
};

var IMPORT_FIELDS = ['fullName', 'firstName', 'lastName', 'company', 'email', 'phone', 'tier', 'categories',
  'markets', 'propertyTypes', 'minPrice', 'maxPrice', 'criteria', 'status', 'notes'];

function parseSpreadsheetId_(urlOrId) {
  var s = str_(urlOrId);
  if (!s) return '';
  var m = s.match(/\/d\/([a-zA-Z0-9-_]+)/);
  return m ? m[1] : s;
}

function openImportSource_(urlOrId, tabName) {
  var id = parseSpreadsheetId_(urlOrId);
  var src;
  try {
    src = id ? SpreadsheetApp.openById(id) : ss_();
  } catch (e) {
    throw new Error('Could not open that spreadsheet. Check the link and make sure this Google account can view it.');
  }
  var sheets = src.getSheets();
  var sh = tabName ? src.getSheetByName(tabName) : sheets[0];
  if (!sh) throw new Error('Tab "' + tabName + '" not found. Available tabs: ' + sheets.map(function (x) { return x.getName(); }).join(', '));
  if (!id && [SHEET.INVESTORS, SHEET.DEALS, SHEET.LOG, SHEET.JOBS, SHEET.RESPONSES, SHEET.SETTINGS, SHEET.INTAKE].indexOf(sh.getName()) > -1) {
    throw new Error('Choose the tab that holds your existing list, not a system tab.');
  }
  return { spreadsheet: src, sheet: sh, tabs: sheets.map(function (x) { return x.getName(); }) };
}

/** Finds the header row (first row with an email-like header within the first 10 rows). */
function findHeaderRow_(values) {
  for (var i = 0; i < Math.min(values.length, 10); i++) {
    var joined = values[i].map(function (c) { return String(c).toLowerCase(); }).join('|');
    if (/e-?mail/.test(joined)) return i;
  }
  return 0;
}

function autoMap_(headers) {
  var map = {};
  var used = {};
  var norm = headers.map(function (h) { return String(h).toLowerCase().replace(/[_*#:]/g, ' ').replace(/\s+/g, ' ').trim(); });
  // exact matches first, then "contains" matches
  [true, false].forEach(function (exact) {
    IMPORT_FIELDS.forEach(function (f) {
      if (map[f] !== undefined) return;
      for (var i = 0; i < norm.length; i++) {
        if (used[i] || !norm[i]) continue;
        var hit = IMPORT_SYNONYMS[f].some(function (syn) {
          return exact ? norm[i] === syn : (syn.length > 3 && norm[i].indexOf(syn) > -1);
        });
        if (hit) { map[f] = i; used[i] = true; break; }
      }
    });
  });
  if (map.firstName !== undefined && map.fullName !== undefined) delete map.fullName;
  return map;
}

// ---------- client API ----------

/** Reads the source sheet and proposes a column mapping. */
function previewImport(urlOrId, tabName) {
  requireRole_('Rep');
  var src = openImportSource_(urlOrId, tabName);
  var values = src.sheet.getDataRange().getDisplayValues();
  if (!values.length) throw new Error('That tab is empty.');
  var h = findHeaderRow_(values);
  var headers = values[h].map(String);
  var rows = values.slice(h + 1).filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
  return {
    spreadsheetName: src.spreadsheet.getName(),
    tab: src.sheet.getName(),
    tabs: src.tabs,
    headerRow: h + 1,
    headers: headers,
    mapping: autoMap_(headers),
    sample: rows.slice(0, 8),
    totalRows: rows.length,
    fields: IMPORT_FIELDS
  };
}

/**
 * Imports investors.
 * mapping: { field: columnIndex }  options: { defaultTier, defaultCategory, updateExisting, defaultStatus }
 */
function runImport(urlOrId, tabName, mapping, options) {
  requireRole_('Rep');
  options = options || {};
  var src = openImportSource_(urlOrId, tabName);
  var values = src.sheet.getDataRange().getDisplayValues();
  var h = findHeaderRow_(values);
  var rows = values.slice(h + 1);
  var sourceLabel = 'Import: ' + src.spreadsheet.getName() + ' / ' + src.sheet.getName();

  return withLock_(function () {
    var table = readTable_(SHEET.INVESTORS);
    var byEmail = {};
    table.rows.forEach(function (r) { byEmail[String(r.email).toLowerCase()] = r; });
    var result = { added: 0, updated: 0, skipped: 0, invalid: [], duplicatesInFile: 0 };
    var toAppend = [];
    var seen = {};
    var get = function (row, f) { return mapping[f] === undefined || mapping[f] === null || mapping[f] === '' ? '' : str_(row[Number(mapping[f])]); };

    rows.forEach(function (row, i) {
      if (!row.some(function (c) { return String(c).trim() !== ''; })) return;
      var email = get(row, 'email').toLowerCase().replace(/^mailto:/, '');
      if (email.indexOf(',') > -1 || email.indexOf(';') > -1) email = email.split(/[,;]/)[0].trim();
      if (!isEmail_(email)) {
        result.invalid.push({ row: h + 2 + i, value: get(row, 'email') || '(blank)' });
        return;
      }
      if (seen[email]) { result.duplicatesInFile++; return; }
      seen[email] = true;

      var first = get(row, 'firstName'), last = get(row, 'lastName');
      if (!first && !last && get(row, 'fullName')) {
        var parts = get(row, 'fullName').split(/\s+/);
        first = parts.shift();
        last = parts.join(' ');
      }
      var statusRaw = get(row, 'status');
      var status = statusRaw ? (/^(inactive|no|n|false|0|dead|do not.*|unsubscribed|opted out)$/i.test(statusRaw.trim()) ? 'Inactive' : 'Active') : (options.defaultStatus || 'Active');
      var cats = list_(get(row, 'categories'));
      if (options.defaultCategory && cats.indexOf(options.defaultCategory) === -1) cats.push(options.defaultCategory);
      var rec = {
        firstName: first, lastName: last, company: get(row, 'company'), email: email,
        phone: get(row, 'phone'), tier: get(row, 'tier') || options.defaultTier || '',
        categories: cats.join(', '), markets: joinList_(get(row, 'markets')),
        propertyTypes: joinList_(get(row, 'propertyTypes')),
        minPrice: num_(get(row, 'minPrice')), maxPrice: num_(get(row, 'maxPrice')),
        criteria: get(row, 'criteria'), status: status, notes: get(row, 'notes'),
        updated: new Date()
      };
      var existing = byEmail[email];
      if (existing) {
        if (!options.updateExisting) { result.skipped++; return; }
        // only overwrite with non-empty values
        var f = { updated: rec.updated };
        Object.keys(rec).forEach(function (k) { if (rec[k] !== '' && k !== 'status') f[k] = rec[k]; });
        updateObject_(SHEET.INVESTORS, existing._row, f);
        result.updated++;
      } else {
        rec.id = nextId_('INVESTOR_SEQ', 'INV-', 5);
        rec.source = sourceLabel;
        rec.dateAdded = new Date();
        rec.optOut = false;
        rec.dealsReceived = 0;
        toAppend.push(rec);
        result.added++;
      }
    });
    appendObjects_(SHEET.INVESTORS, toAppend);
    result.invalid = result.invalid.slice(0, 50);
    return result;
  });
}

// ---- Intake.gs ----
/**
 * Intake.gs — finds new buyers every day and queues them for review.
 *
 * Sources (each can be switched on/off in the app → New Buyers):
 *   1. Signup form   — your branded "VIP Buyers List" Google Form (instant + daily sweep)
 *   2. Sheet sync    — any Google Sheet you or a VA keep adding buyers to
 *   3. Cash buyers   — a public-records export (PropStream, BatchLeads, PropertyRadar, …)
 *                      grouped by owner; the buy box is built from what they actually bought
 *   4. Gmail         — people who email you asking to join your buyers list
 *
 * Every new buyer is added with Status = "Pending Review". Pending buyers never receive
 * deals until you approve them (which requires a valid email address).
 * Everything that happens is recorded in the "Buyer Intake Log" sheet.
 */

var INTAKE_SOURCES = {
  form: { label: 'Signup form', setting: 'INTAKE_FORM_ON' },
  sheet: { label: 'Google Sheet sync', setting: 'INTAKE_SHEET_ON' },
  cash: { label: 'Cash buyer (public records)', setting: 'INTAKE_CASH_ON' },
  gmail: { label: 'Gmail inquiry', setting: 'INTAKE_GMAIL_ON' },
  dealmachine: { label: 'DealMachine (recent sales)', setting: 'INTAKE_DM_ON' },
  county: { label: 'County records (Norfolk)', setting: 'INTAKE_COUNTY_ON' },
  watch: { label: 'Public records (Hampton Roads, Richmond, NC)', setting: 'INTAKE_WATCH_ON' }
};

var BUYER_FORM_Q = {
  first: 'First name',
  last: 'Last name',
  company: 'Company / LLC',
  email: 'Email',
  phone: 'Mobile phone',
  markets: 'Markets you buy in',
  types: 'Property types',
  strategy: 'How do you invest?',
  min: 'Minimum purchase price',
  max: 'Maximum purchase price',
  buybox: 'Describe your buy box',
  funding: 'How do you fund purchases?',
  consent: 'Deal alerts'
};

// ---------- shared helpers ----------

function normKey_(s) { return lc_(s).replace(/[^a-z0-9]/g, ''); }

/** Identity for buyers without an email (public-records owners): name + mailing street. */
function ownerKey_(inv) {
  // Companies / LLCs are identified by name alone (public records often lack their mailing address)
  if (str_(inv.company) && ENTITY_RE.test(inv.company)) return 'co|' + normKey_(inv.company);
  var name = normKey_(str_(inv.company) || (str_(inv.firstName) + ' ' + str_(inv.lastName)));
  var addr = normKey_(String(inv.mailingAddress || '').split(',')[0]);
  return name && addr ? name + '|' + addr : '';
}

function titleCase_(s) {
  s = str_(s);
  if (s !== s.toUpperCase()) return s;
  return s.toLowerCase().replace(/\b([a-z])/g, function (m) { return m.toUpperCase(); })
    .replace(/\b(Llc|Lp|Llp|Ii|Iii|Iv)\b/g, function (m) { return m.toUpperCase(); });
}

function parseDateLoose_(v) {
  if (!v) return null;
  if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
  var s = str_(v), m;
  if ((m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/))) {
    var y = Number(m[3]); if (y < 100) y += 2000;
    return new Date(y, Number(m[1]) - 1, Number(m[2]));
  }
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  var d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

/** Maps any property-type wording to one of your configured property types. */
function normalizePropType_(raw) {
  var t = lc_(raw);
  if (!t) return '';
  var types = list_(getSettings_().PROPERTY_TYPES);
  var pick = function (re) { return types.filter(function (x) { return re.test(lc_(x)); })[0]; };
  var hit = null;
  if (/condo|town ?h|townhome|townhouse/.test(t)) hit = pick(/condo|town/);
  else if (/mobile|manufactured/.test(t)) hit = pick(/mobile|manufactured/);
  else if (/duplex|triplex|fourplex|quadplex|quad|2-4|2 ?- ?4 units|multi.{0,12}(2|3|4)\b/.test(t)) hit = pick(/2-4|\(2/);
  else if (/apartment|5\+|multi/.test(t)) hit = pick(/5\+|multi/);
  else if (/land|lot|vacant|acre/.test(t)) hit = pick(/land|lot/);
  else if (/mixed/.test(t)) hit = pick(/mixed/);
  else if (/commercial|retail|office|industrial|warehouse/.test(t)) hit = pick(/commercial/);
  else if (/sfr|single|residential|house|home|detached/.test(t)) hit = pick(/single/);
  return hit || titleCase_(raw);
}

/** Pulls a price range out of free text like "under $250k", "$100k-$300k", "up to 1.2M". */
function parsePriceRange_(text) {
  var t = String(text || '');
  var re = /\$\s?(\d[\d,]*(?:\.\d+)?)\s*([km])?\b|\b(\d+(?:\.\d+)?)\s*([km])\b/gi;
  var found = [], m;
  while ((m = re.exec(t))) {
    var n = parseFloat(String(m[1] || m[3]).replace(/,/g, ''));
    var suf = lc_(m[2] || m[4]);
    if (suf === 'k') n *= 1000;
    if (suf === 'm') n *= 1000000;
    if (n >= 10000 && n < 100000000) found.push({ n: n, at: m.index });
  }
  if (!found.length) return { min: '', max: '' };
  if (found.length > 1) {
    var ns = found.map(function (f) { return f.n; });
    return { min: Math.min.apply(null, ns), max: Math.max.apply(null, ns) };
  }
  var before = lc_(t.slice(Math.max(0, found[0].at - 25), found[0].at));
  if (/(over|above|min|at least|starting|from)\s*\$?\s*$/.test(before)) return { min: found[0].n, max: '' };
  return { min: '', max: found[0].n };
}

var STRATEGY_WORDS = [
  [/\bflip|rehab|fix (and|&|n) flip/i, 'Fix & Flip'],
  [/\brental|buy (and|&|n) hold|long[- ]term hold|cash ?flow/i, 'Buy & Hold'],
  [/\bbrrrr?\b/i, 'BRRRR'],
  [/\bcash buyer|all cash|pay cash|cash purchase/i, 'Cash Buyer'],
  [/\bwholesal/i, 'Wholesaler'],
  [/\bdevelop|new construction|build/i, 'Developer'],
  [/\blend(er|ing)\b|private money|hard money lender/i, 'Private Lender'],
  [/\bfund\b|institutional|portfolio/i, 'Hedge Fund / Institutional']
];
var TYPE_WORDS = /\b(sfrs?|single[- ]famil(y|ies)|condos?|townhouses?|townhomes?|(duplex|triplex|fourplex|quadplex)(es)?|multi[- ]?famil(y|ies)|apartments?|mobile homes?|manufactured|land|lots?|commercial|mixed[- ]use)\b/gi;

/** Picks categories mentioned in text, using your own category names where they exist. */
function strategiesIn_(text) {
  var mine = list_(getSettings_().CATEGORIES);
  var out = [];
  STRATEGY_WORDS.forEach(function (w) {
    if (!w[0].test(text)) return;
    var own = mine.filter(function (c) { return lc_(c) === lc_(w[1]); })[0];
    var name = own || w[1];
    if (out.indexOf(name) === -1) out.push(name);
  });
  return out;
}

function typesIn_(text) {
  var out = [];
  (String(text).match(TYPE_WORDS) || []).forEach(function (w) {
    var t = normalizePropType_(w);
    if (t && out.indexOf(t) === -1) out.push(t);
  });
  return out;
}

function marketsIn_(text) {
  var t = lc_(text);
  return list_(getSettings_().MARKETS).filter(function (m) { return t.indexOf(lc_(m)) > -1; });
}

// ---------- intake context ----------

function intakeCtx_() {
  var table = readTable_(SHEET.INVESTORS);
  var ctx = { byEmail: {}, byKey: {}, refs: {}, logs: [], adds: [], updates: {}, cur: null };
  table.rows.forEach(function (r) {
    if (str_(r.email)) ctx.byEmail[lc_(r.email)] = r;
    var k = ownerKey_(r);
    if (k) ctx.byKey[k] = r;
  });
  readTable_(SHEET.INTAKE).rows.forEach(function (l) {
    if (!l.ref) return;
    ctx.refs[l.ref] = true;
    String(l.ref).split(';').forEach(function (r) { if (r) ctx.refs[r] = true; }); // one buyer can cover several sales
  });
  return ctx;
}

/**
 * Adds one buyer (or records why not). Returns 'added' | 'updated' | 'duplicate' | 'skipped' | 'seen'.
 * ref: a stable reference for this record (form response id, message id, …) so nothing is processed twice.
 */
function addLead_(ctx, sourceLabel, lead, ref, details) {
  if (ref && ctx.refs[ref]) return 'seen';
  if (ref) ctx.refs[ref] = true;
  var cur = ctx.cur || (ctx.cur = { added: 0, updated: 0, duplicate: 0, skipped: 0 });
  var email = lc_(lead.email).replace(/^mailto:/, '');
  if (email && !isEmail_(email)) email = '';
  lead.email = email;
  var log = {
    id: shortId_('B-'), received: new Date(), source: sourceLabel, name: investorName_(lead) || '(no name)',
    email: email, phone: str_(lead.phone), result: '', investorId: '', details: str_(details).slice(0, 500), ref: ref || ''
  };
  var key = ownerKey_(lead);
  if (!email && !key) {
    log.result = 'Skipped — no email or mailing address';
    ctx.logs.push(log); cur.skipped++;
    return 'skipped';
  }
  if (!investorName_(lead) || investorName_(lead) === email) {
    if (!str_(lead.firstName) && !str_(lead.company) && email) lead.firstName = titleCase_(email.split('@')[0].split(/[._\-+]/)[0]);
  }
  var existing = (email && ctx.byEmail[email]) || (key && ctx.byKey[key]);
  if (existing) {
    log.investorId = existing.id;
    var f = {};
    if (lead.purchaseCount && Number(lead.purchaseCount) > (Number(existing.purchaseCount) || 0)) {
      f.purchases = lead.purchases; f.purchaseCount = lead.purchaseCount; f.lastPurchase = lead.lastPurchase;
      if (lead.lastPurchaseAddress) f.lastPurchaseAddress = lead.lastPurchaseAddress;
    }
    if (email && !str_(existing.email)) f.email = email;
    if (str_(lead.phone) && !str_(existing.phone)) f.phone = str_(lead.phone);
    if (Object.keys(f).length) {
      f.updated = new Date();
      if (existing._row) {
        var pending = ctx.updates[existing.id] || (ctx.updates[existing.id] = { row: existing._row, fields: {} });
        Object.keys(f).forEach(function (k) { pending.fields[k] = f[k]; });
      }
      // records created earlier in this same run are still in ctx.adds: just update them in place
      Object.keys(f).forEach(function (k) { existing[k] = f[k]; });
      if (f.email) ctx.byEmail[f.email] = existing;
      log.result = 'Updated existing buyer (' + Object.keys(f).filter(function (k) { return k !== 'updated'; }).join(', ') + ')';
      cur.updated++;
      ctx.logs.push(log);
      return 'updated';
    }
    log.result = 'Already in database';
    cur.duplicate++;
    ctx.logs.push(log);
    return 'duplicate';
  }
  var rec = normalizeInvestor_(lead);
  rec.status = PENDING_REVIEW;
  rec.id = nextId_('INVESTOR_SEQ', 'INV-', 5);
  rec.source = sourceLabel;
  rec.dateAdded = new Date();
  rec.updated = new Date();
  rec.dealsReceived = 0;
  rec.optOut = false;
  rec.mailingAddress = str_(lead.mailingAddress);
  rec.purchases = str_(lead.purchases);
  rec.purchaseCount = lead.purchaseCount || '';
  rec.lastPurchase = lead.lastPurchase || '';
  rec.lastPurchaseAddress = str_(lead.lastPurchaseAddress);
  ctx.adds.push(rec);
  if (email) ctx.byEmail[email] = rec;
  if (key) ctx.byKey[key] = rec;
  log.investorId = rec.id;
  log.result = 'Added — pending review';
  cur.added++;
  ctx.logs.push(log);
  return 'added';
}

function flushIntake_(ctx) {
  appendObjects_(SHEET.INVESTORS, ctx.adds);
  Object.keys(ctx.updates).forEach(function (id) {
    updateObject_(SHEET.INVESTORS, ctx.updates[id].row, ctx.updates[id].fields);
  });
  appendObjects_(SHEET.INTAKE, ctx.logs);
}

function buyerForm_() {
  var id = str_(getSettings_().BUYER_FORM_ID);

}

function formLeads_(ctx) {

  form.getResponses().forEach(function (resp) {

    resp.getItemResponses().forEach(function (ir) {

      minPrice: num_(a[Q.min]), maxPrice: num_(a[Q.max]), criteria: a[Q.buybox], notes: notes.join(' ')
    }, ref, 'Form response ' + fmtDate_(resp.getTimestamp(), 'MMM d, yyyy h:mm a'));

/** Installable trigger: adds a buyer the moment they submit the form. */
function onBuyerFormSubmit() {
  var lock = LockService.getScriptLock();
  if (!lock.tryLock(20000)) return; // the daily run will pick it up
  try {
    _lockDepth = 1; _lock = lock;
    runIntakeSources_(['form'], false);
  } finally {
    _lockDepth = 0;
    lock.releaseLock();
  }
}

function ensureFormTrigger_(form) {
