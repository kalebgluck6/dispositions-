<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #070908;
  --panel: #0E1311;
  --panel-2: #121A16;
  --line: #1D2823;
  --line-2: #27362F;
  --green-900: #082419;
  --green-800: #0B2E21;
  --green-700: #114330;
  --green-600: #17583F;
  --accent: #2E9A63;
  --accent-2: #47B97C;
  --accent-soft: #7BC8A0;
  --text: #E7EDE9;
  --text-2: #B5C2BB;
  --muted: #7D8C85;
  --amber: #E8B53A;
  --red: #D9534F;
  --blue: #5A9BD8;
  --radius: 10px;
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
a { color: var(--accent-soft); }
button, input, select, textarea { font-family: inherit; font-size: 14px; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 256px 1fr; min-height: 100vh; }
.sidebar { background: #040605; border-right: 1px solid var(--line); padding: 26px 16px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; overflow-y: auto; }
.brand { padding: 0 10px 26px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.brand .mark { display: flex; align-items: center; gap: 12px; }
.brand .monogram { width: 40px; height: 40px; border: 1px solid var(--accent); display: grid; place-items: center; font-family: var(--serif); font-size: 20px; color: var(--accent-soft); letter-spacing: 1px; background: linear-gradient(135deg, var(--green-800), #050706); }
.brand .word { font-family: var(--serif); font-size: 19px; white-space: nowrap; line-height: 1; color: #fff; }
.brand .word span { color: var(--accent-soft); }
.brand .sub { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-sec { font-size: 9.5px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--muted); padding: 14px 12px 6px; font-weight: 600; }
.nav-sec:first-child { padding-top: 0; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--text-2); text-decoration: none; cursor: pointer; font-size: 13.5px; border: 1px solid transparent; }
.nav a:hover { background: var(--panel); color: #fff; }
.nav a.active { background: var(--green-800); color: #fff; border-color: var(--green-700); }
.nav a svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav .badge { margin-left: auto; background: var(--accent); color: #04110B; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 20px; }
.sidebar .foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); line-height: 1.6; }

.main { min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 16px 32px; background: rgba(7,9,8,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar h1 { font-family: var(--serif); font-weight: 600; font-size: 28px; margin: 0; letter-spacing: .3px; }
.topbar .spacer { flex: 1; }
.content { padding: 28px 32px 60px; max-width: 1400px; }

.mode-pill { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 7px 12px; border-radius: 30px; cursor: pointer; border: 1px solid; }
.mode-pill.test { color: var(--amber); border-color: rgba(232,181,58,.45); background: rgba(232,181,58,.08); }
.mode-pill.live { color: #FF8A84; border-color: rgba(217,83,79,.5); background: rgba(217,83,79,.1); }
.mode-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
.quota { font-size: 12px; color: var(--muted); }

.test-banner { background: repeating-linear-gradient(-45deg, rgba(232,181,58,.12), rgba(232,181,58,.12) 12px, rgba(232,181,58,.06) 12px, rgba(232,181,58,.06) 24px); border: 1px solid rgba(232,181,58,.35); color: #F3D58A; padding: 10px 16px; border-radius: var(--radius); margin-bottom: 22px; font-size: 13px; display: flex; gap: 10px; align-items: center; }

/* ---------- primitives ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); cursor: pointer; font-weight: 500; white-space: nowrap; transition: .15s; }
.btn:hover { border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #03140B; font-weight: 600; }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: rgba(217,83,79,.5); color: #FF9A95; background: rgba(217,83,79,.08); }
.btn.sm { padding: 6px 10px; font-size: 12.5px; }
.btn svg { width: 15px; height: 15px; }
.btn-send { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 8px; border: 1px solid var(--accent); cursor: pointer; font-weight: 700; letter-spacing: 1.6px; font-size: 12.5px; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--green-700), var(--green-900)); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 6px 18px rgba(46,154,99,.18); transition: .15s; }
.btn-send:hover { background: linear-gradient(135deg, var(--green-600), var(--green-800)); box-shadow: 0 8px 24px rgba(46,154,99,.3); }
.btn-send:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn-send svg { width: 16px; height: 16px; }
.btn-send.sm { padding: 8px 12px; font-size: 11px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.card .hd { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.card .hd h3 { margin: 0; font-family: var(--serif); font-size: 21px; font-weight: 600; }
.card .bd { padding: 18px 20px; }
.section-title { font-size: 11px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--accent-soft); margin: 0 0 12px; font-weight: 600; }

.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.stack > * + * { margin-top: 14px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.right { text-align: right; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.hidden { display: none !important; }

.kpi { padding: 18px 20px; position: relative; overflow: hidden; }
.kpi .label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.kpi .value { font-family: var(--serif); font-size: 38px; font-weight: 600; margin-top: 4px; line-height: 1.1; }
.kpi .meta { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.kpi::after { content: ''; position: absolute; right: -30px; top: -30px; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(46,154,99,.18), transparent 70%); }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 11.5px; letter-spacing: .6px; color: var(--text-2); font-weight: 500; }
.field .hint { font-size: 11.5px; color: var(--muted); }
input[type=text], input[type=password], input[type=email], input[type=number], input[type=date], input[type=url], input[type=tel], input[type=search], select, textarea {
  width: 100%; background: #090D0B; border: 1px solid var(--line-2); color: var(--text); border-radius: 8px; padding: 9px 11px; outline: none; transition: border-color .15s;
}
textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(46,154,99,.15); }
input[type=date] { color-scheme: dark; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.prefix { position: relative; }
.prefix span { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.prefix input { padding-left: 24px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text-2); user-select: none; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 12px; border-radius: 30px; border: 1px solid var(--line-2); background: #090D0B; color: var(--text-2); cursor: pointer; font-size: 12.5px; user-select: none; }
.chip.on { background: var(--green-800); border-color: var(--accent); color: #fff; }

.tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--text-2); margin: 1px 2px 1px 0; white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; border: 1px solid; }
.status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-Available { color: var(--accent-2); border-color: rgba(71,185,124,.4); background: rgba(71,185,124,.08); }
.st-Pending { color: var(--amber); border-color: rgba(232,181,58,.4); background: rgba(232,181,58,.08); }
.st-Dead { color: #FF8A84; border-color: rgba(217,83,79,.4); background: rgba(217,83,79,.07); }
.st-Sold { color: #9FB3FF; border-color: rgba(159,179,255,.35); background: rgba(159,179,255,.07); }
.st-Active { color: var(--accent-2); border-color: rgba(71,185,124,.4); }
.st-Inactive { color: var(--muted); border-color: var(--line-2); }
.tier { font-family: var(--serif); font-size: 15px; color: var(--accent-soft); }

/* tables */
.table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 12px 14px; border-bottom: 1px solid var(--line); background: #0B100E; position: sticky; top: 0; white-space: nowrap; }
table.t td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover { background: rgba(46,154,99,.04); }
table.t tr.click { cursor: pointer; }
table.t td.nowrap { white-space: nowrap; }
.empty { padding: 50px 20px; text-align: center; color: var(--muted); }
.empty h4 { font-family: var(--serif); font-size: 22px; color: var(--text); margin: 0 0 6px; font-weight: 600; }

/* deals */
.deal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; }
.deal-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: .15s; }
.deal-card:hover { border-color: var(--line-2); transform: translateY(-1px); box-shadow: var(--shadow); }
.deal-card .top { padding: 18px 20px 14px; background: linear-gradient(160deg, var(--green-900), var(--panel) 75%); border-bottom: 1px solid var(--line); cursor: pointer; }
.deal-card .id { font-size: 10.5px; letter-spacing: 2px; color: var(--accent-soft); text-transform: uppercase; }
.deal-card .addr { font-family: var(--serif); font-size: 23px; font-weight: 600; margin: 6px 0 2px; line-height: 1.15; }
.deal-card .city { color: var(--text-2); font-size: 13px; }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.nums div { padding: 12px 10px; text-align: center; }
.nums div + div { border-left: 1px solid var(--line); }
.nums .l { font-size: 9.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.nums .v { font-family: var(--serif); font-size: 18px; font-weight: 600; margin-top: 2px; }
.deal-card .meta { padding: 12px 20px; font-size: 12.5px; color: var(--text-2); display: flex; gap: 14px; flex-wrap: wrap; }
.deal-card .actions { padding: 14px 20px 18px; display: flex; gap: 8px; align-items: center; margin-top: auto; flex-wrap: wrap; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; flex-wrap: wrap; }
.tabs a { padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 13px; }
.tabs a.on { color: #fff; border-color: var(--accent); }
.tabs a .n { font-size: 11px; color: var(--muted); margin-left: 4px; }

.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.photo { position: relative; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden; background: #0A0F0C; border: 1px solid var(--line-2); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .cover { position: absolute; left: 6px; top: 6px; background: var(--accent); color: #03140B; font-size: 10px; font-weight: 700; letter-spacing: 1px; padding: 2px 6px; border-radius: 4px; }
.photo .ops { position: absolute; inset: auto 0 0 0; display: flex; justify-content: space-between; padding: 6px; background: linear-gradient(transparent, rgba(0,0,0,.8)); opacity: 0; transition: .15s; }
.photo:hover .ops { opacity: 1; }
.photo .ops button { background: rgba(0,0,0,.7); border: 1px solid var(--line-2); color: #fff; border-radius: 5px; font-size: 11px; padding: 3px 7px; cursor: pointer; }
.photo .pending { position: absolute; right: 6px; top: 6px; background: rgba(0,0,0,.7); font-size: 10px; padding: 2px 6px; border-radius: 4px; color: var(--amber); }
.drop { border: 1.5px dashed var(--line-2); border-radius: 10px; padding: 22px; text-align: center; color: var(--muted); cursor: pointer; transition: .15s; }
.drop:hover, .drop.over { border-color: var(--accent); color: var(--text); background: rgba(46,154,99,.05); }

.metric-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.metric-strip > div { background: var(--panel); padding: 14px 16px; }
.metric-strip .l { font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
.metric-strip .v { font-family: var(--serif); font-size: 22px; font-weight: 600; margin-top: 2px; }
.metric-strip .v.good { color: var(--accent-2); }

.activity { list-style: none; margin: 0; padding: 0; }
.activity li { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.activity li:last-child { border: 0; }
.activity .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--green-800); color: var(--accent-soft); flex: none; }
.activity .ic svg { width: 15px; height: 15px; }
.activity .when { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

/* modal */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.72); backdrop-filter: blur(3px); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow: auto; }
.modal { background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; width: 100%; max-width: 760px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.modal.wide { max-width: 1060px; }
.modal .mh { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
.modal .mh h2 { margin: 0; font-family: var(--serif); font-size: 26px; font-weight: 600; flex: 1; }
.modal .mh .x { background: none; border: 0; color: var(--muted); font-size: 24px; cursor: pointer; line-height: 1; }
.modal .mb { padding: 22px 24px; }
.modal .mf { padding: 16px 24px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; align-items: center; }

.steps { display: flex; gap: 0; margin-bottom: 22px; }
.steps div { flex: 1; padding: 10px 12px; font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--line); }
.steps div.on { color: #fff; border-color: var(--accent); }
.steps div.done { color: var(--accent-soft); border-color: var(--green-600); }
.option { border: 1px solid var(--line-2); border-radius: 10px; padding: 14px 16px; cursor: pointer; background: #090D0B; transition: .15s; }
.option:hover { border-color: var(--green-600); }
.option.on { border-color: var(--accent); background: var(--green-900); }
.option b { display: block; font-size: 14px; margin-bottom: 3px; }
.option span { font-size: 12px; color: var(--muted); }
.count-big { font-family: var(--serif); font-size: 54px; font-weight: 600; line-height: 1; color: #fff; }
.pick-list { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.pick-list label { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
.pick-list label:last-child { border: 0; }
.pick-list label:hover { background: rgba(46,154,99,.05); }
.preview-frame { width: 100%; height: 620px; border: 1px solid var(--line-2); border-radius: 10px; background: #fff; }
.confirm-box { border-radius: 12px; padding: 20px 22px; }
.confirm-box.test { border: 1px solid rgba(232,181,58,.45); background: rgba(232,181,58,.06); }
.confirm-box.live { border: 1px solid rgba(217,83,79,.5); background: rgba(217,83,79,.06); }
.confirm-box h4 { margin: 0 0 8px; font-family: var(--serif); font-size: 22px; }
.confirm-input { font-size: 18px !important; letter-spacing: 4px; text-transform: uppercase; text-align: center; max-width: 220px; }
.progress { height: 8px; background: var(--line); border-radius: 10px; overflow: hidden; }
.progress div { height: 100%; background: linear-gradient(90deg, var(--green-600), var(--accent-2)); transition: width .4s; }

/* toast + loading */
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 300; display: flex; flex-direction: column; gap: 10px; }
.toast { background: var(--panel-2); border: 1px solid var(--line-2); border-left: 3px solid var(--accent); padding: 12px 16px; border-radius: 8px; box-shadow: var(--shadow); max-width: 380px; font-size: 13px; animation: slide .2s ease-out; }
.toast.err { border-left-color: var(--red); }
.toast.warn { border-left-color: var(--amber); }
@keyframes slide { from { transform: translateY(10px); opacity: 0; } }
.spinner { width: 18px; height: 18px; border: 2px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
.spinner.lg { width: 36px; height: 36px; border-width: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 60px; color: var(--muted); }
.boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 500; }
.boot .inner { text-align: center; }
.boot .word { font-family: var(--serif); font-size: 40px; color: #fff; margin: 18px 0 6px; }
.boot .word span { color: var(--accent-soft); }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar input[type=search] { max-width: 300px; }
.toolbar select { width: auto; min-width: 140px; }
.bulkbar { display: flex; gap: 10px; align-items: center; padding: 10px 14px; background: var(--green-900); border: 1px solid var(--green-700); border-radius: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.bulkbar select { width: auto; }

@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, 1fr); } .g3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 12px; }
  .brand { border: 0; padding: 4px 10px; margin: 0; }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .sidebar .foot { display: none; }
  .g2, .g3, .g4 { grid-template-columns: 1fr; }
  .content, .topbar { padding-left: 16px; padding-right: 16px; }
}
</style>

</head>
<body>
  <div class="boot" id="boot">
    <div class="inner">
      <div class="spinner lg"></div>
      <div class="word">SameDay<span>Investments</span></div>
      <div class="muted small" style="letter-spacing:3px;text-transform:uppercase">Deal Distribution</div>
    </div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">
          <div class="monogram">SD</div>
          <div>
            <div class="word">SameDay<span>Investments</span></div>
            <div class="sub">Deal Distribution</div>
          </div>

  var plan = [];
  A.invs.forEach(function (inv) {
    if ((str_(inv.status) || 'Active') !== 'Active') return;
    var cur = tiers.map(lc_).indexOf(lc_(inv.tier));
    var st = stats[inv.id] || { heat: 0 }, closed = Number(inv.dealsClosed) || 0, defaults = Number(inv.defaults) || 0;
    var rel = reliabilityOf_(inv), pof = pofStatus_(inv);
    var target = cur, reason = '';
    var recentlyChanged = tms_(inv.tierChanged) > Date.now() - 90 * 86400000;
    if (defaults >= n('TIER_DOWN_DEFAULTS', 2)) {
      // demote once per 90 days, never promote a buyer with repeated failed closings
      if (!recentlyChanged && cur > -1 && cur < tiers.length - 1) { target = cur + 1; reason = defaults + ' failed closings'; }
    }
    else if (closed >= n('TIER_TOP_MIN_CLOSED', 2) && st.heat >= n('TIER_TOP_MIN_HEAT', 60) && (rel === '' || rel >= 4) && (cur === -1 || cur > 0)) { target = 0; reason = closed + ' closed, heat ' + st.heat; }
    else if ((closed >= n('TIER_SECOND_MIN_CLOSED', 1) || (st.heat >= n('TIER_SECOND_MIN_HEAT', 45) && (pof === 'Verified' || pof === 'Expiring'))) && (cur === -1 || cur > 1)) {
      target = 1; reason = closed ? closed + ' closed with us' : 'heat ' + st.heat + ' + verified funds';
    }
    if (target !== cur && target > -1) plan.push({ id: inv.id, name: investorName_(inv), from: str_(inv.tier) || '—', to: tiers[target], reason: reason, up: cur === -1 || target < cur, _row: inv._row, notes: inv.notes });
  });
  return plan;
}

function applyTierPlan_(plan) {
  plan.forEach(function (p) {
    updateObject_(SHEET.INVESTORS, p._row, {
      tier: p.to, tierChanged: new Date(), updated: new Date(),
      notes: (str_(p.notes) + ' [Tier ' + p.from + ' → ' + p.to + ' ' + fmtDate_(new Date()) + ': ' + p.reason + ']').trim()
    });
  });
  return plan.length;
}

function writeHeatColumn_(A, stats) {
  if (!A.invs.length) return;
  var last = A.invs[A.invs.length - 1]._row;
  var vals = [];
  var byRow = {};
  A.invs.forEach(function (i) { byRow[i._row] = i; });
  for (var r = 2; r <= last; r++) vals.push(byRow[r] && stats[byRow[r].id] ? stats[byRow[r].id].heat : '');
  writeColumn_(SHEET.INVESTORS, 'heat', 2, vals);
}

// ---------- dead-deal recovery ----------

function acceptableOffer_(o, d) {
  if (ACTIVE_OFFER.indexOf(o.status) === -1) return false;
  var fee = offerFee_(o, d), min = Number(getSettings_().MIN_ACCEPTABLE_FEE) || 0;
  if (fee !== '' && Number(fee) >= min) return true;
  return Number(o.amount) >= (Number(d.askingPrice) || Infinity) * 0.95;
}

function recoveryCandidates_(A) {
  var days = Number(getSettings_().RECOVERY_DAYS) || 5;
  var out = [];
  A.deals.forEach(function (d) {
    var c = cleanDealRow_(d);
    if (c.status !== 'Available' || c.stageIndex < 1 || c.stageIndex > 4) return;
    var since = tms_(d.lastDistributed) || tms_(d.firstDistributed);
    if (!since || Date.now() - since < days * 86400000) return;
    var offers = A.offers.filter(function (o) { return o.dealId === d.id; });
    if (offers.some(function (o) { return acceptableOffer_(o, d); })) return;
    var recent = A.jobs.some(function (j) { return j.dealId === d.id && str_(j.kind) === 'recovery' && Date.now() - tms_(j.created) < days * 86400000; });
    if (recent) return;
    out.push({ dealId: d.id, title: dealTitle_(d), days: Math.floor((Date.now() - since) / 86400000), offers: offers.length,
      bestOffer: Math.max.apply(null, offers.map(function (o) { return Number(o.amount) || 0; }).concat([0])), askingPrice: Number(d.askingPrice) || 0, rep: str_(d.rep) });
  });
  return out;
}

/** Queues a distribution without the interactive confirmation (used by automatic recovery). */
function autoDistribute_(dealId, audience, kind, who) {
  var deal = getDealRow_(dealId);
  var res = resolveAudience_(deal, audience, readTable_(SHEET.INVESTORS).rows, readTable_(SHEET.LOG).rows);
  if (!res.included.length) return null;
  var token = Utilities.getUuid();
  CacheService.getScriptCache().put('dist_' + token, JSON.stringify({
    kind: kind, dealId: dealId, audience: audience, ids: res.included.map(function (i) { return i.id; }),
    waves: res.included.map(function (i) { return i._wave || 1; }), scores: res.included.map(function (i) { return i._score === undefined ? '' : i._score; }),
    mode: isTestMode_() ? 'TEST' : 'LIVE', user: who
  }), 900);
  return confirmDistribution_(token, 'SEND', true);
}

// ---------- nightly automation ----------

/** Trigger entry (2 AM): heat scores, automatic tier changes, automatic dead-deal recovery. */
function runNightly() {
  return withLock_(function () {
    var s = getSettings_(), A = loadAll_(), stats = buyerStats_(A), out = { tiers: 0, recovered: 0 };
    writeHeatColumn_(A, stats);
    if (bool_(s.AUTO_TIER_ON)) out.tiers = applyTierPlan_(tierPlan_(A, stats));
    if (bool_(s.RECOVERY_AUTO)) {

  });
}

// ---------- client API ----------

function getCeoDashboard(days) {
  requireRole_('Viewer');
  days = Number(days) || 90;
  var A = loadAll_(), since = Date.now() - days * 86400000, stats = buyerStats_(A);
  var deals = A.deals.map(function (d) { var c = cleanDealRow_(d); c._raw = d; return c; });
  var inRange = function (v) { return tms_(v) >= since; };
  var distributed = deals.filter(function (d) { return inRange(d._raw.firstDistributed || d._raw.lastDistributed); });
  var closed = deals.filter(function (d) { return d.stage === 'Closed' && inRange(d._raw.soldDate); });
  var contracted = distributed.filter(function (d) { return d.stageIndex >= 5 && d.stage !== 'Dead Deal'; });
  var distIds = {}; distributed.forEach(function (d) { distIds[d.id] = true; });
  var offersOnDist = A.offers.filter(function (o) { return distIds[o.dealId]; });
  var daysToBuyer = deals.filter(function (d) { return d._raw.buyerSelectedOn && inRange(d._raw.buyerSelectedOn); }).map(function (d) {
    return (tms_(d._raw.buyerSelectedOn) - (tms_(d._raw.firstDistributed) || tms_(d._raw.created))) / 86400000;
  }).filter(function (x) { return x >= 0; });
  var fees = closed.map(function (d) { return dealFee_(d._raw); }).filter(function (x) { return x > 0; });
  var sentPairs = {}, respPairs = {}, interestPairs = {};
  A.log.forEach(function (l) { if (l.mode === 'LIVE' && l.status === 'Sent' && inRange(l.sentAt)) sentPairs[l.dealId + '|' + l.investorId] = true; });
  A.resp.forEach(function (r) {
    var k = r.dealId + '|' + r.investorId;
    if (sentPairs[k]) respPairs[k] = true;
    if ((r.type === 'Interested' || r.type === 'Offer') && inRange(r.received)) interestPairs[k] = true;
  });
  A.offers.forEach(function (o) { if (inRange(o.received)) interestPairs[o.dealId + '|' + o.investorId] = true; });
  var byKey = function (fn) {
    var m = {};
    closed.forEach(function (d) { var k = fn(d) || 'Unassigned'; m[k] = m[k] || { name: k, deals: 0, revenue: 0 }; m[k].deals++; m[k].revenue += dealFee_(d._raw); });
    return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return b.revenue - a.revenue; });
  };
  var months = [];
  for (var i = 5; i >= 0; i--) {
    var dt = new Date(); dt.setDate(1); dt.setMonth(dt.getMonth() - i);
    var key = fmtDate_(dt, 'yyyy-MM');
    var md = deals.filter(function (d) { return d.stage === 'Closed' && fmtDate_(asDate_(d._raw.soldDate) || new Date(0), 'yyyy-MM') === key; });
    months.push({ name: fmtDate_(dt, 'MMM yyyy'), deals: md.length, revenue: md.reduce(function (t, d) { return t + dealFee_(d._raw); }, 0) });
  }
  var stuckDays = Number(getSettings_().FU_STUCK_DAYS) || 7;
  var stale = deals.filter(function (d) { return ['Closed', 'Dead Deal'].indexOf(d.stage) === -1; }).map(function (d) {
    return { id: d.id, title: d.title, stage: d.stage, rep: d.rep, days: Math.floor((Date.now() - dealLastActivity_(d._raw, A)) / 86400000) };
  }).filter(function (x) { return x.days >= stuckDays; }).sort(function (a, b) { return b.days - a.days; });
  var top = A.invs.map(function (inv) { var s = stats[inv.id]; return { id: inv.id, name: investorName_(inv), tier: str_(inv.tier), heat: s.heat, closed: s.closed, offers: s.offers, responseRate: s.responseRate, closeRate: s.closeRate }; })
    .filter(function (x) { return x.heat > 0 || x.closed > 0; }).sort(function (a, b) { return b.closed - a.closed || b.heat - a.heat; }).slice(0, 10);
  var stages = {};
  deals.forEach(function (d) { stages[d.stage] = (stages[d.stage] || 0) + 1; });
  return toClient_({
    days: days,
    kpi: {
      dealsDistributed: distributed.length,
      avgOffersPerDeal: distributed.length ? Math.round((offersOnDist.length / distributed.length) * 10) / 10 : 0,
      avgDaysToBuyer: daysToBuyer.length ? Math.round(avg_(daysToBuyer) * 10) / 10 : null,
      avgFee: fees.length ? Math.round(avg_(fees)) : null,
      revenue: fees.reduce(function (t, x) { return t + x; }, 0),
      closedDeals: closed.length,
      distToContract: pct_(contracted.length, distributed.length),
      responseRate: pct_(Object.keys(respPairs).length, Object.keys(sentPairs).length),
      buyerToClosing: pct_(closed.length, Object.keys(interestPairs).length),
      activeDeals: deals.filter(function (d) { return d.status === 'Available'; }).length,

    },
    byMarket: byKey(function (d) { return marketOf_(d._raw); }),
    byRep: byKey(function (d) { return str_(d.rep).replace(/\s*<[^>]+>/, ''); }),
    months: months,

function getDistributionAnalytics() {
  requireRole_('Viewer');
  var A = loadAll_(), comp = competitionMap_(A);
  var rows = A.deals.filter(function (d) { return tms_(d.firstDistributed) || Number(d.timesDistributed); }).map(function (d) {
    var sent = A.log.filter(function (l) { return l.dealId === d.id && l.mode === 'LIVE' && l.status === 'Sent'; });
    var recv = {}, firstSent = Infinity;
    sent.forEach(function (l) { recv[l.investorId] = true; firstSent = Math.min(firstSent, tms_(l.sentAt) || Infinity); });
    var rs = A.resp.filter(function (r) { return r.dealId === d.id; });
    var responded = {}, interested = {}, passes = {}, firstResp = Infinity;
    rs.forEach(function (r) {
      responded[r.investorId || r.investorEmail] = true;
      firstResp = Math.min(firstResp, tms_(r.received) || Infinity);
      if (r.type === 'Interested' || r.type === 'Offer') interested[r.investorId || r.investorEmail] = true;
      if (r.type === 'Not Interested') { var why = str_(r.passReason) || 'Other'; passes[why] = (passes[why] || 0) + 1; }
    });
    var offers = A.offers.filter(function (o) { return o.dealId === d.id; });
    var waves = {};
    sent.forEach(function (l) { var w = Number(l.wave) || 1; waves[w] = (waves[w] || 0) + 1; });
    var c = cleanDealRow_(d);
    return {
      id: d.id, title: dealTitle_(d), stage: c.stage, market: marketOf_(d), received: Object.keys(recv).length, responded: Object.keys(responded).length,
      responseRate: pct_(Object.keys(responded).length, Object.keys(recv).length), interested: Object.keys(interested).length, offers: offers.length,
      bestOffer: Math.max.apply(null, offers.map(function (o) { return Number(o.amount) || 0; }).concat([0])), competition: comp[d.id] || 0,
      passes: passes, passTotal: Object.keys(passes).reduce(function (t, k) { return t + passes[k]; }, 0),
      hoursToFirstResponse: firstSent < Infinity && firstResp < Infinity && firstResp >= firstSent ? Math.round((firstResp - firstSent) / 3600000) : null,
      waves: waves, lastDistributed: d.lastDistributed

  }).sort(function (a, b) { return tms_(b.lastDistributed) - tms_(a.lastDistributed); });
  var reasons = {};
  A.resp.forEach(function (r) { if (r.type === 'Not Interested') { var k = str_(r.passReason) || 'Other'; reasons[k] = (reasons[k] || 0) + 1; } });
  var tot = function (k) { return rows.reduce(function (t, r) { return t + r[k]; }, 0); };
  return toClient_({
    deals: rows,
    totals: { received: tot('received'), responded: tot('responded'), interested: tot('interested'), offers: tot('offers'), passes: tot('passTotal'), responseRate: pct_(tot('responded'), tot('received')) },
    passReasons: PASS_REASONS.map(function (k) { return { reason: k, count: reasons[k] || 0 }; }),
    note: 'Opens and clicks are not tracked: the app is private to your Google account, so it cannot host the public tracking link those require. Received, responded, interested, offers and passes are exact.'
  });
}

/** One buyer's full picture: heat, closing performance and every deal sent + how they responded. */
function getInvestorProfile(investorId) {
  requireRole_('Viewer');

  if (!inv) throw new Error('Buyer not found.');
  var deals = {};
  A.deals.forEach(function (d) { deals[d.id] = d; });
  var hist = {};
  var row = function (id) { return hist[id] || (hist[id] = { dealId: id, property: deals[id] ? dealTitle_(deals[id]) : id, sentAt: '', responses: [], offers: [], outcome: '' }); };
  A.log.forEach(function (l) { if (l.investorId === investorId && l.mode === 'LIVE' && l.status === 'Sent') row(l.dealId).sentAt = l.sentAt; });
  A.resp.forEach(function (r) { if (r.investorId === investorId && r.dealId) row(r.dealId).responses.push({ type: r.type, received: r.received, passReason: r.passReason, offerAmount: r.offerAmount }); });
  A.offers.forEach(function (o) { if (o.investorId === investorId) row(o.dealId).offers.push({ amount: o.amount, status: o.status, received: o.received }); });
  Object.keys(hist).forEach(function (id) {
    var d = deals[id], h = hist[id];

  var rows = names.map(function (m) {

    var buyers = active.filter(function (i) { return list_(i.markets).some(function (x) { return lc_(x) === lm || lc_(x).indexOf(lm) > -1 || lm.indexOf(lc_(x)) > -1; }) || lc_(i.purchases).indexOf(lm) > -1; });
    var deals = A.deals.filter(function (d) { return lc_(marketOf_(d)) === lm || lc_(d.city) === lm; }).map(function (d) { var c = cleanDealRow_(d); c._raw = d; return c; });
    var closed = deals.filter(function (d) { return d.stage === 'Closed'; });
    var fees = closed.map(function (d) { return dealFee_(d._raw); }).filter(function (x) { return x > 0; });
    var land = buyers.filter(function (i) { return /develop|builder/i.test(i.categories) || /land|lot/i.test(i.propertyTypes); });
    return {
      market: m, buyers: buyers.length, landBuyers: land.length, verified: buyers.filter(function (i) { return pofStatus_(i) === 'Verified'; }).length,
      activeDeals: deals.filter(function (d) { return d.status === 'Available'; }).length, underContract: deals.filter(function (d) { return d.stageIndex >= 5 && d.stageIndex <= 8; }).length,
      closed: closed.length, revenue: fees.reduce(function (t, x) { return t + x; }, 0), avgFee: fees.length ? Math.round(avg_(fees)) : null,
      topBuyers: buyers.map(function (i) { return { id: i.id, name: investorName_(i), heat: stats[i.id].heat }; }).sort(function (a, b) { return b.heat - a.heat; }).slice(0, 5)
    };
  });
  return toClient_({ markets: rows });
}

/** Builders, developers and land buyers, ranked by land purchases — and who's buying where. */
function getLandBuyers() {
  requireRole_('Viewer');
  var A = loadAll_(), stats = buyerStats_(A);
  var landClosed = {};
  A.deals.forEach(function (d) { if (isLandDeal_(d) && cleanDealRow_(d).stage === 'Closed' && d.buyerInvestorId) landClosed[d.buyerInvestorId] = (landClosed[d.buyerInvestorId] || 0) + 1; });
  var activity = {};
  var buyers = A.invs.filter(function (i) { return str_(i.status) !== 'Inactive'; }).map(function (inv) {
    var entries = String(inv.purchases || '').split(/;\s*/).filter(function (x) { return /\blots?\b|\bland\b|acre|vacant|parcel|· land/i.test(x); });
    var cities = {};
    entries.forEach(function (e) { var m = e.match(/,\s*([^,—]+?)\s*—/); var c = m ? titleCase_(m[1]) : ''; if (c) { cities[c] = (cities[c] || 0) + 1; (activity[c] = activity[c] || {})[inv.id] = ((activity[c] || {})[inv.id] || 0) + 1; } });
    var isDev = /develop|builder|construction/i.test(inv.categories) || /land|lot/i.test(inv.propertyTypes);
    var landBuys = entries.length + (landClosed[inv.id] || 0);
    return { id: inv.id, name: investorName_(inv), company: str_(inv.company), email: str_(inv.email), status: str_(inv.status), tier: str_(inv.tier), categories: str_(inv.categories),
      markets: str_(inv.markets), acres: (inv.minAcres || inv.maxAcres) ? (Number(inv.minAcres) || 0) + '–' + (Number(inv.maxAcres) || 'any') + ' ac' : '', landBuys: landBuys,
      boughtFromUs: landClosed[inv.id] || 0, cities: cities, heat: stats[inv.id].heat, isDev: isDev };
  }).filter(function (b) { return b.isDev || b.landBuys > 0; }).sort(function (a, b) { return b.landBuys - a.landBuys || b.heat - a.heat; });
  var byId = {};
  buyers.forEach(function (b) { byId[b.id] = b; });
  var builderActivity = Object.keys(activity).map(function (city) {
    var list = Object.keys(activity[city]).map(function (id) { return { id: id, name: byId[id] ? byId[id].name : id, lots: activity[city][id] }; }).sort(function (a, b) { return b.lots - a.lots; });
    return { market: city, lots: list.reduce(function (t, x) { return t + x.lots; }, 0), builders: list };
  }).sort(function (a, b) { return b.lots - a.lots; });
  return toClient_({ buyers: buyers, builderActivity: builderActivity });
}

// ---- Auth.gs ----
/**
 * Auth.gs — team permission controls.
 *
 * Roles
 *   Owner  — everything, including Settings, going live, the DealMachine key, schedules, deleting buyers
 *   Rep    — day-to-day work: deals, buyers, distributions, offers, verification, follow-ups
 *   Viewer — read-only (dashboards, reports, pipeline)
 *
 * Single-user mode (TEAM_MEMBERS blank): the account that deployed the app is the Owner.
 * Team mode: list members in Settings → Team ("email: Role"). The deploying account is always Owner.
 * People must be identifiable: deploy the web app with "Who has access: Anyone within <your
 * Google Workspace domain>" (Google only reveals a visitor's email to apps in the same Workspace).
 * Background jobs (triggers) are not affected by roles.
 */

var ROLE_RANK = { Viewer: 1, Rep: 2, Owner: 3 };

function teamMembers_() {
  var out = {};
  String(getSettings_().TEAM_MEMBERS || '').split(/[\n;]+/).forEach(function (line) {
    var m = line.match(/([^\s:,<>]+@[^\s:,<>]+)\s*[:,\-]?\s*(owner|rep|viewer)?/i);
    if (!m) return;
    var role = m[2] ? m[2].charAt(0).toUpperCase() + m[2].slice(1).toLowerCase() : 'Rep';
    out[m[1].toLowerCase()] = role;
  });
  return out;
}

function ownerEmail_() {
  try { return lc_(Session.getEffectiveUser().getEmail()); } catch (e) { return ''; }
}

/** The signed-in person's role, or '' if they aren't allowed in. */
function role_() {
  var team = teamMembers_();
  var me = '';
  try { me = lc_(Session.getActiveUser().getEmail()); } catch (e) { me = ''; }
  if (!Object.keys(team).length) return 'Owner'; // single-user mode
  if (me && me === ownerEmail_()) return 'Owner';
  if (!me) return '';
  return team[me] || '';
}

function requireRole_(min) {
  var r = role_();
  if (!r) throw new Error('Your Google account isn\'t on the SameDayInvestments team. Ask the owner to add you in Settings → Team.');
  if (ROLE_RANK[r] < ROLE_RANK[min]) throw new Error('Your role (' + r + ') can\'t do this — it needs ' + min + ' access.');
  return r;
}

/** Who am I? (shown in the sidebar) */
function whoAmI() {
  var me = '';
  try { me = lc_(Session.getActiveUser().getEmail()); } catch (e) { me = ''; }
  return { email: me || currentUser_(), role: role_(), teamMode: Object.keys(teamMembers_()).length > 0 };
}

function getDashboard() {
  requireRole_('Viewer');
  var investors = readTable_(SHEET.INVESTORS).rows;
  var deals = readTable_(SHEET.DEALS).rows;
  var jobs = readTable_(SHEET.JOBS).rows;
  var log = readTable_(SHEET.LOG).rows;
  var responses = readTable_(SHEET.RESPONSES).rows;
  var since = Date.now() - 30 * 24 * 3600 * 1000;
  var t = function (d) { var x = d instanceof Date ? d : new Date(d); return isNaN(x.getTime()) ? 0 : x.getTime(); };
  var dealCounts = { Available: 0, Pending: 0, Sold: 0 };
  deals.forEach(function (d) { var s = str_(d.status) || 'Available'; dealCounts[s] = (dealCounts[s] || 0) + 1; });
  var activity = [];
  jobs.slice(-8).forEach(function (j) {
    activity.push({ when: j.created, kind: 'distribution', text: (j.mode === 'TEST' ? 'Test distribution' : 'Distributed') + ' ' + j.property + ' → ' + j.total + ' investors', status: j.status });
  });
  responses.slice(-10).forEach(function (r) {
    activity.push({ when: r.received, kind: 'response', text: r.investorName + ' — ' + r.type + (r.property ? ' on ' + r.property : ''), status: r.followUp });
  });
  activity.sort(function (a, b) { return t(b.when) - t(a.when); });
  return toClient_({
    investors: {
      total: investors.length,
      active: investors.filter(function (i) { return (str_(i.status) || 'Active') === 'Active' && !bool_(i.optOut); }).length,
      optedOut: investors.filter(function (i) { return bool_(i.optOut); }).length,
      pending: investors.filter(function (i) { return str_(i.status) === PENDING_REVIEW; }).length
    },
    deals: dealCounts,
    emails30d: log.filter(function (l) { return l.mode === 'LIVE' && l.status === 'Sent' && t(l.sentAt) > since; }).length,
    responses30d: responses.filter(function (r) { return t(r.received) > since; }).length,
    interested30d: responses.filter(function (r) { return (r.type === 'Interested' || r.type === 'Offer') && t(r.received) > since; }).length,
    queued: log.filter(function (l) { return l.status === 'Queued'; }).length,
    activity: activity.slice(0, 12),
    testMode: isTestMode_(),
    quota: remainingQuota_(),
    lastScan: getSettings_().LAST_INBOX_SCAN || ''
  });
}

// ---- Data.gs ----
/**
 * Data.gs — thin data-access layer over Google Sheets.
 * Rows are converted to plain objects using the FIELD MAPs in Config.gs.
 */

var _ss = null;
var _headerChecked = {};

/** Returns the database spreadsheet (container-bound, or the one linked during setup). */
function ss_() {
  if (_ss) return _ss;
  var props = PropertiesService.getScriptProperties();
  var id = props.getProperty('SPREADSHEET_ID');
  if (id) {
    _ss = SpreadsheetApp.openById(id);
    return _ss;
  }
  var active = null;
  try { active = SpreadsheetApp.getActiveSpreadsheet(); } catch (e) { active = null; }
  if (active) {
    props.setProperty('SPREADSHEET_ID', active.getId());
    _ss = active;
    return _ss;
  }
  throw new Error('No database spreadsheet is linked. Open the Google Sheet, go to Extensions → Apps Script and run setup().');
}

/** Gets a sheet by name, creating it (with headers) if needed. */
function getSheet_(name) {
  var ss = ss_();
  var sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name);
  if (SCHEMAS[name]) ensureHeaders_(sh, name);
  return sh;
}

function ensureHeaders_(sh, name) {
  if (_headerChecked[name]) return;
  var wanted = values_(SCHEMAS[name]);
  var lastCol = sh.getLastColumn();
  var existing = lastCol ? sh.getRange(1, 1, 1, lastCol).getValues()[0].map(String) : [];
  var hasAny = existing.some(function (h) { return h !== ''; });
  if (!hasAny) {
    sh.getRange(1, 1, 1, wanted.length).setValues([wanted]);
    formatSheet_(sh, name, wanted);
  } else {
    var missing = wanted.filter(function (h) { return existing.indexOf(h) === -1; });
    if (missing.length) {
      sh.getRange(1, existing.length + 1, 1, missing.length).setValues([missing]);
      formatSheet_(sh, name, existing.concat(missing));
    }
  }
  _headerChecked[name] = true;
}

function formatSheet_(sh, name, headers) {
  sh.setFrozenRows(1);
  sh.getRange(1, 1, 1, headers.length)
    .setFontWeight('bold')
    .setFontColor('#E8F2EC')
    .setBackground('#0B2E21');
  var textCols = TEXT_COLUMNS[name] || [];
  textCols.forEach(function (h) {
    var idx = headers.indexOf(h);
    if (idx > -1) sh.getRange(2, idx + 1, Math.max(sh.getMaxRows() - 1, 1), 1).setNumberFormat('@');
  });
}

function values_(obj) {
  return Object.keys(obj).map(function (k) { return obj[k]; });
}

function headersOf_(name) {
  var sh = getSheet_(name);
  var lastCol = sh.getLastColumn();
  return { sheet: sh, headers: sh.getRange(1, 1, 1, lastCol).getValues()[0].map(String) };
}

/**
 * Reads a whole sheet. Returns { sheet, headers, rows } where every row is an
 * object keyed by the entity's client keys, plus _row (1-based sheet row).
 */
function readTable_(name) {
  var t = headersOf_(name);
  var map = SCHEMAS[name];
  var lastRow = t.sheet.getLastRow();
  var rows = [];
  if (lastRow >= 2) {
    var data = t.sheet.getRange(2, 1, lastRow - 1, t.headers.length).getValues();
    var idx = {};
    Object.keys(map).forEach(function (k) { idx[k] = t.headers.indexOf(map[k]); });
    for (var r = 0; r < data.length; r++) {
      var row = data[r];
      if (row.every(function (c) { return c === '' || c === null; })) continue;
      var o = { _row: r + 2 };
      Object.keys(map).forEach(function (k) { o[k] = idx[k] > -1 ? row[idx[k]] : ''; });
      rows.push(o);
    }
  }
  return { sheet: t.sheet, headers: t.headers, rows: rows, raw: null };
}

/** Converts an object with client keys to a row array in sheet header order. */
function toRowArray_(name, headers, obj, baseRow) {
  var map = SCHEMAS[name];
  var reverse = {};
  Object.keys(map).forEach(function (k) { reverse[map[k]] = k; });
  return headers.map(function (h, i) {
    var key = reverse[h];
    if (key && Object.prototype.hasOwnProperty.call(obj, key)) return cellValue_(obj[key]);
    return baseRow ? cellValue_(baseRow[i]) : '';
  });
}

function appendObjects_(name, objs) {
  if (!objs || !objs.length) return;
  var t = headersOf_(name);
  var data = objs.map(function (o) { return toRowArray_(name, t.headers, o, null); });
  var start = t.sheet.getLastRow() + 1;
  t.sheet.getRange(start, 1, data.length, t.headers.length).setValues(data);
  return start;
}

function updateObject_(name, rowNum, fields) {
  var t = headersOf_(name);
  var range = t.sheet.getRange(rowNum, 1, 1, t.headers.length);
  var current = range.getValues()[0];
  range.setValues([toRowArray_(name, t.headers, fields, current)]);
}

/** Writes one column (by client key) for a contiguous block of rows. */
function writeColumn_(name, key, startRow, values) {
  if (!values.length) return;
  var t = headersOf_(name);
  var col = t.headers.indexOf(SCHEMAS[name][key]);
  if (col < 0) return;
  t.sheet.getRange(startRow, col + 1, values.length, 1)
    .setValues(values.map(function (v) { return [cellValue_(v)]; }));
}

function findBy_(name, key, value) {
  var rows = readTable_(name).rows;
  var want = String(value).trim().toLowerCase();
  for (var i = 0; i < rows.length; i++) {
    if (String(rows[i][key]).trim().toLowerCase() === want) return rows[i];
  }
  return null;
}

/** Sanitizes a value before writing it to a cell (prevents formula injection, keeps leading zeros). */
function cellValue_(v) {
  if (v === null || v === undefined) return '';
  if (v instanceof Date || typeof v === 'number' || typeof v === 'boolean') return v;
  var s = String(v);
  if (/^[=+\-@]/.test(s) || /^0\d+$/.test(s)) return "'" + s;
  return s;
}

/** Converts values to something google.script.run can return (no Date objects). */
function toClient_(o) {
  if (o === null || o === undefined) return o;
  if (o instanceof Date) return isNaN(o.getTime()) ? '' : o.toISOString();
  if (Array.isArray(o)) return o.map(toClient_);
  if (typeof o === 'object') {
    var out = {};
    Object.keys(o).forEach(function (k) { out[k] = toClient_(o[k]); });
    return out;
  }
  return o;
}

// ---------- small utilities ----------

function num_(v) {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number') return v;
  var s = String(v).replace(/[$,\s]/g, '');
  var m = s.match(/^(-?\d*\.?\d+)([kKmM]?)$/);
  if (!m) return '';
  var n = parseFloat(m[1]);
  if (/k/i.test(m[2])) n *= 1000;
  if (/m/i.test(m[2])) n *= 1000000;
  return n;
}

/** Date (with time) from a Date or date string; null if empty/invalid. */
function asDate_(v) {
  if (!v) return null;
  if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
  var d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

function bool_(v) {
  if (typeof v === 'boolean') return v;
  return /^(true|yes|y|1|x|on)$/i.test(String(v).trim());
}

function list_(v) {
  if (Array.isArray(v)) return v.map(function (s) { return String(s).trim(); }).filter(String);
  return String(v || '').split(/[,;|\n]/).map(function (s) { return s.trim(); }).filter(String);
}

function joinList_(v) {
  return list_(v).join(', ');
}

function isEmail_(e) {
  return /^[^\s@<>(),;:"]+@[^\s@<>(),;:"]+\.[^\s@<>(),;:"]{2,}$/.test(String(e || '').trim());
}

function str_(v) {
  return v === null || v === undefined ? '' : String(v).trim();
}

function pad_(n, width) {
  var s = String(n);
  while (s.length < width) s = '0' + s;
  return s;
}

function tz_() {
  return Session.getScriptTimeZone() || 'America/New_York';
}

function fmtDate_(d, pattern) {
  if (!d) return '';
  var date = d instanceof Date ? d : new Date(d);
  if (isNaN(date.getTime())) return String(d);
  return Utilities.formatDate(date, tz_(), pattern || 'yyyy-MM-dd');
}

/**
 * Sequential, human-friendly IDs (INV-00001, SDI-2026-0001).
 * Callers must already hold the script lock (see withLock_).
 */
function nextId_(counterKey, prefix, width) {
  var props = PropertiesService.getScriptProperties();
  var n = parseInt(props.getProperty(counterKey) || '0', 10) + 1;
  props.setProperty(counterKey, String(n));
  return prefix + pad_(n, width);
}

function shortId_(prefix) {
  return prefix + Utilities.getUuid().replace(/-/g, '').slice(0, 10).toUpperCase();
}

function currentUser_() {
  var e = '';
  try { e = Session.getActiveUser().getEmail(); } catch (err) { e = ''; }
  if (!e) { try { e = Session.getEffectiveUser().getEmail(); } catch (err2) { e = ''; } }
  return e;
}

var _lockDepth = 0;
var _lock = null;

/** Runs fn while holding the script lock. Re-entrant within one execution. */
function withLock_(fn) {
  if (_lockDepth > 0) {
    _lockDepth++;
    try { return fn(); } finally { _lockDepth--; }
  }
  _lock = LockService.getScriptLock();
  _lock.waitLock(30000);
  _lockDepth = 1;
  try { return fn(); } finally { _lockDepth = 0; _lock.releaseLock(); }
}

// ---- Deals.gs ----
/**
 * Deals.gs — deal submission, media (photos / video) and status management.
 */

var MAX_PHOTOS = 30;

function dealTitle_(d) {
  var parts = [str_(d.address), str_(d.city)].filter(String);
  var s = parts.join(', ');
  if (str_(d.state)) s += (s ? ', ' : '') + str_(d.state);
  return s || str_(d.id);
}

function photoIds_(d) {
  return list_(d.photoIds);
}

function dealMetrics_(d) {
  var price = Number(d.askingPrice) || 0;
  var arv = Number(d.arv) || 0;
  var repairs = Number(d.repairs) || 0;
  var sqft = Number(d.sqft) || 0;
  var allIn = price + repairs;
  return {
    allIn: price ? allIn : '',
    spread: arv && price ? arv - allIn : '',
    allInPctArv: arv && price ? Math.round((allIn / arv) * 1000) / 10 : '',
    pricePerSqft: price && sqft ? Math.round(price / sqft) : '',
    arvPerSqft: arv && sqft ? Math.round(arv / sqft) : ''
  };
}

function cleanDealRow_(r) {
  var o = toClient_(r);
  o.photoIds = photoIds_(r);
  o.showAssignment = bool_(r.showAssignment);
  o.showAccess = r.showAccess === '' ? true : bool_(r.showAccess);
  o.status = str_(r.status) || 'Available';
  o.timesDistributed = Number(r.timesDistributed) || 0;
  o.totalRecipients = Number(r.totalRecipients) || 0;
  o.responses = Number(r.responses) || 0;
  o.interested = Number(r.interested) || 0;
  o.title = dealTitle_(r);
  o.metrics = dealMetrics_(r);
  o.closingDate = r.closingDate instanceof Date ? fmtDate_(r.closingDate) : str_(r.closingDate);
  o.offerDeadline = r.offerDeadline instanceof Date ? fmtDate_(r.offerDeadline, "yyyy-MM-dd'T'HH:mm") : str_(r.offerDeadline);
  o.stage = stageOf_(r);
  o.stageIndex = PIPELINE_STAGES.indexOf(o.stage);
  var since = parseDateLoose_(r.stageUpdated) || parseDateLoose_(r.updated) || parseDateLoose_(r.created);
  o.daysInStage = since ? Math.floor((Date.now() - since.getTime()) / 86400000) : 0;
  o.stuck = ['Closed', 'Dead Deal'].indexOf(o.stage) === -1 && o.daysInStage >= (parseInt(getSettings_().FU_STUCK_DAYS, 10) || 7);
  o.acresNum = dealAcres_(r);
  o.priceReduced = !!(Number(r.previousPrice) && Number(r.previousPrice) > Number(r.askingPrice));
  o.isLand = isLandDeal_(r);
  return o;
}

/** The deal's pipeline stage (derived for deals created before the pipeline existed). */
function stageOf_(d) {
  var st = str_(d.stage);
  if (PIPELINE_STAGES.indexOf(st) > -1) return st;
  var status = str_(d.status);
  if (status === 'Sold') return 'Closed';
  if (status === 'Dead') return 'Dead Deal';
  if (status === 'Pending') return 'Buyer Selected';
  return Number(d.timesDistributed) > 0 ? 'Distributed' : 'Ready for Disposition';
}

function statusForStage_(stage) {
  var p = PIPELINE.filter(function (x) { return x.stage === stage; })[0];
  return p ? p.status : 'Available';
}

/** Moves a deal forward to `stage` only if it's currently at an earlier (active) stage. Caller holds the lock. */
function advanceStage_(dealId, stage) {
  var d = findBy_(SHEET.DEALS, 'id', dealId);
  if (!d) return;
  var cur = stageOf_(d);
  if (['Closed', 'Dead Deal'].indexOf(cur) > -1) return;
  if (PIPELINE_STAGES.indexOf(stage) <= PIPELINE_STAGES.indexOf(cur)) return;
  updateObject_(SHEET.DEALS, d._row, { stage: stage, stageUpdated: new Date(), status: statusForStage_(stage), updated: new Date() });
}

function getDealRow_(dealId) {
  var d = findBy_(SHEET.DEALS, 'id', dealId);
  if (!d) throw new Error('Deal ' + dealId + ' not found.');
  return d;
}

function normalizeDeal_(deal) {
  var closing = str_(deal.closingDate);
  if (closing && !/^\d{4}-\d{2}-\d{2}$/.test(closing)) throw new Error('Closing date must be a valid date.');
  var video = str_(deal.videoUrl);
  if (video && !/^https?:\/\//i.test(video)) throw new Error('Video link must start with http:// or https://');
  return {
    address: str_(deal.address),
    city: str_(deal.city),
    state: str_(deal.state).toUpperCase(),
    zip: str_(deal.zip),
    market: str_(deal.market),
    propertyType: str_(deal.propertyType),
    askingPrice: num_(deal.askingPrice),
    assignmentPrice: num_(deal.assignmentPrice),
    showAssignment: bool_(deal.showAssignment),
    arv: num_(deal.arv),
    repairs: num_(deal.repairs),
    sqft: num_(deal.sqft),
    beds: num_(deal.beds),
    baths: num_(deal.baths),
    lotSize: str_(deal.lotSize),
    yearBuilt: num_(deal.yearBuilt),
    description: str_(deal.description),
    closingDate: closing,
    access: str_(deal.access),
    showAccess: deal.showAccess === undefined ? true : bool_(deal.showAccess),
    videoUrl: str_(deal.videoUrl),
    internalNotes: str_(deal.internalNotes),
    acres: num_(deal.acres),
    parcelId: str_(deal.parcelId),
    zoning: str_(deal.zoning),
    contractPrice: num_(deal.contractPrice),
    offerDeadline: str_(deal.offerDeadline).replace('T', ' '),
    rep: str_(deal.rep),
    roadFrontage: num_(deal.roadFrontage),
    utilities: str_(deal.utilities),
    floodZone: str_(deal.floodZone),
    wetlands: str_(deal.wetlands),
    soilSeptic: str_(deal.soilSeptic),
    roadAccess: str_(deal.roadAccess),
    potentialLots: num_(deal.potentialLots),
    density: str_(deal.density),
    zoningNotes: str_(deal.zoningNotes)
  };
}

// ---------- Drive media ----------

function rootFolder_() {
  var s = getSettings_();
  if (s.DRIVE_FOLDER_ID) {
    try { return DriveApp.getFolderById(s.DRIVE_FOLDER_ID); } catch (e) { /* recreate below */ }
  }
  var folder = DriveApp.createFolder(APP_NAME + ' — Deal Media');
  setSetting_('DRIVE_FOLDER_ID', folder.getId());
  return folder;
}

function dealFolder_(deal) {
  if (deal.folderId) {
    try { return DriveApp.getFolderById(deal.folderId); } catch (e) { /* recreate */ }
  }
  var folder = rootFolder_().createFolder(deal.id + ' — ' + dealTitle_(deal));
  if (bool_(getSettings_().SHARE_MEDIA_LINKS)) shareByLink_(folder);
  updateObject_(SHEET.DEALS, deal._row, { folderId: folder.getId() });
  deal.folderId = folder.getId();
  return folder;
}

function shareByLink_(item) {
  try {
    item.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
    return true;
  } catch (e) {
    // Some Google Workspace domains block link sharing; the email still embeds photos.
    return false;
  }
}

function blobFromBase64_(base64, mimeType, fileName) {
  var data = String(base64 || '');
  var comma = data.indexOf(',');
  if (data.indexOf('data:') === 0 && comma > -1) data = data.slice(comma + 1);
  return Utilities.newBlob(Utilities.base64Decode(data), mimeType || 'application/octet-stream', fileName || 'file');
}

function listDeals() {
  requireRole_('Viewer');
  return readTable_(SHEET.DEALS).rows.map(cleanDealRow_).reverse();
}

function getDeal(dealId) {
  requireRole_('Viewer');
  return cleanDealRow_(getDealRow_(dealId));
}

/** Creates or updates a deal. Returns the saved deal. */
function saveDeal(deal) {
  requireRole_('Rep');
  return withLock_(function () {
    deal = deal || {};
    var data = normalizeDeal_(deal);
    if (!data.address) throw new Error('Property address is required.');
    if (!data.askingPrice) throw new Error('Asking / purchase price is required.');
    data.updated = new Date();
    if (deal.id) {
      var existing = getDealRow_(deal.id);
      // price reduction → remember the old price so buyers can be alerted
      if (Number(existing.askingPrice) && Number(data.askingPrice) && Number(data.askingPrice) < Number(existing.askingPrice)) {
        data.previousPrice = Number(existing.askingPrice);
        data.priceReducedOn = new Date();
      }
      updateObject_(SHEET.DEALS, existing._row, data);
      data.id = deal.id;
    } else {
      data.id = nextId_('DEAL_SEQ_' + new Date().getFullYear(), 'SDI-' + new Date().getFullYear() + '-', 4);
      data.status = 'Available';
      data.stage = 'Ready for Disposition';
      data.stageUpdated = new Date();
      data.created = new Date();
      data.timesDistributed = 0;
      data.totalRecipients = 0;
      data.responses = 0;
      data.interested = 0;
      data.photoIds = '';
      appendObjects_(SHEET.DEALS, [data]);
    }
    return getDeal(data.id);
  });
}

/** Marks a deal Available / Pending / Sold. extra: { buyer, soldPrice } */
function setDealStatus(dealId, status, extra) {
  requireRole_('Rep');
  if (DEAL_STATUSES.indexOf(status) === -1) throw new Error('Unknown status ' + status);
  return withLock_(function () {
    var d = getDealRow_(dealId);
    var f = { status: status, updated: new Date() };
    extra = extra || {};
    if (status === 'Sold') {
      f.soldDate = new Date();
      if (extra.buyer !== undefined) f.buyer = str_(extra.buyer);
      if (extra.soldPrice !== undefined) f.soldPrice = num_(extra.soldPrice);
    } else if (status === 'Pending') {
      if (extra.buyer !== undefined) f.buyer = str_(extra.buyer);
    } else {
      f.soldDate = '';
    }
    var cur = stageOf_(d);
    var target = { Sold: 'Closed', Dead: 'Dead Deal', Pending: PIPELINE_STAGES.indexOf(cur) >= 5 && PIPELINE_STAGES.indexOf(cur) <= 8 ? cur : 'Buyer Selected' }[status];
    if (status === 'Available') target = PIPELINE_STAGES.indexOf(cur) <= 4 ? cur : (Number(d.timesDistributed) > 0 ? 'Negotiating' : 'Ready for Disposition');
    if (target !== cur) { f.stage = target; f.stageUpdated = new Date(); }
    updateObject_(SHEET.DEALS, d._row, f);
    return getDeal(dealId);
  });
}

/**
 * Sets the pipeline stage. extra: { buyerInvestorId, buyer, soldPrice, emdAmount, closingDate }
 * Closed records a completed transaction for the buyer; Dead Deal stops distribution.
 */
function setDealStage(dealId, stage, extra) {
  requireRole_('Rep');
  if (PIPELINE_STAGES.indexOf(stage) === -1) throw new Error('Unknown stage ' + stage);
  extra = extra || {};
  return withLock_(function () {
    var d = getDealRow_(dealId);
    var f = { stage: stage, stageUpdated: new Date(), status: statusForStage_(stage), updated: new Date() };
    if (extra.buyerInvestorId !== undefined) {
      f.buyerInvestorId = str_(extra.buyerInvestorId);
      var inv = f.buyerInvestorId ? findBy_(SHEET.INVESTORS, 'id', f.buyerInvestorId) : null;
      if (inv) f.buyer = investorName_(inv) + (inv.company && investorName_(inv) !== inv.company ? ' (' + inv.company + ')' : '');
    }
    if (extra.buyer !== undefined && !f.buyer) f.buyer = str_(extra.buyer);
    if (extra.emdAmount !== undefined) f.emdAmount = num_(extra.emdAmount);
    if (extra.closingDate) f.closingDate = str_(extra.closingDate);
    if (stage === 'Assignment Signed' && !d.assignmentSigned) f.assignmentSigned = new Date();
    if (PIPELINE_STAGES.indexOf(stage) >= 5 && PIPELINE_STAGES.indexOf(stage) <= 9 && !d.buyerSelectedOn) f.buyerSelectedOn = new Date();
    if (stage === 'EMD Received' && !d.emdReceived) f.emdReceived = new Date();
    if (stage === 'Closed') {
      f.soldDate = new Date();
      if (extra.soldPrice !== undefined) f.soldPrice = num_(extra.soldPrice);
      var buyerId = f.buyerInvestorId || str_(d.buyerInvestorId);
      if (buyerId && stageOf_(d) !== 'Closed') {
        recordBuyerOutcome_(buyerId, 'closed', dealId);
        readTable_(SHEET.OFFERS).rows.forEach(function (o) {
          if (o.dealId === dealId && o.investorId === buyerId && ['Accepted', 'Under Contract'].indexOf(o.status) > -1) {
            updateObject_(SHEET.OFFERS, o._row, { status: 'Closed', updated: new Date() });
            if (!f.soldPrice && !d.soldPrice) f.soldPrice = num_(o.amount);
          }
        });
      }
    }
    updateObject_(SHEET.DEALS, d._row, f);
    return getDeal(dealId);
  });
}

/** Board data: every deal with stage, days in stage, offers and the selected buyer. */
function getPipeline() {
  requireRole_('Viewer');
  var offers = {};
  readTable_(SHEET.OFFERS).rows.forEach(function (o) {
    var x = offers[o.dealId] || (offers[o.dealId] = { count: 0, best: 0, active: 0 });
    x.count++;
    if (['Rejected', 'Withdrawn', 'Fell Through'].indexOf(o.status) === -1) { x.active++; x.best = Math.max(x.best, Number(o.amount) || 0); }
  });
  return {
    stages: PIPELINE,
    deals: listDeals().map(function (d) { d.offers = offers[d.id] || { count: 0, best: 0, active: 0 }; return d; })
  };
}
