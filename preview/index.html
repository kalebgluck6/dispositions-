}

// ---------- Source 2: Google Sheet sync ----------

function leadFromRow_(row, mapping) {
  var get = function (f) { return mapping[f] === undefined || mapping[f] === null || mapping[f] === '' ? '' : str_(row[Number(mapping[f])]); };
  var email = get('email').toLowerCase().replace(/^mailto:/, '');
  if (/[,;]/.test(email)) email = email.split(/[,;]/)[0].trim();
  var first = get('firstName'), last = get('lastName');
  if (!first && !last && get('fullName')) {
    var parts = get('fullName').split(/\s+/);
    first = parts.shift();
    last = parts.join(' ');
  }
  return {
    firstName: titleCase_(first), lastName: titleCase_(last), company: get('company'), email: email, phone: get('phone'),
    tier: get('tier'), categories: get('categories'), markets: get('markets'), propertyTypes: get('propertyTypes'),
    minPrice: num_(get('minPrice')), maxPrice: num_(get('maxPrice')), criteria: get('criteria'), notes: get('notes')
  };
}

function sheetLeads_(ctx) {
  var s = getSettings_();
  if (!str_(s.INTAKE_SHEET_URL)) return 'No buyer sheet linked yet.';
  var src = openImportSource_(s.INTAKE_SHEET_URL, str_(s.INTAKE_SHEET_TAB));
  var values = src.sheet.getDataRange().getDisplayValues();
  if (values.length < 2) return 'The buyer sheet is empty.';
  var h = findHeaderRow_(values);
  var mapping = autoMap_(values[h]);
  if (mapping.email === undefined) throw new Error('No Email column found in "' + src.sheet.getName() + '".');
  values.slice(h + 1).forEach(function (row, i) {
    if (!row.some(function (c) { return str_(c) !== ''; })) return;
    var lead = leadFromRow_(row, mapping);
    var ref = 'SHEET:' + (lead.email || normKey_(investorName_(lead) + lead.phone) || ('row' + (h + 2 + i)));
    addLead_(ctx, INTAKE_SOURCES.sheet.label, lead, ref, src.sheet.getName() + ' row ' + (h + 2 + i));
  });
  return '';
}

// ---------- Source 3: cash buyers from a public-records export ----------

var CASH_FIELDS = [
  ['ownerFirst', ['owner 1 first name', 'owner first name', 'owner first', 'first name']],
  ['ownerLast', ['owner 1 last name', 'owner last name', 'owner last', 'last name']],
  ['ownerName', ['owner 1 full name', 'owner full name', 'owner name', 'owner names', 'owner(s)', 'owner 1 name', 'owner', 'buyer name', 'grantee name', 'grantee', 'full name', 'name']],
  ['email', ['email', 'email 1', 'email1', 'email address', 'owner email', 'primary email', 'email address 1']],
  ['phone', ['mobile', 'mobile 1', 'mobile phone', 'wireless 1', 'cell', 'cell phone', 'phone', 'phone 1', 'phone1', 'phone number', 'owner phone', 'primary phone']],
  ['mailAddr', ['mailing address', 'mail address', 'mailing street', 'mailing street address', 'owner mailing address', 'mail street address', 'owner address']],
  ['mailCity', ['mailing city', 'mail city']],
  ['mailState', ['mailing state', 'mail state']],
  ['mailZip', ['mailing zip', 'mailing zip code', 'mail zip', 'mail zip code']],
  ['propAddr', ['property address', 'address', 'street address', 'site address', 'situs address', 'property street']],
  ['propCity', ['property city', 'city', 'site city', 'situs city']],
  ['propState', ['property state', 'state', 'site state']],
  ['propZip', ['property zip', 'zip', 'zip code', 'site zip', 'postal code']],
  ['saleDate', ['last sale date', 'last sale recording date', 'sale date', 'recording date', 'purchase date', 'sold date', 'last sold date', 'transfer date']],
  ['salePrice', ['last sale amount', 'last sale price', 'sale price', 'sale amount', 'purchase price', 'sold price', 'last sold price', 'transfer amount']],
  ['propType', ['property type', 'land use', 'property use', 'use code', 'property class', 'type']],
  ['cashFlag', ['cash buyer', 'cash purchase', 'cash sale', 'purchase method', 'financing', 'last sale type', 'loan type', 'buyer type']],
  ['mortgage', ['open mortgage balance', 'est. mortgage balance', 'estimated mortgage balance', 'mortgage balance', 'total open loans', 'mortgage amount', 'first mortgage amount', 'loan amount', 'est. open loans']]
];

function cashMap_(headers) {
  var norm = headers.map(function (x) { return lc_(x).replace(/[_*#:]/g, ' ').replace(/\s+/g, ' ').trim(); });
  var map = {}, used = {};
  [true, false].forEach(function (exact) {
    CASH_FIELDS.forEach(function (fd) {
      if (map[fd[0]] !== undefined) return;
      for (var i = 0; i < norm.length; i++) {
        if (used[i] || !norm[i]) continue;
        var hit = fd[1].some(function (syn) { return exact ? norm[i] === syn : (syn.length > 5 && norm[i].indexOf(syn) > -1); });
        if (hit) { map[fd[0]] = i; used[i] = true; break; }
      }
    });
  });
  return map;
}

var ENTITY_RE = /\b(llc|l\.l\.c\.?|inc\.?|corp\.?|corporation|company|trust|trustee|holdings?|properties|investments?|capital|partners|lp|llp|ltd|group|ventures|realty|homes|estates?|fund|reit|enterprises?|solutions|series|builders?|construction|developments?|developers?|land)\b/i;

/** Turns export rows into buyer leads (one per owner), with buy boxes built from their purchases. */
function cashLeadsFrom_(values, settings) {
  if (values.length < 2) return { leads: [], mapping: {}, headers: [], rows: 0, considered: 0 };
  var h = 0;
  for (var r = 0; r < Math.min(values.length, 10); r++) {
    if (/owner|grantee|sale|address/i.test(values[r].join('|'))) { h = r; break; }
  }
  var headers = values[h].map(String);
  var mp = cashMap_(headers);
  var get = function (row, f) { return mp[f] === undefined ? '' : str_(row[mp[f]]); };
  var days = Math.max(1, parseInt(settings.INTAKE_CASH_LOOKBACK_DAYS, 10) || 365);
  var cutoff = Date.now() - days * 86400000;
  var minBuys = Math.max(1, parseInt(settings.INTAKE_CASH_MIN_PURCHASES, 10) || 1);
  var groups = {}, order = [], considered = 0;

  values.slice(h + 1).forEach(function (row) {
    if (!row.some(function (c) { return str_(c) !== ''; })) return;
    var name = get(row, 'ownerName') || (get(row, 'ownerFirst') + ' ' + get(row, 'ownerLast')).trim();
    if (!name) return;
    var date = parseDateLoose_(get(row, 'saleDate'));
    if (date && date.getTime() < cutoff) return;
    var flag = lc_(get(row, 'cashFlag'));
    if (flag) {
      var isCash = /cash|^(y|yes|true|1|x)$/.test(flag);
      if (!isCash && /mortgage|loan|conv|fha|\bva\b|financ|^(n|no|false|0)$/.test(flag)) return;
    }
    if (mp.mortgage !== undefined && Number(num_(get(row, 'mortgage'))) > 0) return;
    considered++;
    var email = lc_(get(row, 'email'));
    if (/[,;]/.test(email)) email = email.split(/[,;]/)[0].trim();
    if (!isEmail_(email)) email = '';
    var mailing = [titleCase_(get(row, 'mailAddr')), titleCase_(get(row, 'mailCity')), [get(row, 'mailState').toUpperCase(), get(row, 'mailZip')].join(' ').trim()].filter(String).join(', ');
    var key = email || (normKey_(name) + '|' + normKey_(get(row, 'mailAddr') || get(row, 'propAddr')));
    if (!groups[key]) {
      groups[key] = { name: name, email: email, phone: get(row, 'phone'), mailing: mailing || [titleCase_(get(row, 'propAddr')), titleCase_(get(row, 'propCity')), get(row, 'propState').toUpperCase()].filter(String).join(', '), buys: [] };
      order.push(key);
    }
    var g = groups[key];
    if (!g.phone) g.phone = get(row, 'phone');
    g.buys.push({
      addr: titleCase_(get(row, 'propAddr')), city: titleCase_(get(row, 'propCity')), state: get(row, 'propState').toUpperCase(),
      date: date, price: num_(get(row, 'salePrice')), type: get(row, 'propType')
    });
  });

  var leads = order.map(function (k) { return groups[k]; }).filter(function (g) { return g.buys.length >= minBuys; }).map(function (g) {
    g.buys.sort(function (a, b) { return (b.date ? b.date.getTime() : 0) - (a.date ? a.date.getTime() : 0); });
    var prices = g.buys.map(function (b) { return Number(b.price) || 0; }).filter(function (p) { return p >= 1000; });
    var cities = [], types = [];
    g.buys.forEach(function (b) {
      if (b.city && cities.indexOf(b.city) === -1) cities.push(b.city);
      var t = normalizePropType_(b.type);
      if (t && types.indexOf(t) === -1) types.push(t);
    });
    var lo = prices.length ? Math.floor(Math.min.apply(null, prices) * 0.8 / 5000) * 5000 : '';
    var hi = prices.length ? Math.ceil(Math.max.apply(null, prices) * 1.2 / 5000) * 5000 : '';
    var entity = ENTITY_RE.test(g.name);
    var first = '', last = '', company = '';
    if (entity) company = titleCase_(g.name);
    else if (g.name.indexOf(',') > -1) { last = titleCase_(g.name.split(',')[0]); first = titleCase_(g.name.split(',')[1].trim().split(/\s+/)[0]); }
    else { var p = titleCase_(g.name).split(/\s+/); first = p.shift(); last = p.join(' '); }
    var summary = g.buys.slice(0, 5).map(function (b) {
      return [b.addr, b.city].filter(String).join(', ') + (b.price ? ' — ' + money_(b.price) : '') + (b.date ? ' (' + fmtDate_(b.date, 'MMM d, yyyy') + ')' : '');
    }).join('; ') + (g.buys.length > 5 ? '; +' + (g.buys.length - 5) + ' more' : '');
    var latest = g.buys[0].date;
    return {
      firstName: first, lastName: last, company: company, email: g.email, phone: g.phone, mailingAddress: g.mailing,
      categories: 'Cash Buyer', markets: cities.join(', '), propertyTypes: types.join(', '), minPrice: lo, maxPrice: hi,
      criteria: 'Bought ' + g.buys.length + ' propert' + (g.buys.length === 1 ? 'y' : 'ies') + ' with cash in the last ' + days + ' days' +
        (prices.length ? ', ' + money_(Math.min.apply(null, prices)) + (prices.length > 1 ? '–' + money_(Math.max.apply(null, prices)) : '') : '') + '.',
      purchases: summary, purchaseCount: g.buys.length, lastPurchase: latest ? fmtDate_(latest) : '',
      notes: g.email ? '' : 'Needs an email address before approval (skip trace this owner).',
      _key: (g.email || normKey_(g.name)) + ':' + g.buys.length + ':' + (latest ? fmtDate_(latest) : '')
    };
  });
  return { leads: leads, mapping: mp, headers: headers, rows: values.length - h - 1, considered: considered };
}

function cashLeads_(ctx) {
  var s = getSettings_();
  if (!str_(s.INTAKE_CASH_URL)) return 'No cash-buyer export sheet linked yet.';
  var src = openImportSource_(s.INTAKE_CASH_URL, str_(s.INTAKE_CASH_TAB));
  var res = cashLeadsFrom_(src.sheet.getDataRange().getDisplayValues(), s);
  if (res.mapping.ownerName === undefined && res.mapping.ownerFirst === undefined) throw new Error('No owner/buyer name column found in the cash-buyer sheet.');
  res.leads.forEach(function (lead) {
    var ref = 'CASH:' + lead._key;
    delete lead._key;
    addLead_(ctx, INTAKE_SOURCES.cash.label, lead, ref, lead.purchases);
  });
  return res.leads.length + ' cash buyers found in ' + res.considered + ' qualifying sales.';
}

// ---------- Source 4: Gmail buyer inquiries ----------

function gmailLeads_(ctx) {
  var s = getSettings_();
  var kws = list_(s.INTAKE_GMAIL_KEYWORDS).map(function (k) { return '"' + k.replace(/"/g, '') + '"'; });
  if (!kws.length) return 'No keywords set.';
  var days = Math.max(1, parseInt(s.INTAKE_GMAIL_DAYS, 10) || 3);
  var q = 'in:inbox newer_than:' + days + 'd -from:me (' + kws.join(' OR ') + ')';
  var mine = myAddresses_();
  GmailApp.search(q, 0, 100).forEach(function (thread) {
    thread.getMessages().forEach(function (msg) {
      var ref = 'GMAIL:' + msg.getId();
      if (ctx.refs[ref]) return;
      var from = parseFrom_(msg.getFrom());
      var subject = str_(msg.getSubject());
      if (!from.email || mine.indexOf(from.email) > -1) return;
      if (DEAL_ID_RE.test(subject) || /^\s*(re:\s*)?unsubscribe/i.test(subject)) return; // deal replies are tracked as Responses
      var body = stripQuoted_(msg.getPlainBody());
      var text = subject + '\n' + body;
      var phone = (body.match(/(\+?1[\s.\-]?)?\(?\d{3}\)?[\s.\-]?\d{3}[\s.\-]?\d{4}/) || [''])[0];
      var price = parsePriceRange_(text);
      var nameParts = from.name ? from.name.replace(/[<>"]/g, '').split(/\s+/) : [];
      addLead_(ctx, INTAKE_SOURCES.gmail.label, {
        firstName: titleCase_(nameParts.shift() || ''), lastName: titleCase_(nameParts.join(' ')), email: from.email, phone: phone,
        markets: marketsIn_(text).join(', '), propertyTypes: typesIn_(text).join(', '), categories: strategiesIn_(text).join(', '),
        minPrice: price.min, maxPrice: price.max, criteria: body.replace(/\s+/g, ' ').slice(0, 400),
        notes: 'Emailed asking to join the buyers list: "' + subject.slice(0, 120) + '" (' + fmtDate_(msg.getDate()) + ').'
      }, ref, 'Email: ' + subject);
    });
  });
  return '';
}

// ---------- orchestration ----------

/** Resolved at run time so file order in the Apps Script project doesn't matter. */
function intakeRunner_(k) {
  return { form: formLeads_, sheet: sheetLeads_, cash: cashLeads_, gmail: gmailLeads_, dealmachine: dmLeads_, county: countyLeads_, watch: watchLeads_ }[k];
}

/** Caller must hold the lock (or use runBuyerIntake). */
function runIntakeSources_(sources, sendSummary) {
  var s = getSettings_();
  var ctx = intakeCtx_();
  var results = {};
  sources.forEach(function (k) {
    var src = INTAKE_SOURCES[k];
    if (!bool_(s[src.setting])) { results[k] = { status: 'off' }; return; }
    ctx.cur = { added: 0, updated: 0, duplicate: 0, skipped: 0 };
    try {
      var note = intakeRunner_(k)(ctx);
      results[k] = { status: 'ok', note: note || '', added: ctx.cur.added, updated: ctx.cur.updated, duplicate: ctx.cur.duplicate, skipped: ctx.cur.skipped };
    } catch (e) {
      results[k] = { status: 'error', note: String(e && e.message || e), added: ctx.cur.added, updated: ctx.cur.updated };
    }
  });
  if (sources.indexOf('county') > -1 || sources.indexOf('watch') > -1) {
    try {
      var archived = ledgerCleanupLegacy_();
      ctx.cur = { added: 0, updated: 0, duplicate: 0, skipped: 0 };
      var lp = ledgerPromote_(ctx);
      results.active = { status: 'ok', note: lp.buyers + ' active investors (' + lp.minBuys + '+ purchases in ' + lp.windowDays + ' days)' + (ctx.reopened ? ' · ' + ctx.reopened + ' archived buyers reopened' : '') + (archived ? ' · ' + archived + ' one-off buyers archived' : ''), added: ctx.cur.added + (ctx.reopened || 0), updated: ctx.cur.updated - (ctx.reopened || 0), logged: ctx.ledgerLogged || 0 };
    } catch (e) { results.active = { status: 'error', note: String(e.message || e) }; }
  }
  flushIntake_(ctx);
  try { results.skiptrace = skipTraceRun_(); } catch (e) { results.skiptrace = { status: 'error', note: String(e.message || e) }; }
  var added = ctx.adds.length + (ctx.reopened || 0);
  var stamp = new Date().toISOString();
  setSetting_('LAST_INTAKE_RUN', stamp);
  setSetting_('LAST_INTAKE_RESULT', JSON.stringify(results));
  if (sendSummary && added > 0 && bool_(s.INTAKE_SUMMARY_EMAIL)) {
    try { sendIntakeSummary_(ctx.adds); } catch (e) { /* summary is best-effort */ }
  }
  return { results: results, added: added, ranAt: stamp };
}

/** Daily trigger entry point (also "Run now" in the app). */
function runBuyerIntake() {
  return withLock_(function () { return runIntakeSources_(Object.keys(INTAKE_SOURCES), true); });
}

function sendIntakeSummary_(adds) {
  var s = getSettings_();

  if (!isEmail_(to)) return;
  var url = '';
  try { url = ScriptApp.getService().getUrl(); } catch (e) { url = ''; }
  var rows = adds.slice(0, 40).map(function (a) {
    var box = [a.markets, a.propertyTypes, (a.minPrice || a.maxPrice) ? money_(a.minPrice || 0) + '–' + (a.maxPrice ? money_(a.maxPrice) : 'any') : ''].filter(String).join(' · ');
    return '<tr><td style="padding:8px 10px;border-bottom:1px solid #DDE5E0"><b>' + esc_(investorName_(a)) + '</b><br><span style="color:#5F6B65">' + esc_(a.email || 'no email yet') + '</span></td>' +
      '<td style="padding:8px 10px;border-bottom:1px solid #DDE5E0;color:#5F6B65">' + esc_(a.source) + '</td><td style="padding:8px 10px;border-bottom:1px solid #DDE5E0">' + esc_(box) + '</td></tr>';
  }).join('');
  var html = '<div style="font-family:Arial,sans-serif;max-width:640px"><div style="background:#0A0A0A;color:#fff;padding:18px 22px;font-family:Georgia,serif;font-size:20px">SameDay<span style="color:#7BC8A0">Investments</span></div>' +
    '<div style="padding:18px 22px;background:#fff"><p style="font-size:16px"><b>' + adds.length + ' new buyer' + (adds.length === 1 ? '' : 's') + '</b> found today and waiting for your review.</p>' +
    '<table style="width:100%;border-collapse:collapse;font-size:13px">' + rows + '</table>' +
    (adds.length > 40 ? '<p>…and ' + (adds.length - 40) + ' more.</p>' : '') +
    (url ? '<p style="margin-top:18px"><a href="' + esc_(url) + '" style="background:#0B2E21;color:#fff;padding:11px 18px;text-decoration:none;display:inline-block">Review new buyers</a></p>' : '') +
    '<p style="color:#5F6B65;font-size:12px">New buyers never receive deals until you approve them.</p></div></div>';
  GmailApp.sendEmail(to, adds.length + ' new buyer' + (adds.length === 1 ? '' : 's') + ' to review — ' + (str_(s.COMPANY_NAME) || APP_NAME),
    adds.length + ' new buyers are waiting for your review in the Deal Distribution app.' + (url ? '\n\n' + url : ''),
    { htmlBody: html, name: str_(s.SENDER_NAME) || APP_NAME });
}

/** Turns on the automatic intake: every morning and every night at the chosen hours. */
function enableDailyIntake(hourAm, hourPm) {
  requireRole_('Owner');
  return withLock_(function () {
    var s = getSettings_();
    var valid = function (h) { h = parseInt(h, 10); return isNaN(h) || h < 0 || h > 23 ? null : h; };
    var am = valid(hourAm); if (am === null) am = valid(s.INTAKE_HOUR); if (am === null) am = 6;
    var pm = valid(hourPm); if (pm === null) pm = valid(s.INTAKE_HOUR_PM); if (pm === null) pm = 19;
    setSetting_('INTAKE_HOUR', String(am));
    setSetting_('INTAKE_HOUR_PM', String(pm));
    deleteTriggers_('runBuyerIntake');
    ScriptApp.newTrigger('runBuyerIntake').timeBased().everyDays(1).atHour(am).create();
    if (pm !== am) ScriptApp.newTrigger('runBuyerIntake').timeBased().everyDays(1).atHour(pm).create();
    var form = buyerForm_();
    if (form) ensureFormTrigger_(form);
    return getIntakeStatus();
  });
}

function disableDailyIntake() {
  requireRole_('Owner');
  deleteTriggers_('runBuyerIntake');
  return getIntakeStatus();
}

function runBuyerIntakeNow() {
  requireRole_('Rep');

  var st = getIntakeStatus();
  st.run = r;

}

/**
 * Investors.gs — investor database: add, edit, deactivate, categorize, history.

function normalizeInvestor_(inv) {
  var out = {
    firstName: str_(inv.firstName),
    lastName: str_(inv.lastName),
    company: str_(inv.company),
    email: str_(inv.email).toLowerCase(),
    phone: str_(inv.phone),
    tier: str_(inv.tier),
    categories: joinList_(inv.categories),
    markets: joinList_(inv.markets),
    propertyTypes: joinList_(inv.propertyTypes),
    minPrice: num_(inv.minPrice),
    maxPrice: num_(inv.maxPrice),
    criteria: str_(inv.criteria),
    status: INVESTOR_STATUSES.indexOf(str_(inv.status)) > -1 ? str_(inv.status) : 'Active',
    optOut: bool_(inv.optOut),
    notes: str_(inv.notes)
  };
  // Only touch these when the caller sends them (the edit form doesn't send purchase history)
  if (inv.mailingAddress !== undefined) out.mailingAddress = str_(inv.mailingAddress);
  // buy box profile (only when sent)
  if (inv.zips !== undefined) out.zips = list_(inv.zips).map(function (z) { return z.replace(/[^\d-]/g, ''); }).filter(String).join(', ');
  if (inv.minAcres !== undefined) out.minAcres = num_(inv.minAcres);
  if (inv.maxAcres !== undefined) out.maxAcres = num_(inv.maxAcres);
  if (inv.condition !== undefined) out.condition = CONDITION_PREFS.indexOf(str_(inv.condition)) > -1 ? str_(inv.condition) : '';
  if (inv.funding !== undefined) out.funding = str_(inv.funding);
  if (inv.minRoi !== undefined) out.minRoi = num_(inv.minRoi);
  if (inv.closeDays !== undefined) out.closeDays = num_(inv.closeDays);
  return out;
}

function investorName_(inv) {
  var n = (str_(inv.firstName) + ' ' + str_(inv.lastName)).trim();
  return n || str_(inv.company) || str_(inv.email);
}

function cleanInvestorRow_(r) {
  var o = toClient_(r);
  o.optOut = bool_(r.optOut);
  o.dealsReceived = Number(r.dealsReceived) || 0;
  o.status = str_(r.status) || 'Active';
  o.pofStatus = pofStatus_(r);
  o.flags = buyerFlags_(r);
  o.reliabilityScore = reliabilityOf_(r);
  o.dealsClosed = Number(r.dealsClosed) || 0;
  o.defaults = Number(r.defaults) || 0;
  o.pofExpires = r.pofExpires instanceof Date ? fmtDate_(r.pofExpires) : str_(r.pofExpires);

}

// ---------- client API ----------

function listInvestors() {
  requireRole_('Viewer');
  return readTable_(SHEET.INVESTORS).rows.map(cleanInvestorRow_);
}

/** Creates or updates an investor. Emails are unique (case-insensitive). */
function saveInvestor(inv) {
  requireRole_('Rep');
  return withLock_(function () {
    var data = normalizeInvestor_(inv || {});
    if (data.email ? !isEmail_(data.email) : data.status !== PENDING_REVIEW) {
      throw new Error(data.email ? 'Enter a valid email address.' : 'An email address is required (only buyers pending review may be saved without one).');
    }
    if (!data.firstName && !data.lastName && !data.company) throw new Error('Enter a name or company.');
    var table = readTable_(SHEET.INVESTORS);
    var dup = data.email && table.rows.filter(function (r) {
      return String(r.email).toLowerCase() === data.email && r.id !== inv.id;
    })[0];
    if (dup) throw new Error('Another investor (' + investorName_(dup) + ', ' + dup.id + ') already uses ' + data.email + '.');
    data.updated = new Date();
    if (inv.id) {
      var existing = table.rows.filter(function (r) { return r.id === inv.id; })[0];
      if (!existing) throw new Error('Investor ' + inv.id + ' not found.');
      updateObject_(SHEET.INVESTORS, existing._row, data);
      data.id = inv.id;
    } else {
      data.id = nextId_('INVESTOR_SEQ', 'INV-', 5);
      data.source = str_(inv.source) || 'Manual';
      data.dateAdded = new Date();
      data.dealsReceived = 0;
      appendObjects_(SHEET.INVESTORS, [data]);
    }
    return cleanInvestorRow_(findBy_(SHEET.INVESTORS, 'id', data.id));
  });
}

/**
 * Bulk update. changes may include:
 *   status ('Active'|'Inactive'), tier, addCategory, removeCategory, optOut (bool)
 */
function updateInvestors(ids, changes) {
  requireRole_('Rep');
  return withLock_(function () {
    ids = ids || [];
    changes = changes || {};
    var table = readTable_(SHEET.INVESTORS);
    var count = 0, noEmail = [];
    table.rows.forEach(function (r) {
      if (ids.indexOf(r.id) === -1) return;
      // Approving a buyer (→ Active) requires a real email address
      if (changes.status === 'Active' && !isEmail_(r.email)) { noEmail.push(investorName_(r)); return; }
      var f = { updated: new Date() };
      if (changes.status && INVESTOR_STATUSES.indexOf(changes.status) > -1) f.status = changes.status;
      if (changes.tier !== undefined && changes.tier !== null) f.tier = str_(changes.tier);
      if (changes.optOut !== undefined) f.optOut = !!changes.optOut;
      var cats = list_(r.categories);
      if (changes.addCategory && cats.indexOf(changes.addCategory) === -1) cats.push(changes.addCategory);
      if (changes.removeCategory) cats = cats.filter(function (c) { return c !== changes.removeCategory; });
      if (changes.addCategory || changes.removeCategory) f.categories = cats.join(', ');
      updateObject_(SHEET.INVESTORS, r._row, f);
      count++;
    });
    return { updated: count, skippedNoEmail: noEmail, investors: listInvestors() };
  });
}

/** Permanently deletes investors (distribution history is kept in the log). */
function deleteInvestors(ids, confirmation) {
  requireRole_('Owner');
  if (String(confirmation || '').trim().toUpperCase() !== 'DELETE') {
    throw new Error('Type DELETE to permanently remove investors. (Tip: deactivate instead to keep their history.)');
  }
  return withLock_(function () {
    var table = readTable_(SHEET.INVESTORS);
    var rows = table.rows.filter(function (r) { return ids.indexOf(r.id) > -1; })
      .map(function (r) { return r._row; })
      .sort(function (a, b) { return b - a; });
    rows.forEach(function (n) { table.sheet.deleteRow(n); });
    return { deleted: rows.length, investors: listInvestors() };
  });
}

/** Every deal sent to an investor plus their responses. */
function getInvestorHistory(investorId) {
  requireRole_('Viewer');
  var deals = {};
  readTable_(SHEET.DEALS).rows.forEach(function (d) { deals[d.id] = dealTitle_(d); });
  var sends = readTable_(SHEET.LOG).rows
    .filter(function (l) { return l.investorId === investorId && l.mode === 'LIVE' && l.status === 'Sent'; })
    .map(function (l) { return { dealId: l.dealId, property: deals[l.dealId] || l.dealId, sentAt: l.sentAt }; });
  var responses = readTable_(SHEET.RESPONSES).rows
    .filter(function (r) { return r.investorId === investorId; });
  return toClient_({ sends: sends.reverse(), responses: responses.reverse() });
}

// ---- Ledger.gs ----
/**
 * Ledger.gs — "serious investors only".
 *
 * Every investor purchase found in public records (Norfolk, York, owner-change watch areas) is logged in
 * the "Purchase Ledger" sheet first. A buyer only graduates to New Buyers once they have bought at least
 * INTAKE_ACTIVE_MIN_BUYS properties within INTAKE_ACTIVE_DAYS (default: 3 in 90 days — more than 1–2
 * properties every couple of months). Their later purchases keep extending their history.
 *
 * Owner-change watch areas only know that ownership changed between two data refreshes (often months
 * apart), so for those the bar is scaled to the refresh period (e.g. 6 purchases over a 6-month refresh).
 */

// LEDGER_MAP / SHEET.LEDGER are defined in Config.gs

function ledgerKey_(name, mailing) {
  return isCompany_(name) ? 'co|' + normKey_(name) : normKey_(name) + '|' + streetKey_(String(mailing || '').split(',')[0]);
}

/** Basic investor screen before logging: no institutions / exempt types; individuals must not live there. */
function ledgerCandidate_(s, allowIndividuals) {
  if (!str_(s.name) || INSTITUTION_RE.test(s.name)) return false;
  if (/government|institution|exempt|non-taxable|ground lease|church|cemetery|utility|right of way|common area/i.test(String(s.type))) return false;
  if (isCompany_(s.name)) return true;
  if (!allowIndividuals) return false;
  if (/land/i.test(String(s.type))) return true;
  var a = streetKey_(s.addr), m = streetKey_(s.mailStreet || s.mailing);
  return !!(a && m && a !== m);
}

/** Logs purchases (each recorded once). Caller holds the lock. */
function ledgerAdd_(ctx, sales, sourceLabel) {
  var allowInd = bool_(getSettings_().INTAKE_WATCH_INDIVIDUALS);
  if (!ctx.ledgerRefs) {
    ctx.ledgerRefs = {};
    readTable_(SHEET.LEDGER).rows.forEach(function (r) { ctx.ledgerRefs[r.ref] = true; });
  }
  var rows = [];
  sales.forEach(function (s) {
    if (!s.saleRef || ctx.ledgerRefs[s.saleRef] || !ledgerCandidate_(s, allowInd)) return;
    ctx.ledgerRefs[s.saleRef] = true;
    rows.push({
      id: shortId_('P-'), ownerKey: ledgerKey_(s.name, s.mailing), owner: titleCase_(s.name), mailing: s.mailing || '', addr: titleCase_(s.addr || ''),
      city: titleCase_(s.city || ''), state: s.state || '', date: s.date || new Date(), periodDays: s.periodDays || '', price: s.price || '',
      type: s.type || '', source: sourceLabel, ref: s.saleRef, promoted: '', added: new Date()
    });
  });
  appendObjects_(SHEET.LEDGER, rows);
  ctx.ledgerLogged = (ctx.ledgerLogged || 0) + rows.length;
  return rows.length;
}

/** Promotes owners who meet the active-investor bar into New Buyers. Caller holds the lock. */
function ledgerPromote_(ctx) {
  var s = getSettings_();
  var minBuys = Math.max(1, parseInt(s.INTAKE_ACTIVE_MIN_BUYS, 10) || 3);
  var windowDays = Math.max(7, parseInt(s.INTAKE_ACTIVE_DAYS, 10) || 90);
  var t = readTable_(SHEET.LEDGER);
  var groups = {};
  t.rows.forEach(function (r) { (groups[r.ownerKey] = groups[r.ownerKey] || []).push(r); });
  var promoted = 0, buyers = 0;
  Object.keys(groups).forEach(function (k) {
    var g = groups[k];
    var fresh = g.filter(function (r) { return !bool_(r.promoted); });
    if (!fresh.length) return;
    var everPromoted = g.length !== fresh.length;
    var qualifies = everPromoted;
    if (!qualifies) {
      // dated purchases: any window of `windowDays` containing ≥ minBuys
      var dated = g.filter(function (r) { return !Number(r.periodDays); }).map(function (r) { return tms_(r.date); }).filter(Boolean).sort();
      for (var i = 0; i + minBuys - 1 < dated.length && !qualifies; i++) {
        if (dated[i + minBuys - 1] - dated[i] <= windowDays * 86400000) qualifies = true;
      }
      // owner-change watch batches: scale the bar to the refresh period
      var batches = {};
      g.forEach(function (r) { if (Number(r.periodDays)) { var bk = r.source + '|' + fmtDate_(asDate_(r.date) || new Date()); (batches[bk] = batches[bk] || []).push(r); } });
      Object.keys(batches).forEach(function (bk) {
        var b = batches[bk], period = Number(b[0].periodDays) || windowDays;
        if (b.length >= Math.max(minBuys, Math.ceil(minBuys * period / windowDays))) qualifies = true;
      });
    }
    if (!qualifies) return;
    var sales = fresh.map(function (r) {
      return { name: r.owner, email: '', phone: '', mailing: r.mailing, addr: r.addr, city: r.city, state: r.state,
        date: Number(r.periodDays) ? null : asDate_(r.date), price: r.price, type: r.type, financing: '', saleRef: 'LEDGER:' + r.ref };
    });
    var lead = groupSales_(sales, windowDays, 'Active investor: ' + g.length + ' purchases found in public records (' + fresh[0].source + ').')[0];
    if (!lead) return;
    lead.criteria = 'Active investor — ' + g.length + ' purchase' + (g.length === 1 ? '' : 's') + ' logged in public records. ' + lead.criteria.replace(/^New-construction \/ land buyer\. /, '');
    if (/land/i.test(lead.propertyTypes)) lead.criteria = 'New-construction / land buyer. ' + lead.criteria;
    lead._total = g.length;
    lead._addrs = fresh.map(function (r) { return r.addr; });
    // a buyer archived earlier for having too few purchases comes back for review once they qualify
    var prior = ctx.byKey[ownerKey_(lead)];
    if (prior && str_(prior.status) === 'Inactive' && /not an active investor yet\]/.test(str_(prior.notes)) && prior._row) {
      var note = str_(prior.notes).replace(/\s*\[Archived [^\]]*not an active investor yet\]/g, '').trim();
      var up = ctx.updates[prior.id] || (ctx.updates[prior.id] = { row: prior._row, fields: {} });
      up.fields.status = PENDING_REVIEW; up.fields.notes = note; up.fields.updated = new Date();
      ['categories', 'propertyTypes', 'markets', 'criteria', 'minPrice', 'maxPrice', 'mailingAddress'].forEach(function (k) {
        if (str_(lead[k]) !== '') { up.fields[k] = lead[k]; prior[k] = lead[k]; }
      });
      prior.status = PENDING_REVIEW; prior.notes = note;
      ctx.reopened = (ctx.reopened || 0) + 1;
    }
    addRecordLeads_(ctx, fresh[0].source, [lead]);
    fresh.forEach(function (r) { r.promoted = true; });
    promoted += fresh.length; buyers++;
  });
  // write the promoted flags back (one column write)
  if (promoted && t.rows.length) {
    var byRow = {};
    t.rows.forEach(function (r) { byRow[r._row] = r; });
    var last = t.rows[t.rows.length - 1]._row, vals = [];
    for (var n = 2; n <= last; n++) vals.push(byRow[n] ? (bool_(byRow[n].promoted) ? 'TRUE' : '') : '');
    writeColumn_(SHEET.LEDGER, 'promoted', 2, vals);
  }
  return { buyers: buyers, purchases: promoted, minBuys: minBuys, windowDays: windowDays };
}

/**
 * One-time cleanup after switching to "serious investors only": buyers that came from public records
 * under the old rules, are still Pending Review, and don't meet the bar are set to Inactive (kept, never deleted).
 */
function ledgerCleanupLegacy_() {
  var props = PropertiesService.getScriptProperties();
  if (props.getProperty('LEDGER_MIGRATED')) return 0;
  var s = getSettings_();
  var minBuys = Math.max(1, parseInt(s.INTAKE_ACTIVE_MIN_BUYS, 10) || 3);
  var sources = [INTAKE_SOURCES.county.label, INTAKE_SOURCES.watch.label];
  var n = 0;
  readTable_(SHEET.INVESTORS).rows.forEach(function (i) {
    if (str_(i.status) !== PENDING_REVIEW || sources.indexOf(str_(i.source)) === -1) return;
    if ((Number(i.purchaseCount) || 0) >= minBuys) return;
    updateObject_(SHEET.INVESTORS, i._row, { status: 'Inactive', updated: new Date(), notes: (str_(i.notes) + ' [Archived ' + fmtDate_(new Date()) + ': fewer than ' + minBuys + ' purchases — not an active investor yet]').trim() });
    n++;
  });
  // longer lookbacks so the first ledger run sees a full window
  if (String(s.INTAKE_COUNTY_DAYS) === '30') setSetting_('INTAKE_COUNTY_DAYS', '90');
  if (String(s.INTAKE_WATCH_DAYS) === '45') setSetting_('INTAKE_WATCH_DAYS', '90');
  props.setProperty('LEDGER_MIGRATED', new Date().toISOString());
  return n;
}

function ledgerStatus_() {
  var t = readTable_(SHEET.LEDGER).rows;
  var s = getSettings_();
  var owners = {};
  t.forEach(function (r) { owners[r.ownerKey] = (owners[r.ownerKey] || 0) + 1; });
  var minBuys = Math.max(1, parseInt(s.INTAKE_ACTIVE_MIN_BUYS, 10) || 3);
  return {
    purchases: t.length, owners: Object.keys(owners).length,
    almost: Object.keys(owners).filter(function (k) { return owners[k] === minBuys - 1; }).length,
    minBuys: minBuys, days: Math.max(7, parseInt(s.INTAKE_ACTIVE_DAYS, 10) || 90)
  };
}

// ---- Matching.gs ----
/**
 * Matching.gs — Smart Buyer Matching.
 *
 * Scores every buyer 0–100 against a deal using their buy box and real behavior:
 *   location (zip 30 / city-market 25 / has bought there 20) · property type 20 · price 15 ·
 *   acreage 10 (land) · rehab vs turnkey 5 · ROI 5 · tier 10 · engagement 5 · verified funds 3 ·
 *   closed deals with us (+) · contract defaults (−)
 * Hard "blockers" (deal is outside what they told you they buy) exclude a buyer entirely.
 * Fit: strong ≥ 70 · good ≥ MATCH_MIN_SCORE · weak below · no = blocked.
 */

function isLandDeal_(d) {
  return /land|lot|acre|parcel/i.test(str_(d.propertyType)) || (dealAcres_(d) > 0 && !Number(d.sqft) && !Number(d.beds));
}

function dealAcres_(d) {
  if (Number(d.acres) > 0) return Number(d.acres);
  var t = lc_(d.lotSize), m;
  if ((m = t.match(/([\d.]+)\s*(ac|acre)/))) return parseFloat(m[1]);
  if ((m = t.match(/([\d,]+)\s*(sq|sf)/))) return parseFloat(m[1].replace(/,/g, '')) / 43560;
  return 0;
}

function tierRank_(tier) {
  var tiers = list_(getSettings_().TIERS).map(lc_);
  var i = tiers.indexOf(lc_(tier));
  return i < 0 ? 99 : i; // 0 = top tier
}

function isRehabDeal_(d) {
  var price = Number(d.askingPrice) || 0, rep = Number(d.repairs) || 0;
  return rep >= 15000 || (price && rep / price >= 0.1);
}

function dealRoi_(d) {
  var m = dealMetrics_(d);
  return m.allIn && m.spread !== '' ? Math.round((m.spread / m.allIn) * 1000) / 10 : '';
}

/** Behavior lookups for many investors at once. */
function matchContext_(dealId) {
  var resp = {}, offers = {};
  readTable_(SHEET.RESPONSES).rows.forEach(function (r) {
    if (!r.investorId) return;
    var k = r.investorId;
    resp[k] = resp[k] || { interested: 0, total: 0 };
    resp[k].total++;
    if (r.type === 'Interested' || r.type === 'Offer') resp[k].interested++;
  });
  readTable_(SHEET.OFFERS).rows.forEach(function (o) { if (o.investorId) offers[o.investorId] = (offers[o.investorId] || 0) + 1; });
  return { resp: resp, offers: offers, dealId: dealId };
}

function matchInvestor_(inv, deal, ctx) {
  var reasons = [], blockers = [], score = 0;
  var city = lc_(deal.city), market = lc_(deal.market), zip = str_(deal.zip).slice(0, 5);
  var land = isLandDeal_(deal);

  // Location (30)
  var zips = list_(inv.zips).map(function (z) { return z.slice(0, 5); });
  var mkts = list_(inv.markets).map(lc_);
  var boughtHere = city && lc_(inv.purchases).indexOf(city) > -1;
  var mktHit = mkts.some(function (m) { return (market && (m === market || m.indexOf(market) > -1 || market.indexOf(m) > -1)) || (city && (m === city || m.indexOf(city) > -1)); });
  if (zip && zips.indexOf(zip) > -1) { score += 30; reasons.push('Buys in ' + zip); }
  else if (mktHit) { score += 25; reasons.push('Buys in ' + (deal.market || deal.city)); }
  else if (boughtHere) { score += 20; reasons.push('Has bought in ' + titleCase_(deal.city)); }
  else if (!zips.length && !mkts.length) { score += 10; }
  else blockers.push('Outside their areas');
  if (boughtHere && (mktHit || zips.indexOf(zip) > -1)) { score += 5; reasons.push('Recent purchases nearby'); }

  // Property type (20)
  var types = list_(inv.propertyTypes).map(lc_);
  var dType = lc_(normalizePropType_(deal.propertyType));
  var dev = /develop|builder|construction/i.test(inv.categories);
  if (land) {
    if (types.some(function (t) { return /land|lot/.test(t); }) || dev) { score += 20; reasons.push(dev ? 'Builder / developer' : 'Buys land'); }
    else if (!types.length) score += 4;
    else blockers.push('Doesn\'t buy land');
  } else if (!types.length) score += 8;
  else if (dType && types.some(function (t) { return t === dType || t.indexOf(dType) > -1 || dType.indexOf(t) > -1; })) { score += 20; reasons.push('Buys ' + normalizePropType_(deal.propertyType)); }
  else if (dType) blockers.push('Doesn\'t buy ' + normalizePropType_(deal.propertyType));

  // Price (15)
  var price = Number(deal.askingPrice) || 0, max = Number(inv.maxPrice) || 0, min = Number(inv.minPrice) || 0;
  if (price && max && price > max * 1.05) blockers.push('Above their max ' + money_(max));
  else if (price && (max || min)) {
    if (min && price < min * 0.8) { score += 5; reasons.push('Below their usual range'); }
    else { score += 15; reasons.push('Within budget'); }
  } else score += 6;

  // Acreage (10, land)
  var acres = dealAcres_(deal);
  var minA = Number(inv.minAcres) || 0, maxA = Number(inv.maxAcres) || 0;
  if (acres && (minA || maxA)) {
    if ((minA && acres < minA) || (maxA && acres > maxA)) blockers.push('Acreage outside ' + (minA || 0) + '–' + (maxA || 'any') + ' ac');
    else { score += 10; reasons.push(acres + ' ac fits'); }
  } else if (land) score += 4;

  // Rehab vs turnkey (5)
  var cond = lc_(inv.condition);
  if (!land && cond) {
    var rehab = isRehabDeal_(deal);
    if (cond === 'either') score += 3;
    else if ((cond === 'rehab') === rehab) { score += 5; reasons.push(rehab ? 'Wants rehabs' : 'Wants turnkey'); }
    else { score -= 5; reasons.push('Prefers ' + (rehab ? 'turnkey' : 'rehab')); }
  }

  // ROI (5)
  var roi = dealRoi_(deal), minRoi = Number(inv.minRoi) || 0;
  if (!land && minRoi && roi !== '') {
    if (roi >= minRoi) { score += 5; reasons.push('ROI ' + roi + '% ≥ their ' + minRoi + '%'); }
    else { score -= 5; reasons.push('ROI ' + roi + '% below their ' + minRoi + '%'); }
  }

  // Tier (10)
  var rank = tierRank_(inv.tier);
  score += rank === 0 ? 10 : rank === 1 ? 6 : rank === 2 ? 3 : 0;
  if (rank === 0) reasons.push(inv.tier + ' buyer');

  // Behavior
  var r = (ctx && ctx.resp[inv.id]) || { interested: 0 };
  if (r.interested) { score += Math.min(5, r.interested * 2); reasons.push('Responsive (' + r.interested + ' interested)'); }
  if (pofStatus_(inv) === 'Verified') { score += 3; reasons.push('POF verified'); }
  var closed = Number(inv.dealsClosed) || 0, defaults = Number(inv.defaults) || 0;
  if (closed) { score += Math.min(8, closed * 2); reasons.push(closed + ' closed with us'); }
  if (defaults) { score -= defaults * 10; reasons.push(defaults + ' contract default' + (defaults > 1 ? 's' : '')); }

  score = Math.max(0, Math.min(100, Math.round(score)));
  var minScore = parseInt(getSettings_().MATCH_MIN_SCORE, 10) || 50;
  var fit = blockers.length ? 'no' : score >= 70 ? 'strong' : score >= minScore ? 'good' : 'weak';
  return { score: blockers.length ? 0 : score, rawScore: score, fit: fit, reasons: reasons, blockers: blockers, tierRank: rank };
}

/** Ranks every active buyer for a deal. */
function rankBuyers_(deal, investors) {
  var ctx = matchContext_(deal.id);
  return investors.map(function (inv) {
    var m = matchInvestor_(inv, deal, ctx);
    m.investor = inv;
    return m;
  }).sort(function (a, b) { return (b.score - a.score) || (a.tierRank - b.tierRank); });
}

// ---------- client API ----------

function matchBuyers(dealId) {
  requireRole_('Viewer');
  var deal = getDealRow_(dealId);
  var all = readTable_(SHEET.INVESTORS).rows;
  var active = all.filter(function (i) { return (str_(i.status) || 'Active') === 'Active' && !bool_(i.optOut) && isEmail_(i.email); });
  var ranked = rankBuyers_(deal, active);
  var stats = buyerStats_(loadAll_());
  var counts = { strong: 0, good: 0, weak: 0, no: 0 };
  ranked.forEach(function (m) { counts[m.fit]++; });
  return toClient_({
    deal: cleanDealRow_(deal),
    land: isLandDeal_(deal),
    acres: dealAcres_(deal),
    counts: counts,
    pendingReview: all.filter(function (i) { return str_(i.status) === PENDING_REVIEW; }).length,
    matches: ranked.map(function (m) {
      var i = m.investor;
      return {
        id: i.id, name: investorName_(i), company: str_(i.company), email: str_(i.email), tier: str_(i.tier),
        score: m.score, fit: m.fit, reasons: m.reasons, blockers: m.blockers, pofStatus: pofStatus_(i),
        reliability: reliabilityOf_(i), markets: str_(i.markets), maxPrice: i.maxPrice, dealsReceived: Number(i.dealsReceived) || 0,
        heat: stats[i.id] ? stats[i.id].heat : 0,
        // Best Buyer Predictor: fit (60%) blended with real behavior (heat, 40%)
        likelihood: m.fit === 'no' ? 0 : Math.round(0.6 * m.score + 0.4 * (stats[i.id] ? stats[i.id].heat : 0))
      };
    })
  });
}

// ---- Offers.gs ----
/**
 * Offers.gs — Offer Management & Comparison.
 *
 * Offers arrive automatically (an investor replies "OFFER - SDI-…" or the inbox scanner reads an
 * offer amount) or are entered by the team. Each offer tracks amount, assignment fee, EMD,
 * inspection period, closing date, financing, proof of funds and contract status.
 *
 * Strength score (0–100) for side-by-side comparison:
 *   your assignment fee / offer price 40 · EMD 15 · proof of funds 15 · reliability 10 ·
 *   closing speed 10 · inspection period 10
 */

var ACTIVE_OFFER = ['Received', 'Countered', 'Accepted', 'Backup', 'Under Contract'];

function offerFee_(o, deal) {
  if (o.assignmentFee !== '' && o.assignmentFee !== null && o.assignmentFee !== undefined && !isNaN(Number(o.assignmentFee))) return Number(o.assignmentFee);
  var cp = Number(deal && deal.contractPrice) || 0;
  return cp && Number(o.amount) ? Number(o.amount) - cp : '';
}

function offerPofLabel_(o, inv) {
  var st = inv ? pofStatus_(inv) : 'None';
  if (st === 'Verified' || st === 'Expiring') return 'Verified';
  if (st === 'Expired') return 'Expired';
  return str_(o.pof) || (st === 'Pending' ? 'Provided' : 'Missing');
}

/** Adds strength score + highlights to a set of offers for one deal. */
function scoreOffers_(offers, deal, invById) {
  var act = offers.filter(function (o) { return ACTIVE_OFFER.indexOf(o.status) > -1; });
  var vals = function (fn) { return act.map(fn).filter(function (v) { return v !== '' && !isNaN(v); }); };
  var fees = vals(function (o) { return Number(offerFee_(o, deal) === '' ? o.amount : offerFee_(o, deal)); });
  var emds = vals(function (o) { return Number(o.emd) || 0; });
  var maxFee = Math.max.apply(null, fees.concat([1])), minFee = Math.min.apply(null, fees.concat([maxFee]));
  var maxEmd = Math.max.apply(null, emds.concat([1]));
  var best = {};
  offers.forEach(function (o) {
    var inv = invById[o.investorId];
    var fee = offerFee_(o, deal);
    var feeVal = fee === '' ? Number(o.amount) || 0 : fee;
    var s = 0;
    s += maxFee === minFee ? 40 : 40 * (feeVal - minFee) / (maxFee - minFee);
    s += 15 * Math.min(1, (Number(o.emd) || 0) / maxEmd);
    var pof = offerPofLabel_(o, inv);
    s += pof === 'Verified' ? 15 : pof === 'Provided' ? 8 : 0;
    var rel = inv ? reliabilityOf_(inv) : '';
    s += rel === '' ? 5 : rel * 2;
    if (inv && Number(inv.defaults) > 0) s -= 10;
    var close = parseDateLoose_(o.closingDate);
    var daysToClose = close ? Math.max(0, Math.round((close.getTime() - Date.now()) / 86400000)) : '';
    s += daysToClose === '' ? 4 : daysToClose <= 14 ? 10 : daysToClose <= 30 ? 7 : 3;
    var insp = o.inspectionDays === '' ? '' : Number(o.inspectionDays);
    s += insp === '' ? 4 : insp <= 3 ? 10 : insp <= 7 ? 7 : insp <= 14 ? 4 : 1;
    o.strength = ACTIVE_OFFER.indexOf(o.status) > -1 ? Math.max(0, Math.min(100, Math.round(s))) : 0;
    o.fee = fee;
    o.pofLabel = pof;
    o.reliability = rel;
    o.buyerDefaults = inv ? Number(inv.defaults) || 0 : 0;
    o.daysToClose = daysToClose;
    o.tier = inv ? str_(inv.tier) : '';
    if (ACTIVE_OFFER.indexOf(o.status) > -1) {
      if (!best.amount || Number(o.amount) > Number(best.amount.amount)) best.amount = o;
      if (Number(o.emd) && (!best.emd || Number(o.emd) > Number(best.emd.emd))) best.emd = o;
      if (daysToClose !== '' && (!best.close || daysToClose < best.close.daysToClose)) best.close = o;
      if (insp !== '' && (!best.insp || insp < Number(best.insp.inspectionDays))) best.insp = o;
      if (!best.strength || o.strength > best.strength.strength) best.strength = o;
    }
  });
  offers.forEach(function (o) {
    o.best = Object.keys(best).filter(function (k) { return best[k] === o; });
  });
  return offers.sort(function (a, b) { return b.strength - a.strength || Number(b.amount) - Number(a.amount); });
}

/** Creates an offer from an inbox / manual response of type Offer. Caller holds the lock. */
function createOfferFromResponse_(resp) {
  if (!resp.dealId || !resp.offerAmount) return null;
  var exists = readTable_(SHEET.OFFERS).rows.some(function (o) { return o.responseId === resp.id; });
  if (exists) return null;
  var deal = findBy_(SHEET.DEALS, 'id', resp.dealId);
  if (!deal) return null;
  var inv = resp.investorId ? findBy_(SHEET.INVESTORS, 'id', resp.investorId) : null;
  var text = str_(resp.message);
  var emd = (text.match(/\bemd\b[^$\d]{0,20}\$?\s?([\d,]+(?:\.\d+)?\s*k?)/i) || [])[1];
  var insp = (text.match(/(\d{1,2})[\s-]*day[s]?\s*(inspection|due diligence|dd)/i) || [])[1];
  var close = (text.match(/clos\w*\s*(in|within)\s*(\d{1,3})\s*days/i) || [])[2];
  var row = {
    id: shortId_('O-'), dealId: deal.id, property: dealTitle_(deal), investorId: inv ? inv.id : '',
    investorName: inv ? investorName_(inv) : str_(resp.investorName), investorEmail: lc_(resp.investorEmail),
    received: new Date(), amount: num_(resp.offerAmount), assignmentFee: '', emd: emd ? num_(emd.replace(/\s/g, '')) : '',
    inspectionDays: insp ? Number(insp) : '', closingDate: close ? fmtDate_(new Date(Date.now() + Number(close) * 86400000)) : '',
    financing: /cash/i.test(text) ? 'Cash' : /hard money|private lend/i.test(text) ? 'Hard money' : '',
    pof: /proof of funds|pof/i.test(text) && !/no pof|without pof/i.test(text) ? 'Provided' : '',
    status: 'Received', counter: '', source: 'Email (auto)', notes: text.slice(0, 300), updated: new Date(), responseId: resp.id
  };
  var fee = offerFee_(row, deal);
  if (fee !== '') row.assignmentFee = fee;
  appendObjects_(SHEET.OFFERS, [row]);
  advanceStage_(deal.id, 'Offer Received');
  return row;
}

// ---------- client API ----------

function listOffers(dealId) {
  requireRole_('Viewer');
  var invById = {};
  readTable_(SHEET.INVESTORS).rows.forEach(function (i) { invById[i.id] = i; });
  var deals = {};
  readTable_(SHEET.DEALS).rows.forEach(function (d) { deals[d.id] = d; });
  var rows = readTable_(SHEET.OFFERS).rows.filter(function (o) { return !dealId || o.dealId === dealId; });
  var byDeal = {};
  rows.forEach(function (o) { (byDeal[o.dealId] = byDeal[o.dealId] || []).push(o); });
  var out = [];
  Object.keys(byDeal).forEach(function (id) { out = out.concat(scoreOffers_(byDeal[id], deals[id] || {}, invById)); });
  return toClient_(out);
}

/** Side-by-side comparison for one deal. */
function compareOffers(dealId) {
  requireRole_('Viewer');
  var deal = getDeal(dealId);
  return { deal: deal, offers: listOffers(dealId) };
}

/** Create or update an offer. */
function saveOffer(o) {
  requireRole_('Rep');
  return withLock_(function () {
    o = o || {};
    var deal = getDealRow_(o.dealId);
    if (!num_(o.amount)) throw new Error('Enter the offer amount.');
    var inv = o.investorId ? findBy_(SHEET.INVESTORS, 'id', o.investorId) : null;
    if (!inv && !str_(o.investorName)) throw new Error('Choose the buyer or enter a name.');
    if (o.closingDate && !/^\d{4}-\d{2}-\d{2}$/.test(o.closingDate)) throw new Error('Closing date must be a date.');
    var f = {
      dealId: deal.id, property: dealTitle_(deal), investorId: inv ? inv.id : '',
      investorName: inv ? investorName_(inv) : str_(o.investorName), investorEmail: inv ? lc_(inv.email) : lc_(o.investorEmail),
      amount: num_(o.amount), emd: num_(o.emd), inspectionDays: num_(o.inspectionDays), closingDate: str_(o.closingDate),
      financing: str_(o.financing), pof: str_(o.pof), notes: str_(o.notes), updated: new Date()
    };
    f.assignmentFee = o.assignmentFee !== undefined && o.assignmentFee !== '' ? num_(o.assignmentFee) : offerFee_({ amount: f.amount }, deal);
    if (o.id) {
      var ex = findBy_(SHEET.OFFERS, 'id', o.id);
      if (!ex) throw new Error('Offer not found.');
      updateObject_(SHEET.OFFERS, ex._row, f);
      f.id = o.id;
    } else {
      f.id = shortId_('O-');
      f.received = new Date();
      f.status = 'Received';
      f.source = 'Manual';
      appendObjects_(SHEET.OFFERS, [f]);
      advanceStage_(deal.id, 'Offer Received');
    }
    return listOffers(deal.id).filter(function (x) { return x.id === f.id; })[0];
  });
}

/**
 * Changes an offer's contract status.
 *   Accepted → deal moves to Buyer Selected with this buyer; other open offers become Backup.
 *   Under Contract → deal moves to Assignment Signed.
 *   Countered → stores counter amount; deal moves to Negotiating.
 *   Fell Through → records a failed closing for the buyer; deal goes back to Negotiating.
 */
function setOfferStatus(offerId, status, extra) {
  requireRole_('Rep');
  if (OFFER_STATUSES.indexOf(status) === -1) throw new Error('Unknown offer status.');
  extra = extra || {};
  return withLock_(function () {
    var o = findBy_(SHEET.OFFERS, 'id', offerId);
    if (!o) throw new Error('Offer not found.');
    var f = { status: status, updated: new Date() };
    if (status === 'Countered') { f.counter = num_(extra.counter); advanceStage_(o.dealId, 'Negotiating'); }
    updateObject_(SHEET.OFFERS, o._row, f);
    var deal = getDealRow_(o.dealId);
    if (status === 'Accepted') {
      readTable_(SHEET.OFFERS).rows.forEach(function (x) {
        if (x.dealId === o.dealId && x.id !== o.id && ['Received', 'Countered', 'Accepted'].indexOf(x.status) > -1) updateObject_(SHEET.OFFERS, x._row, { status: 'Backup', updated: new Date() });
      });
      var df = { stage: 'Buyer Selected', stageUpdated: new Date(), status: 'Pending', buyerInvestorId: o.investorId || '', buyer: o.investorName, updated: new Date() };
      if (!deal.buyerSelectedOn) df.buyerSelectedOn = new Date();
      if (o.emd !== '') df.emdAmount = o.emd;
      if (str_(o.closingDate)) df.closingDate = str_(o.closingDate);
      updateObject_(SHEET.DEALS, deal._row, df);
    } else if (status === 'Under Contract') {
      updateObject_(SHEET.DEALS, deal._row, { stage: 'Assignment Signed', stageUpdated: new Date(), status: 'Pending', assignmentSigned: new Date(), buyerInvestorId: o.investorId || '', buyer: o.investorName, updated: new Date() });
    } else if (status === 'Fell Through') {
      if (o.investorId) recordBuyerOutcome_(o.investorId, 'default', o.dealId, str_(extra.note));
      if (str_(deal.buyerInvestorId) === str_(o.investorId)) {
        updateObject_(SHEET.DEALS, deal._row, { stage: 'Negotiating', stageUpdated: new Date(), status: 'Available', buyerInvestorId: '', buyer: '', updated: new Date() });
      }
    }
    return compareOffers(o.dealId);
  });
}

// ---- OwnerWatch.gs ----
/**
 * OwnerWatch.gs — free public-records buyer finder for Hampton Roads, Richmond and NE North Carolina.
 *
 * Two kinds of sources:
 *  • "sales"  — live recorded-sale feeds with the buyer, date and price (York County / Yorktown).
 *  • "owners" — public parcel layers with the CURRENT owner but no sale date. We keep a private
 *               snapshot of every parcel's owner; when the locality refreshes its data, every parcel
 *               whose owner changed is a purchase, and the new owner is the buyer.
 *               (Richmond ≈ weekly · Hampton Roads regional parcels ≈ twice a year · NC OneMap ≈ periodically)
 *
 * Investor filter (every source): companies / LLCs / trusts, or individuals whose mailing address is
 * not the property (absentee = investor). Homeowners, governments, banks, churches and HOAs are skipped.
 * Purchases are tagged Residential / Commercial / Land; repeat buyers are grouped and ranked.
 * Free records never show whether a purchase was cash or financed.
 */

var HRGEO_URL = 'https://geo.hrsd.com/hrgeo/rest/services/regionalgis/HRGeo_Parcels_Public/MapServer/0';
var NCONEMAP_URL = 'https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/FeatureServer/1';
var OW_PAGE = 2000;

var WATCH_SOURCES = [
  { key: 'york', label: 'York County (Yorktown)', kind: 'sales', url: 'https://maps.yorkcounty.gov/arcgis/rest/services/AGOservices/Landrecords_Service/FeatureServer/7', market: 'Yorktown' },
  { key: 'richmond', label: 'Richmond', kind: 'owners', provider: 'richmond', url: 'https://services1.arcgis.com/k3vhq11XkBNeeOfM/ArcGIS/rest/services/Parcels/FeatureServer/0', market: 'Richmond', cadence: 'about weekly' },
  { key: 'hr810', label: 'Virginia Beach', kind: 'owners', provider: 'hrgeo', fips: '810', market: 'Virginia Beach', cadence: 'about twice a year' },
  { key: 'hr740', label: 'Portsmouth', kind: 'owners', provider: 'hrgeo', fips: '740', market: 'Portsmouth', cadence: 'about twice a year' },
  { key: 'hr800', label: 'Suffolk', kind: 'owners', provider: 'hrgeo', fips: '800', market: 'Suffolk', cadence: 'about twice a year' },
  { key: 'hr700', label: 'Newport News', kind: 'owners', provider: 'hrgeo', fips: '700', market: 'Newport News', cadence: 'about twice a year' },
  { key: 'hr093', label: 'Isle of Wight (Smithfield)', kind: 'owners', provider: 'hrgeo', fips: '093', market: 'Smithfield', cadence: 'about twice a year' },
  { key: 'hr830', label: 'Williamsburg', kind: 'owners', provider: 'hrgeo', fips: '830', market: 'Williamsburg', cadence: 'about twice a year' },
  { key: 'hr095', label: 'James City County', kind: 'owners', provider: 'hrgeo', fips: '095', market: 'James City County', cadence: 'about twice a year' },
  { key: 'hr073', label: 'Gloucester County', kind: 'owners', provider: 'hrgeo', fips: '073', market: 'Gloucester', cadence: 'about twice a year' },
  { key: 'nc37139', label: 'Elizabeth City (Pasquotank Co.)', kind: 'owners', provider: 'nc', fips: '37139', market: 'Elizabeth City', cadence: 'when the state refreshes' },
  { key: 'nc37029', label: 'Camden County, NC', kind: 'owners', provider: 'nc', fips: '37029', market: 'Camden', cadence: 'when the state refreshes' },
  { key: 'nc37053', label: 'Currituck County (Moyock)', kind: 'owners', provider: 'nc', fips: '37053', market: 'Moyock', cadence: 'when the state refreshes' },
  { key: 'nc37143', label: 'Perquimans County, NC', kind: 'owners', provider: 'nc', fips: '37143', market: 'Hertford', cadence: 'when the state refreshes' },
  { key: 'nc37041', label: 'Chowan County, NC', kind: 'owners', provider: 'nc', fips: '37041', market: 'Edenton', cadence: 'when the state refreshes' }
];
var WATCH_NOT_AVAILABLE = 'Not available from free public feeds: Chesapeake, Hampton and Poquoson (owner names withheld), Henrico, Chesterfield and Hanover (no public owner/sales feed). Cover those with a cash-buyer export sheet (PropStream, BatchLeads, county records) or DealMachine.';

// ---------- shared helpers ----------

var INSTITUTION_RE = /\b(city of|county of|town of|commonwealth|united states|state of|housing authority|redevelopment|association|assn|church|ministr\w*|baptist|methodist|school board|bank|mortgage|federal national|federal home|fannie|freddie|secretary of|hud|veterans|dept of|department of|electric|dominion|railroad|utilit\w*|habitat for humanity|cemetery|condominium|iglesia|mission|temple|mosque|synagogue|tabernacle|fellowship|diocese|university|college|hospital|land trust|community land)\b/i;

function streetKey_(s) { return lc_(s).replace(/\b(street|st|avenue|ave|road|rd|drive|dr|lane|ln|court|ct|boulevard|blvd|circle|cir|way|place|pl)\b/g, '').replace(/[^a-z0-9]/g, '').slice(0, 14); }

/** A real company (LLC, Inc, partners…) — family / living trusts don't count on their own. */
function isCompany_(name) {
  return ENTITY_RE.test(String(name || '').replace(/\b(trusts?|trustees?|revocable|irrevocable|living|family|estate of|life estate)\b/gi, ' '));
}

/**
 * Keeps only investor buyers.
 *   Companies / LLCs: always (unless government, bank, church, HOA…).
 *   Individuals and family trusts (if allowed): not living at the property AND at least one strong signal —
 *     2+ purchases, land / commercial / multi-family, or an out-of-state mailing address.
 *   (A new homeowner's mailing address often still shows their previous home, so "absentee" alone isn't enough.)
 */
function investorFilter_(sales, allowIndividuals, homeState) {
  var groups = {};
  sales.forEach(function (s) {
    if (!str_(s.name) || INSTITUTION_RE.test(s.name)) return;
    if (/government|institution|exempt|non-taxable|ground lease|church|cemetery|utility|right of way|common area/i.test(String(s.type))) return;
    var k = normKey_(s.name);
    (groups[k] = groups[k] || []).push(s);
  });
  var keep = [];
  Object.keys(groups).forEach(function (k) {
    var g = groups[k], name = g[0].name;
    if (isCompany_(name)) { keep = keep.concat(g); return; }
    if (!allowIndividuals) return;
    var absentee = g.every(function (s) {
      if (/land/i.test(String(s.type))) return true; // nobody lives on a vacant lot
      var a = streetKey_(s.addr), m = streetKey_(s.mailStreet || s.mailing);
      return a && m && a !== m;
    });
    if (!absentee) return;
    var mailState = (String(g[0].mailing || '').toUpperCase().match(/,\s*([A-Z]{2})\s*[\d-]*\s*$/) || [])[1];
    var strong = g.length >= 2 || g.some(function (s) { return /land|commercial|multi|apartment|duplex|triplex/i.test(String(s.type)); }) ||
      (mailState && homeState && mailState !== homeState);
    if (strong) keep = keep.concat(g);
  });
  return keep;
}

/** Residential / Commercial / Land from use, zoning and improvement value. */
function propKind_(use, zoning, impValue) {
  var u = lc_(use), z = str_(zoning).toUpperCase();
  if (/vacant|land|\blots?\b|unimproved|acreage|agric|farm|timber/.test(u) || impValue === 0) return 'Vacant Land';
  if (/commerc|business|office|retail|industr|warehouse|apartment|hotel|motel|mixed|shopping|restaurant/.test(u) || /^(B|C|M|I|O|LI|HI|GC|CBD)[-\d]/.test(z)) return 'Commercial';
  return use ? titleCase_(use) : 'Residential';
}

function arcQuery_(url, params) {
  var q = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
  var res = UrlFetchApp.fetch(url + '/query?' + q + '&f=json', { muteHttpExceptions: true });
  if (res.getResponseCode() !== 200) throw new Error('Public records server unavailable (' + res.getResponseCode() + ').');
  var j = JSON.parse(res.getContentText());
  if (j.error) throw new Error('Public records query failed: ' + (j.error.message || JSON.stringify(j.error)));
  return j;
}

function mailing_(street, city, state, zip) {
  return [titleCase_(str_(street)), titleCase_(str_(city)), [str_(state).toUpperCase(), str_(zip)].filter(String).join(' ')].filter(String).join(', ');
}

function hash_(s) {
  var h = 5381;
  for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}

// ---------- snapshot storage (private Drive folder) ----------

function owFolder_() {
  var props = PropertiesService.getScriptProperties();
  var id = props.getProperty('OW_FOLDER_ID');
  if (id) { try { return DriveApp.getFolderById(id); } catch (e) { /* recreate */ } }
  var f = rootFolder_().createFolder('Owner snapshots (private)');
  props.setProperty('OW_FOLDER_ID', f.getId());
  return f;
}
function owState_(key) { try { return JSON.parse(PropertiesService.getScriptProperties().getProperty('OW_' + key) || '{}'); } catch (e) { return {}; } }
function owSave_(key, st) { PropertiesService.getScriptProperties().setProperty('OW_' + key, JSON.stringify(st)); }
function readJsonFile_(id) { if (!id) return null; try { return JSON.parse(DriveApp.getFileById(id).getBlob().getDataAsString()); } catch (e) { return null; } }
function writeJsonFile_(id, name, obj) {
  var s = JSON.stringify(obj);
  if (id) { try { DriveApp.getFileById(id).setContent(s); return id; } catch (e) { /* recreate */ } }
  return owFolder_().createFile(name, s, 'application/json').getId();
}

// ---------- provider adapters ----------

var _hrVersions = null;
function owVersion_(src) {
  if (src.provider === 'hrgeo') {
    if (!_hrVersions) {
      _hrVersions = {};
      arcQuery_(HRGEO_URL, { where: '1=1', groupByFieldsForStatistics: 'FIPS', outStatistics: JSON.stringify([{ statisticType: 'max', onStatisticField: 'LASTUPDATE', outStatisticFieldName: 'v' }]) })
        .features.forEach(function (f) { var a = {}; Object.keys(f.attributes).forEach(function (k) { a[k.toLowerCase()] = f.attributes[k]; }); _hrVersions[a.fips] = a.v; });
    }
    return _hrVersions[src.fips] || null;
  }
  if (src.provider === 'nc') {
    var r = arcQuery_(NCONEMAP_URL, { where: "stcntyfips='" + src.fips + "'", outStatistics: JSON.stringify([{ statisticType: 'max', onStatisticField: 'transfdate', outStatisticFieldName: 'v' }]) });
    return r.features && r.features[0] ? r.features[0].attributes.v : null;
  }
  if (src.provider === 'richmond') {
    var res = UrlFetchApp.fetch(src.url + '?f=json', { muteHttpExceptions: true });
    var j = JSON.parse(res.getContentText() || '{}');
    return j.editingInfo ? (j.editingInfo.dataLastEditDate || j.editingInfo.lastEditDate) : null;
  }
  return null;
}

/** One page of parcels after `lastOid`, normalized. */
function owPage_(src, lastOid) {
  var url, where, oid, fields, map;
  if (src.provider === 'hrgeo') {
    url = HRGEO_URL; oid = 'OBJECTID'; where = "FIPS='" + src.fips + "'";
    fields = 'OBJECTID,PARCELID,OWNERNME1,PSTLADDRESS,PSTLCITY,MLADDRESS,MLCITY,MLSTATE,MLZIP5,ZONING,IMPVALUE,TOTVALUE,CALCAREA';
    map = function (a) { return { id: a.PARCELID || a.OBJECTID, owner: a.OWNERNME1, addr: a.PSTLADDRESS, city: a.PSTLCITY || src.market, mail: mailing_(a.MLADDRESS, a.MLCITY, a.MLSTATE, a.MLZIP5), mailStreet: a.MLADDRESS, use: '', zoning: a.ZONING, imp: a.IMPVALUE, value: a.TOTVALUE, acres: a.CALCAREA }; };
  } else if (src.provider === 'nc') {
    url = NCONEMAP_URL; oid = 'objectid'; where = "stcntyfips='" + src.fips + "'";
    fields = 'objectid,parno,ownname,siteadd,scity,mailadd,mcity,mstate,mzip,parusedesc,improvval,parval,gisacres';
    map = function (a) { return { id: a.parno || a.objectid, owner: a.ownname, addr: a.siteadd, city: a.scity || src.market, mail: mailing_(a.mailadd, a.mcity, a.mstate, a.mzip), mailStreet: a.mailadd, use: a.parusedesc, zoning: '', imp: a.improvval, value: a.parval, acres: a.gisacres }; };
  } else {
    url = src.url; oid = 'OBJECTID'; where = '1=1';
    fields = 'OBJECTID,ParcelID,OwnerName,AsrLocationBldgNo,MailAddress,MailCity,MailState,MailZip,PropertyClass,LandUse,LandSqFt,DwellingValue,TotalValue';
    map = function (a) { return { id: a.ParcelID || a.OBJECTID, owner: a.OwnerName, addr: a.AsrLocationBldgNo, city: 'Richmond', mail: mailing_(a.MailAddress, a.MailCity, a.MailState, a.MailZip), mailStreet: a.MailAddress, use: a.LandUse || a.PropertyClass, zoning: '', imp: a.DwellingValue, value: a.TotalValue, acres: a.LandSqFt ? a.LandSqFt / 43560 : '' }; };
  }
  var r = arcQuery_(url, { where: where + ' AND ' + oid + ' > ' + Number(lastOid || 0), outFields: fields, orderByFields: oid + ' ASC', resultRecordCount: OW_PAGE, returnGeometry: 'false' });
  var feats = r.features || [];
  return {
    rows: feats.map(function (f) {
      var x = map(f.attributes);
      x.oid = f.attributes[oid];
      x.owner = str_(x.owner).replace(/\s*[\/&]\s*$/, '').replace(/\s+\/\s*/g, ' & ').trim();
      x.addr = str_(x.addr).replace(/^0+\s+/, '').replace(/^0+(\d)/, '$1');
      if (!/[a-z]/i.test(x.addr)) x.addr = '';
      if (!/[a-z]/i.test(str_(x.city))) x.city = src.market;
      return x;
    }),
    more: feats.length >= OW_PAGE || !!r.exceededTransferLimit,
    lastOid: feats.length ? feats[feats.length - 1].attributes[oid] : lastOid
  };
}

// ---------- sources ----------

/** York County live sales: buyer, mailing address, date, price, use, acreage. */
function yorkSales_(src, ctx, s) {
  var days = Math.max(1, parseInt(s.INTAKE_WATCH_DAYS, 10) || 45);
  var minPrice = Number(num_(s.INTAKE_WATCH_MIN_PRICE)) || 0;
  var since = fmtDate_(new Date(Date.now() - days * 86400000), 'yyyy-MM-dd');
  var r = arcQuery_(src.url, {
    where: "transferDate >= DATE '" + since + "' AND consideration >= " + minPrice,
    outFields: 'PID,GPIN,ownerName,ownerAddress1,ownerCity,ownerState,ownerZip,ADDRESS,transferDate,consideration,useDescription,classType,tablzone_DESC,currImprovementVal,legalAcres,GISacres',
    orderByFields: 'transferDate DESC', resultRecordCount: 2000, returnGeometry: 'false'
  });
  var allowInd = bool_(s.INTAKE_WATCH_INDIVIDUALS), sales = [], seen = 0;
  // Bulk deeds repeat the TOTAL price on every parcel: split it evenly across the parcels in that deed.
  var bulk = {};
  (r.features || []).forEach(function (f) { var a = f.attributes; var k = normKey_(a.ownerName) + '|' + a.transferDate + '|' + a.consideration; bulk[k] = (bulk[k] || 0) + 1; });
  (r.features || []).forEach(function (f) {
    var a = f.attributes;
    seen++;
    var nParcels = bulk[normKey_(a.ownerName) + '|' + a.transferDate + '|' + a.consideration] || 1;
    var d = a.transferDate ? new Date(a.transferDate) : null;
    var ref = 'YRK:' + (a.PID || a.GPIN) + ':' + (d ? fmtDate_(d) : '');
    // each purchase is logged once by the Purchase Ledger (ledgerAdd_ skips refs it already has)
    sales.push({
      name: a.ownerName, email: '', phone: '', mailing: mailing_(a.ownerAddress1, a.ownerCity, a.ownerState, a.ownerZip),
      addr: a.ADDRESS, mailStreet: a.ownerAddress1, city: src.market, state: 'VA', date: d, price: Number(a.consideration) ? Math.round(Number(a.consideration) / nParcels) : '',
      type: propKind_(a.useDescription || a.classType, a.tablzone_DESC, a.currImprovementVal), financing: '', saleRef: ref
    });
  });
  var logged = ledgerAdd_(ctx, sales, INTAKE_SOURCES.watch.label);
  return { note: seen + ' recorded sales in ' + days + ' days · ' + logged + ' new investor purchases logged', done: true };
}

/** Owner-change watch for one locality (resumable across runs). */
function ownerWatchStep_(src, ctx, s, deadline) {
  var st = owState_(src.key);
  var v = owVersion_(src);
  if (!v) return { note: 'no data version available', done: true };
  if (!st.scan) {
    if (st.version === v) return { note: 'up to date (data from ' + fmtDate_(new Date(v), 'MMM d, yyyy') + ')', done: true };
    st.scan = { version: v, lastOid: 0, tmp: '', found: 0 };
  }
  var old = st.snap ? readJsonFile_(st.snap) : null; // null → first time: build a baseline only
  var next = st.scan.tmp ? (readJsonFile_(st.scan.tmp) || {}) : {};
  var allowInd = bool_(s.INTAKE_WATCH_INDIVIDUALS), sales = [];
  var more = true, pages = 0;
  while (more && (pages === 0 || Date.now() < deadline)) {
    var pg = owPage_(src, st.scan.lastOid);
    pages++;
    pg.rows.forEach(function (row) {
      var key = row.owner ? hash_(normKey_(row.owner)) : '';
      var prev = old ? old[row.id] : undefined;
      next[row.id] = key;
      if (!old || prev === undefined || !key || prev === key) return;
      var ref = 'OW:' + src.key + ':' + row.id + ':' + st.scan.version;
      // each purchase is logged once by the Purchase Ledger (ledgerAdd_ skips refs it already has)
      sales.push({
        name: row.owner, email: '', phone: '', mailing: row.mail, mailStreet: row.mailStreet, addr: row.addr, city: row.city, state: src.provider === 'nc' ? 'NC' : 'VA',
        date: null, price: '', type: propKind_(row.use, row.zoning, row.imp), financing: '', saleRef: ref,
        acres: row.acres, value: row.value
      });
    });
    st.scan.lastOid = pg.lastOid;
    more = pg.more;
  }
  var periodDays = st.version ? Math.max(1, Math.round((Number(st.scan.version) - Number(st.version)) / 86400000)) : 0;
  if (sales.length) {
    sales.forEach(function (x) { x.periodDays = periodDays; x.date = new Date(Number(st.scan.version)); });
    st.scan.found += ledgerAdd_(ctx, sales, INTAKE_SOURCES.watch.label);
  }
  if (more) {
    st.scan.tmp = writeJsonFile_(st.scan.tmp, 'scan-' + src.key + '.json', next);
    owSave_(src.key, st);
    return { note: 'scanning… (' + Object.keys(next).length.toLocaleString() + ' parcels so far)', done: false };
  }
  var baseline = !old;
  st.snap = writeJsonFile_(st.snap, 'snapshot-' + src.key + '.json', next);
  if (st.scan.tmp) { try { DriveApp.getFileById(st.scan.tmp).setTrashed(true); } catch (e) { /* ignore */ } }
  st.lastChanges = baseline ? 0 : st.scan.found;
  st.version = st.scan.version;
  st.parcels = Object.keys(next).length;
  st.lastScan = new Date().toISOString();
  if (baseline) st.baselineAt = st.lastScan;
  st.scan = null;
  owSave_(src.key, st);
  return { note: baseline ? 'baseline saved (' + st.parcels.toLocaleString() + ' parcels) — buyers appear when the data next updates' : st.lastChanges + ' investor purchases logged (data ' + fmtDate_(new Date(Number(st.version)), 'MMM d, yyyy') + ')', done: true };
}

function watchAreas_() {
  var chosen = list_(getSettings_().INTAKE_WATCH_AREAS);
  return WATCH_SOURCES.filter(function (w) { return !chosen.length || chosen.indexOf(w.key) > -1; });
}

/** Intake runner: works through every chosen area within a time budget; continues later if needed. */
function watchLeads_(ctx, budgetMs) {
  var s = getSettings_(), deadline = Date.now() + (budgetMs || 150000), notes = [], pending = false;
  _hrVersions = null;
  watchAreas_().forEach(function (src) {
    if (Date.now() > deadline) { pending = true; return; }
    try {
      var r = src.kind === 'sales' ? yorkSales_(src, ctx, s) : ownerWatchStep_(src, ctx, s, deadline);
      if (!r.done) pending = true;
      notes.push(src.label + ': ' + r.note);
      var st = owState_(src.key); st.lastNote = r.note; st.lastChecked = new Date().toISOString(); owSave_(src.key, st);
    } catch (e) {
      notes.push(src.label + ': ' + String(e.message || e));
      var st2 = owState_(src.key); st2.lastNote = 'error — ' + String(e.message || e).slice(0, 140); st2.lastChecked = new Date().toISOString(); owSave_(src.key, st2);
    }
  });
  if (pending) scheduleOwnerWatch_();
  return notes.join(' · ');
}

function scheduleOwnerWatch_() {
  if (!hasTrigger_('runOwnerWatch')) ScriptApp.newTrigger('runOwnerWatch').timeBased().after(60 * 1000).create();
}

/** Trigger: continues long first-time scans (large cities take a few runs). */
function runOwnerWatch() {
  deleteTriggers_('runOwnerWatch');
  return withLock_(function () {
    var ctx = intakeCtx_();
    ctx.cur = { added: 0, updated: 0, duplicate: 0, skipped: 0 };
    var note = watchLeads_(ctx, 270000);
    ledgerPromote_(ctx);
    flushIntake_(ctx);
    if (ctx.adds.length) { try { skipTraceRun_(); } catch (e) { /* retried on the next intake run */ } }
    return { note: note, added: ctx.adds.length };
  });
}

function watchStatus_() {
  var chosen = list_(getSettings_().INTAKE_WATCH_AREAS);
  return {
    areas: WATCH_SOURCES.map(function (w) {
      var st = owState_(w.key);
      return {
        key: w.key, label: w.label, kind: w.kind, cadence: w.cadence || 'daily', on: !chosen.length || chosen.indexOf(w.key) > -1,
        dataDate: st.version ? fmtDate_(new Date(Number(st.version)), 'MMM d, yyyy') : '', baselineAt: st.baselineAt || '', scanning: !!st.scan,
        lastNote: st.lastNote || '', lastChecked: st.lastChecked || '', parcels: st.parcels || 0
      };
    }),
    notAvailable: WATCH_NOT_AVAILABLE
  };
}

/**
 * PublicRecords.gs — finds ACTIVE investor buyers from recent recorded sales, automatically.
 *
 *  • DealMachine (paid, all your areas): properties that SOLD in the last N days where the buyer
 *    used no mortgage (cash) — and optionally a private / hard-money lender — and the new owner
 *    doesn't live there. Returns the owner's name, mailing address and (optionally) phone + email.
 *    API: https://api.docs.dealmachine.com  (key from dealmachine.com/settings/developer)
 *
 *    Also finds NEW-CONSTRUCTION / LAND buyers: owners paying cash for residential vacant land or
 *    development lots who own several properties (builders and developers, not one-time lot buyers).
 *
 *  • County records (free): City of Norfolk "Property Assessment and Sales" open data —
 *    every recorded transfer with buyer (grantee), date and price. Free data has no mortgage info,
 *    so by default only company / LLC / trust buyers are kept (the likely investors).
 *
 * Each sale is processed once (tracked in the Buyer Intake Log). Sales by the same owner are grouped
 * into one buyer whose buy box is built from what they bought. Everyone lands in New Buyers as
 * Pending Review — nobody receives deals until you approve them.
 */

var DM_BASE = 'https://api.v2.dealmachine.com/v1';
