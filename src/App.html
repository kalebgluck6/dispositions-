<script>
/* ============================================================
   SameDayInvestments — Deal Distribution web app (client)
   ============================================================ */
(function () {
'use strict';

// ---------- helpers ----------
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const isNum = n => n !== '' && n != null && !isNaN(Number(n));
const money = n => isNum(n) ? (Number(n) < 0 ? '-$' : '$') + Math.abs(Math.round(Number(n))).toLocaleString('en-US') : '—';
const short$ = n => { if (!isNum(n)) return '—'; n = Number(n); if (Math.abs(n) >= 1e6) return '$' + (n / 1e6).toFixed(n % 1e6 ? 2 : 0) + 'M'; if (Math.abs(n) >= 1e3) return '$' + Math.round(n / 1e3) + 'K'; return '$' + n; };
const fmtNum = n => isNum(n) ? Number(n).toLocaleString('en-US') : '—';
const toDate = v => { if (!v) return null; const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/); const d = m ? new Date(+m[1], m[2] - 1, +m[3]) : new Date(v); return isNaN(d) ? null : d; };
const fmtDate = v => { const d = toDate(v); return d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—'; };
const fmtDT = v => { const d = toDate(v); return d ? d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—'; };
const ago = v => { const d = toDate(v); if (!d) return ''; const s = (Date.now() - d) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; if (s < 604800) return Math.floor(s / 86400) + 'd ago'; return fmtDate(v); };
const list = v => Array.isArray(v) ? v : String(v || '').split(/[,;|\n]/).map(s => s.trim()).filter(Boolean);
const lc = s => String(s || '').toLowerCase();
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function api(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => reject(err && err.message ? err : new Error(String(err))))[fn](...args);
  });
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.innerHTML = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 300); }, type === 'err' ? 7000 : 4000);
}
const fail = e => { console.error(e); toast(esc(e && e.message || e), 'err'); };

// ---------- icons ----------
const I = {
  dash: '<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>',
  deals: '<path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10.5z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  send: '<path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>',
  log: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  star: '<path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>',
  edit: '<path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>',
  eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  refresh: '<path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
  mail: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="m22 6-10 7L2 6"/>'
};
const icon = (n) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + I[n] + '</svg>';

// ---------- state ----------
const S = {
  settings: null, investors: [], deals: [], dashboard: null,
  view: 'dashboard', params: {},
  dealFilter: 'All', dealSearch: '',
  inv: { q: '', tier: '', category: '', status: 'Active', market: '' }, selected: new Set(),
  form: null, pendingPhotos: [], photoPreviews: null,
  tracking: null, trackTab: 'recipients', showTest: false,
  responses: null, respFilter: { deal: '', type: '', followUp: '' },
  jobs: null, imp: { url: '', tab: '' }
};
const L = () => S.settings.lists;

const NAV = [
  ['dashboard', 'Dashboard', 'dash'],
  ['deals', 'Deals', 'deals'],
  ['dealForm', 'Submit Deal', 'plus'],
  ['investors', 'Investors', 'users'],
  ['import', 'Import Investors', 'upload'],
  ['responses', 'Responses', 'inbox'],
  ['jobs', 'Distributions', 'log'],
  ['settings', 'Settings', 'gear']
];
const TITLES = { dashboard: 'Dashboard', deals: 'Deals', dealForm: 'Submit a Deal', deal: 'Deal', investors: 'Investor Network', import: 'Import Investors', responses: 'Responses & Interested Buyers', jobs: 'Distribution History', settings: 'Settings' };

function go(view, params) {
  S.view = view; S.params = params || {};
  if (view === 'dealForm') { S.form = null; S.pendingPhotos = []; S.photoPreviews = null; S.pendingVideo = null; }
  if (view === 'deal') { S.tracking = null; S.trackTab = S.params.tab || 'recipients'; }
  window.scrollTo(0, 0);
  render();
}

function renderChrome() {
  const newResp = (S.dashboard && S.dashboard.responses30d) || 0;
  $('#nav').innerHTML = NAV.map(([v, label, ic]) => {
    const active = S.view === v || (v === 'deals' && S.view === 'deal') || (v === 'dealForm' && S.view === 'dealForm' && !S.params.id) || (v === 'deals' && S.view === 'dealForm' && S.params.id);
    const badge = v === 'investors' ? '<span class="badge">' + S.investors.filter(i => i.status === 'Active' && !i.optOut).length + '</span>' : '';
    return '<a data-go="' + v + '" class="' + (active ? 'active' : '') + '">' + icon(ic) + esc(label) + badge + '</a>';
  }).join('');
  const st = S.settings;
  $('#mode-pill').innerHTML = st.testMode
    ? '<span class="mode-pill test" data-go="settings" title="All emails are redirected to ' + esc(st.values.TEST_EMAIL) + '"><span class="dot"></span>Test Mode</span>'
    : '<span class="mode-pill live" data-go="settings" title="Emails go to real investors"><span class="dot"></span>Live</span>';
  $('#quota').textContent = st.quota >= 0 ? st.quota.toLocaleString() + ' emails left today' : '';
  $('#sidefoot').innerHTML = esc(st.user || '') + '<br><a href="' + esc(st.spreadsheetUrl) + '" target="_blank">Open database sheet ↗</a><br>v' + esc(st.version);
  $('#page-title').textContent = S.view === 'dealForm' && S.params.id ? 'Edit Deal' : (TITLES[S.view] || '');
}

function render() {
  renderChrome();
  const v = VIEWS[S.view] || VIEWS.dashboard;
  const banner = S.settings.testMode && ['dashboard', 'deals', 'deal'].includes(S.view)
    ? '<div class="test-banner">⚠ <div><b>Test mode is on.</b> Distributions are delivered only to <b>' + esc(S.settings.values.TEST_EMAIL) + '</b> — no investor will be emailed. Switch to live in <a data-go="settings">Settings</a>.</div></div>' : '';
  $('#view').innerHTML = banner + v.html();
  if (v.mount) v.mount();
}

// ---------- modal ----------
function openModal(title, body, footer, opts) {
  opts = opts || {};
  $('#modal-root').innerHTML = '<div class="overlay" data-overlay><div class="modal ' + (opts.wide ? 'wide' : '') + '">' +
    '<div class="mh"><h2>' + title + '</h2><button class="x" data-act="closeModal">×</button></div>' +
    '<div class="mb" id="mb">' + body + '</div>' + (footer ? '<div class="mf" id="mf">' + footer + '</div>' : '') + '</div></div>';
  if (opts.mount) opts.mount();
}
function closeModal() { $('#modal-root').innerHTML = ''; DIST = null; }

// ---------- generic form helpers ----------
const field = (label, input, hint, cls) => '<div class="field ' + (cls || '') + '"><label>' + label + '</label>' + input + (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
const inp = (name, val, type, attrs) => '<input type="' + (type || 'text') + '" name="' + name + '" value="' + esc(val == null ? '' : val) + '" ' + (attrs || '') + '>';
const moneyInp = (name, val, attrs) => '<div class="prefix"><span>$</span>' + inp(name, isNum(val) ? val : '', 'text', 'inputmode="decimal" ' + (attrs || '')) + '</div>';
const sel = (name, val, options, blank) => '<select name="' + name + '">' + (blank !== undefined ? '<option value="">' + esc(blank) + '</option>' : '') +
  options.map(o => { const v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o; return '<option value="' + esc(v) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('') + '</select>';
const area = (name, val, attrs) => '<textarea name="' + name + '" ' + (attrs || '') + '>' + esc(val || '') + '</textarea>';
const chk = (name, on, label) => '<label class="check"><input type="checkbox" name="' + name + '"' + (on ? ' checked' : '') + '> ' + label + '</label>';
function chips(group, options, selected) {
  const sel = list(selected).map(lc);
  const all = options.slice();
  list(selected).forEach(s => { if (!all.map(lc).includes(lc(s))) all.push(s); });
  return '<div class="chips" data-chipgroup="' + group + '">' + all.map(o => '<span class="chip' + (sel.includes(lc(o)) ? ' on' : '') + '" data-act="chip" data-val="' + esc(o) + '">' + esc(o) + '</span>').join('') + '</div>';
}
const chipVals = (group, root) => $$('[data-chipgroup="' + group + '"] .chip.on', root).map(c => c.dataset.val);
function formData(form) {
  const o = {};
  $$('input,select,textarea', form).forEach(el => {
    if (!el.name) return;
    o[el.name] = el.type === 'checkbox' ? el.checked : el.value;
  });
  return o;
}
const statusPill = s => '<span class="status st-' + esc(s) + '">' + esc(s) + '</span>';

// ============================================================
// VIEWS
// ============================================================
const VIEWS = {};

// ---------- dashboard ----------
VIEWS.dashboard = {
  html() {
    const d = S.dashboard;
    if (!d) return '<div class="loading"><span class="spinner"></span> Loading…</div>';
    const ready = S.deals.filter(x => x.status === 'Available').slice(0, 6);
    return '<div class="grid g4">' +
      kpi('Active Investors', fmtNum(d.investors.active), d.investors.total + ' total · ' + d.investors.optedOut + ' opted out') +
      kpi('Available Deals', fmtNum(d.deals.Available || 0), (d.deals.Pending || 0) + ' pending · ' + (d.deals.Sold || 0) + ' sold') +
      kpi('Emails Sent · 30d', fmtNum(d.emails30d), d.queued ? d.queued + ' queued now' : 'Individually delivered') +
      kpi('Interested Buyers · 30d', fmtNum(d.interested30d), d.responses30d + ' total responses') +
      '</div>' +
      '<div class="row" style="margin:22px 0">' +
      '<button class="btn primary" data-go="dealForm">' + icon('plus') + 'Submit New Deal</button>' +
      '<button class="btn" data-act="newInvestor">' + icon('users') + 'Add Investor</button>' +
      '<button class="btn" data-go="import">' + icon('upload') + 'Import from Google Sheets</button>' +
      '<button class="btn" data-act="scanInbox">' + icon('inbox') + 'Scan Inbox for Replies</button>' +
      '</div>' +
      '<div class="grid" style="grid-template-columns:1.4fr 1fr">' +
      '<div class="card"><div class="hd"><h3>Ready to Distribute</h3><div class="spacer" style="flex:1"></div><a data-go="deals" class="small" style="cursor:pointer">All deals →</a></div>' +
      (ready.length ? '<table class="t"><tbody>' + ready.map(x =>
        '<tr><td><div style="font-family:var(--serif);font-size:17px;font-weight:600;cursor:pointer" data-go="deal" data-id="' + esc(x.id) + '">' + esc(x.address) + '</div><div class="small muted">' + esc(x.id) + ' · ' + esc([x.city, x.state].filter(Boolean).join(', ')) + '</div></td>' +
        '<td class="nowrap"><div>' + money(x.askingPrice) + '</div><div class="small muted">ARV ' + short$(x.arv) + '</div></td>' +
        '<td class="nowrap small muted">' + (x.timesDistributed ? 'Sent ' + x.timesDistributed + '× · ' + x.totalRecipients + ' investors' : 'Not sent yet') + '</td>' +
        '<td class="right"><button class="btn-send sm" data-act="distribute" data-id="' + esc(x.id) + '">' + icon('send') + 'Send</button></td></tr>').join('') + '</tbody></table>'
        : '<div class="empty"><h4>No available deals</h4>Submit a deal to distribute it to your investor network.<div style="margin-top:14px"><button class="btn primary" data-go="dealForm">Submit Deal</button></div></div>') +
      '</div>' +
      '<div class="card"><div class="hd"><h3>Recent Activity</h3></div><div class="bd" style="padding-top:4px;padding-bottom:4px">' +
      (d.activity.length ? '<ul class="activity">' + d.activity.map(a =>
        '<li><div class="ic">' + icon(a.kind === 'distribution' ? 'send' : 'mail') + '</div><div><div>' + esc(a.text) + '</div><div class="when">' + ago(a.when) + (a.status ? ' · ' + esc(a.status) : '') + '</div></div></li>').join('') + '</ul>'
        : '<div class="empty" style="padding:30px">No activity yet.</div>') +
      '</div></div></div>' +
      (d.lastScan ? '<p class="small muted" style="margin-top:14px">Inbox last scanned ' + ago(d.lastScan) + (S.settings.autoTracking ? ' · auto-tracking every 15 min' : ' · <a data-go="settings">enable auto-tracking</a>') + '</p>' : '');
  },
  mount() { if (!S._dashFresh) { S._dashFresh = true; } }
};
const kpi = (l, v, m) => '<div class="card kpi"><div class="label">' + l + '</div><div class="value">' + v + '</div><div class="meta">' + esc(m) + '</div></div>';

// ---------- deals list ----------
VIEWS.deals = {
  html() {
    const q = lc(S.dealSearch);
    const counts = { All: S.deals.length };
    L().dealStatuses.forEach(s => counts[s] = S.deals.filter(d => d.status === s).length);
    const shown = S.deals.filter(d => (S.dealFilter === 'All' || d.status === S.dealFilter) &&
      (!q || lc([d.id, d.address, d.city, d.state, d.zip, d.market, d.propertyType].join(' ')).includes(q)));
    return '<div class="toolbar"><div class="tabs" style="margin:0;border:0">' +
      ['All'].concat(L().dealStatuses).map(s => '<a class="' + (S.dealFilter === s ? 'on' : '') + '" data-act="dealFilter" data-val="' + s + '">' + s + '<span class="n">' + counts[s] + '</span></a>').join('') +
      '</div><div style="flex:1"></div><input type="search" id="dealSearch" placeholder="Search address, city, ID…" value="' + esc(S.dealSearch) + '">' +
      '<button class="btn primary" data-go="dealForm">' + icon('plus') + 'Submit Deal</button></div>' +
      (shown.length ? '<div class="deal-grid">' + shown.map(dealCard).join('') + '</div>'
        : '<div class="card empty"><h4>No deals here yet</h4>Submit the properties you get under contract, then send them to your network with one click.<div style="margin-top:14px"><button class="btn primary" data-go="dealForm">Submit Deal</button></div></div>');
  },
  mount() {
    const s = $('#dealSearch');
    if (s) s.addEventListener('input', debounce(e => { S.dealSearch = e.target.value; const pos = e.target.selectionStart; render(); const n = $('#dealSearch'); n.focus(); n.setSelectionRange(pos, pos); }, 250));
  }
};

function dealCard(d) {
  const m = d.metrics || {};
  return '<div class="deal-card">' +
    '<div class="top" data-go="deal" data-id="' + esc(d.id) + '"><div class="row" style="justify-content:space-between"><span class="id">' + esc(d.id) + (d.propertyType ? ' · ' + esc(d.propertyType) : '') + '</span>' + statusPill(d.status) + '</div>' +
    '<div class="addr">' + esc(d.address) + '</div><div class="city">' + esc([d.city, [d.state, d.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ')) + (d.market ? ' · ' + esc(d.market) : '') + '</div></div>' +
    '<div class="nums"><div><div class="l">Price</div><div class="v">' + short$(d.askingPrice) + '</div></div><div><div class="l">ARV</div><div class="v">' + short$(d.arv) + '</div></div>' +
    '<div><div class="l">Repairs</div><div class="v">' + short$(d.repairs) + '</div></div><div><div class="l">Spread</div><div class="v" style="color:var(--accent-2)">' + short$(m.spread) + '</div></div></div>' +
    '<div class="meta"><span>' + (isNum(d.beds) ? d.beds : '–') + ' bd / ' + (isNum(d.baths) ? d.baths : '–') + ' ba</span><span>' + (isNum(d.sqft) ? fmtNum(d.sqft) + ' sf' : '— sf') + '</span>' +
    '<span>' + d.photoIds.length + ' photos</span><span>' + (d.timesDistributed ? '✓ Sent to ' + d.totalRecipients : 'Not distributed') + '</span><span>' + d.interested + ' interested</span></div>' +
    '<div class="actions">' + (d.status !== 'Sold' ? '<button class="btn-send" data-act="distribute" data-id="' + esc(d.id) + '">' + icon('send') + 'Send to Investor Network</button>' : '') +
    '<button class="btn sm ghost" data-go="dealForm" data-id="' + esc(d.id) + '" title="Edit">' + icon('edit') + '</button>' +
    '<button class="btn sm ghost" data-go="deal" data-id="' + esc(d.id) + '" title="Tracking">' + icon('eye') + '</button></div></div>';
}

// ---------- deal form ----------
VIEWS.dealForm = {
  html() {
    const editing = !!S.params.id;
    if (!S.form) {
      const ex = editing ? S.deals.find(d => d.id === S.params.id) : null;
      S.form = ex ? JSON.parse(JSON.stringify(ex)) : { showAssignment: /^true$/i.test(S.settings.values.SHOW_ASSIGNMENT_DEFAULT), showAccess: true, state: '' };
    }
    const f = S.form;
    const markets = L().markets;
    return '<form id="dealForm" autocomplete="off"><div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start">' +
      '<div class="stack">' +
      '<div class="card"><div class="hd"><h3>Property</h3>' + (editing ? '<span class="muted small" style="margin-left:auto">' + esc(f.id) + '</span>' : '') + '</div><div class="bd grid" style="grid-template-columns:2fr 1fr 70px 100px">' +
      field('Property address *', inp('address', f.address, 'text', 'required placeholder="123 Main Street"'), '', '') +
      field('City', inp('city', f.city)) + field('State', inp('state', f.state, 'text', 'maxlength="2" style="text-transform:uppercase"')) + field('Zip', inp('zip', f.zip, 'text', 'inputmode="numeric"')) +
      '</div><div class="bd grid g4" style="padding-top:0">' +
      field('Property type', sel('propertyType', f.propertyType, L().propertyTypes, 'Select…')) +
      field('Market', markets.length ? sel('market', f.market, markets, 'Select…') : inp('market', f.market, 'text', 'placeholder="e.g. Atlanta Metro"'), markets.length ? '' : 'Add markets in Settings') +
      field('Bedrooms', inp('beds', f.beds, 'number', 'min="0" step="1"')) + field('Bathrooms', inp('baths', f.baths, 'number', 'min="0" step="0.5"')) +
      field('Square footage', inp('sqft', f.sqft, 'number', 'min="0"')) + field('Lot size', inp('lotSize', f.lotSize, 'text', 'placeholder="0.25 acres"')) +
      field('Year built', inp('yearBuilt', f.yearBuilt, 'number', 'min="1700" max="2100"')) + field('Closing date', inp('closingDate', f.closingDate, 'date')) +
      '</div></div>' +

      '<div class="card"><div class="hd"><h3>Deal Numbers</h3></div><div class="bd grid g4">' +
      field('Asking price *', moneyInp('askingPrice', f.askingPrice, 'data-calc required'), 'Purchase price to the investor') +
      field('ARV', moneyInp('arv', f.arv, 'data-calc')) + field('Estimated repairs', moneyInp('repairs', f.repairs, 'data-calc')) +
      field('Assignment price', moneyInp('assignmentPrice', f.assignmentPrice), chk('showAssignment', f.showAssignment, 'Show in investor email')) +
      '</div><div class="bd" style="padding-top:0"><div class="metric-strip" id="calc"></div></div></div>' +

      '<div class="card"><div class="hd"><h3>Description & Access</h3></div><div class="bd stack">' +
      field('Deal description', area('description', f.description, 'rows="6" placeholder="Highlights, condition, rehab scope, rent comps, neighborhood…"'), 'Shown in the investor email. Blank lines create paragraphs.') +
      field('Access instructions', area('access', f.access, 'rows="3" placeholder="Open house Saturday 10am–12pm. Call to schedule a walkthrough."'), chk('showAccess', f.showAccess, 'Include in investor email') + ' &nbsp;— do not put lockbox codes here if this is included; use Internal notes.') +

function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read ' + file.name));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error(file.name + ' is not a supported image (use JPG or PNG; convert HEIC first).'));
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve({ name: file.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', dataUrl: c.toDataURL('image/jpeg', quality) });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function addPhotos(files) {
  const arr = Array.from(files || []).filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif)$/i.test(f.name));
  if (!arr.length) return toast('Please choose image files.', 'warn');
  for (const file of arr) {
    try {
      const p = await compressImage(file, 1600, 0.82);
      if (S.params.id) {
        p.uploading = true; S.pendingPhotos.push(p); renderPhotos();
        await api('uploadDealPhoto', S.params.id, p.name, p.mime, p.dataUrl);
        S.pendingPhotos = S.pendingPhotos.filter(x => x !== p);
        S.photoPreviews = await api('getDealPhotoPreviews', S.params.id);
        syncDealPhotos();
      } else {
        S.pendingPhotos.push(p);
      }
      renderPhotos();
    } catch (e) { S.pendingPhotos = S.pendingPhotos.filter(x => !x.uploading); renderPhotos(); fail(e); }
  }
}
function syncDealPhotos() {
  const d = S.deals.find(x => x.id === S.params.id);
  if (d && S.photoPreviews) d.photoIds = S.photoPreviews.map(p => p.id);
}

function pickVideo(file) {
  if (!file) return;
  if (file.size > 45 * 1024 * 1024) return toast('That video is over 45 MB. Upload it to YouTube, Loom or Google Drive and paste the link instead.', 'warn');
  const r = new FileReader();
  r.onload = () => {
    S.pendingVideo = { name: file.name, mime: file.type || 'video/mp4', dataUrl: r.result };
    if (S.params.id) uploadPendingVideo(S.params.id).then(d => { if (d) { replaceDeal(d); S.form.videoUrl = d.videoUrl; const vi = $('[name=videoUrl]'); if (vi) vi.value = d.videoUrl; } });
    else $('#videoStatus').textContent = file.name + ' (uploads on save)';
  };
  r.readAsDataURL(file);
}
async function uploadPendingVideo(id) {
  if (!S.pendingVideo) return null;
  const v = S.pendingVideo;
  const st = $('#videoStatus'); if (st) st.innerHTML = '<span class="spinner"></span> Uploading ' + esc(v.name) + '…';
  try {
    const d = await api('uploadDealVideo', id, v.name, v.mime, v.dataUrl);
    S.pendingVideo = null;
    if (st) st.textContent = 'Uploaded ✓ ' + v.name;
    toast('Video uploaded.');
    return d;
  } catch (e) { if (st) st.textContent = 'Upload failed'; fail(e); return null; }
}

function replaceDeal(d) {
  const i = S.deals.findIndex(x => x.id === d.id);
  if (i > -1) S.deals[i] = d; else S.deals.unshift(d);
}

async function saveDealForm(thenSend) {
  const form = $('#dealForm');
  const data = formData(form);
  if (!data.address.trim()) return toast('Property address is required.', 'warn');
  if (!data.askingPrice) return toast('Asking / purchase price is required.', 'warn');
  if (S.params.id) data.id = S.params.id;
  const btn = $('#saveDeal'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving…';
  try {
    let d = await api('saveDeal', data);
    S.form = d;
    if (S.pendingPhotos.length) {
      let n = 0;
      for (const p of S.pendingPhotos.slice()) {
        p.uploading = true; renderPhotos();
        btn.innerHTML = '<span class="spinner"></span> Uploading photo ' + (++n) + ' of ' + S.pendingPhotos.length + '…';
        await api('uploadDealPhoto', d.id, p.name, p.mime, p.dataUrl);
      }
      S.pendingPhotos = [];
    }
    if (S.pendingVideo) { btn.innerHTML = '<span class="spinner"></span> Uploading video…'; await uploadPendingVideo(d.id); }
    d = await api('getDeal', d.id);
    replaceDeal(d);
    toast('Deal <b>' + esc(d.id) + '</b> saved.');
    go('deal', { id: d.id });
    if (thenSend) openDistribute(d.id);
  } catch (e) {
    fail(e);
    btn.disabled = false; btn.textContent = S.params.id ? 'Save Changes' : 'Save Deal';
  }
}

function distMount() {

}
const refreshAudience = debounce(() => {
  if (!DIST || DIST.step !== 1) return;

async function distConfirm() {
  const p = DIST.prepared;
  const typed = p.mode === 'LIVE' ? ($('#confirmText') || {}).value : '';
  if (p.mode === 'LIVE' && String(typed).trim().toUpperCase() !== 'SEND') return toast('Type SEND to confirm.', 'warn');
  const btn = $('#distGo'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Sending…';
  try {
    const job = await api('confirmDistribution', p.token, typed);
    DIST.job = job; DIST.step = 4; renderDist();
    pollJob(job.id);
    refreshData();
  } catch (e) { fail(e); btn.disabled = false; btn.innerHTML = icon('send') + (p.mode === 'LIVE' ? 'Send to Investor Network' : 'Run Test Distribution'); }
}
function pollJob(id) {
  if (!DIST || !DIST.job || DIST.job.queued === 0) return;
  setTimeout(() => {
    if (!DIST || DIST.step !== 4) return;
    api('getJobStatus', id).then(j => { if (!DIST) return; DIST.job = j; renderDist(); if (j.queued > 0) pollJob(id); else refreshData(); }).catch(fail);
  }, 6000);
}

function refreshData() {
  return Promise.all([api('listDeals'), api('getDashboard'), api('listInvestors')]).then(([deals, dash, inv]) => {
    S.deals = deals; S.dashboard = dash; S.investors = inv; S.settings.quota = dash.quota;

  }).catch(fail);
}

        '<div>' + chk('impUpdate', true, 'Update investors that already exist (matched by email)') + '</div>' +
        '<button class="btn primary" data-act="impRun" id="impRun">' + icon('upload') + 'Import ' + p.totalRows + ' rows</button></div>' +
        (m.result ? '<div class="confirm-box test" style="margin-top:18px;border-color:var(--green-600);background:var(--green-900)"><h4>Import complete</h4>' +
          '<b>' + m.result.added + '</b> added · <b>' + m.result.updated + '</b> updated · ' + m.result.skipped + ' already existed (skipped) · ' + m.result.duplicatesInFile + ' duplicates in sheet · ' + m.result.invalid.length + ' invalid emails' +
          (m.result.invalid.length ? '<div class="small muted" style="margin-top:8px">Invalid: ' + m.result.invalid.map(x => 'row ' + x.row + ' (' + esc(x.value) + ')').join(', ') + '</div>' : '') +
          '<div style="margin-top:12px"><button class="btn sm" data-go="investors">View investors →</button></div></div>' : '') + '</div></div>';
    }
    return h;
  }
};

// ---------- responses ----------
VIEWS.responses = {
  html() {
    if (!S.responses) return '<div class="loading"><span class="spinner"></span> Loading responses…</div>';
    const f = S.respFilter;
    const rows = S.responses.filter(r => (!f.deal || r.dealId === f.deal) && (!f.type || r.type === f.type) && (!f.followUp || r.followUp === f.followUp));
    const dealOpts = uniq(S.responses.map(r => r.dealId).filter(Boolean));
    return '<div class="toolbar">' +
      '<select data-change="respFilter" name="deal"><option value="">All deals</option>' + dealOpts.map(id => { const d = S.deals.find(x => x.id === id); return '<option value="' + esc(id) + '"' + (f.deal === id ? ' selected' : '') + '>' + esc(id + (d ? ' · ' + d.address : '')) + '</option>'; }).join('') + '</select>' +
      '<select data-change="respFilter" name="type"><option value="">All types</option>' + L().responseTypes.map(t => '<option' + (f.type === t ? ' selected' : '') + '>' + t + '</option>').join('') + '</select>' +
      '<select data-change="respFilter" name="followUp"><option value="">All follow-up</option>' + L().followUpStatuses.map(t => '<option' + (f.followUp === t ? ' selected' : '') + '>' + t + '</option>').join('') + '</select>' +
      '<div style="flex:1"></div><span class="small muted">' + rows.length + ' responses</span>' +
      '<button class="btn" data-act="scanInbox">' + icon('inbox') + 'Scan Inbox Now</button><button class="btn primary" data-act="logResponse">' + icon('plus') + 'Log Response</button></div>' +
      responsesTable(rows, true);
  },
  mount() { if (!S.responses) api('listResponses').then(r => { S.responses = r; if (S.view === 'responses') render(); }).catch(fail); }
};

function logResponseModal(dealId) {
  const deals = S.deals.filter(d => d.status !== 'Sold' || d.id === dealId);
  const body = '<form id="respForm"><div class="grid g2">' +
    field('Deal *', sel('dealId', dealId || '', deals.map(d => [d.id, d.id + ' · ' + d.address]), 'Select deal…')) +
    field('Investor', sel('investorId', '', S.investors.slice().sort((a, b) => lc(a.firstName + a.lastName).localeCompare(lc(b.firstName + b.lastName))).map(i => [i.id, ((i.firstName + ' ' + i.lastName).trim() || i.company) + ' · ' + i.email]), 'Not in database / enter below')) +
    field('Name (if not in database)', inp('investorName', '')) + field('Email (if not in database)', inp('investorEmail', '', 'email')) +
    field('Response type', sel('type', 'Interested', L().responseTypes)) + field('Offer amount', moneyInp('offerAmount', '')) +
    field('Follow-up status', sel('followUp', 'New', L().followUpStatuses)) + '<div></div>' +
    '</div><div class="stack" style="margin-top:14px">' + field('Message / details', area('message', '', 'rows="3" placeholder="Called — wants to walk it Thursday, has POF."')) + field('Internal notes', area('notes', '', 'rows="2"')) + '</div></form>';
  openModal('Log Investor Response', body, '<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveResponse">Save Response</button>');
}

// ---------- jobs ----------
VIEWS.jobs = {
  html() {
    if (!S.jobs) return '<div class="loading"><span class="spinner"></span> Loading…</div>';
    return '<div class="toolbar"><span class="muted">Every distribution, test or live, with delivery counts. Individual recipients are on each deal\'s tracking page and in the <i>Distribution Log</i> sheet.</span><div style="flex:1"></div><button class="btn" data-act="refreshJobs">' + icon('refresh') + 'Refresh</button></div>' + jobsTable(S.jobs, true);
  },
  mount() { if (!S.jobs) api('listJobs').then(j => { S.jobs = j; if (S.view === 'jobs') render(); }).catch(fail); }
};

// ---------- settings ----------
VIEWS.settings = {
  html() {
    const st = S.settings, v = st.values, D = st.descriptions;
    const f = (k, label, type) => field(label, type === 'area' ? area(k, v[k], 'rows="3"') : type === 'bool' ? sel(k, /^true$/i.test(v[k]) ? 'TRUE' : 'FALSE', [['TRUE', 'Yes'], ['FALSE', 'No']]) : inp(k, v[k], type || 'text'), esc(D[k] || ''));
    return '<form id="setForm"><div class="grid g2" style="align-items:start"><div class="stack">' +
      '<div class="card" style="border-color:' + (st.testMode ? 'rgba(232,181,58,.45)' : 'rgba(217,83,79,.5)') + '"><div class="hd"><h3>Sending Mode</h3><span style="margin-left:auto" class="mode-pill ' + (st.testMode ? 'test' : 'live') + '"><span class="dot"></span>' + (st.testMode ? 'Test mode' : 'Live') + '</span></div><div class="bd stack">' +
      '<div class="muted">' + (st.testMode ? 'Test mode is <b style="color:var(--amber)">ON</b>. Distributions run end-to-end but every email is redirected to the test address below (max ' + esc(v.TEST_MODE_MAX_EMAILS) + ' per distribution). No investor is contacted.' : 'Live mode is <b style="color:#FF8A84">ON</b>. Distributions email real investors after you type SEND to confirm.') + '</div>' +
      '<div class="grid g2">' + f('TEST_EMAIL', 'Test email address', 'email') + f('TEST_MODE_MAX_EMAILS', 'Max test emails per distribution', 'number') + '</div>' +
      (st.testMode ? '<button type="button" class="btn danger" data-act="goLive">Switch to LIVE mode…</button>' : '<button type="button" class="btn" data-act="goTest" style="border-color:var(--amber);color:var(--amber)">Switch back to Test mode</button>') +
      '</div></div>' +
      '<div class="card"><div class="hd"><h3>Company & Contact</h3></div><div class="bd stack">' + f('COMPANY_NAME', 'Company name') + '<div class="grid g2">' + f('CONTACT_NAME', 'Dispositions contact') + f('CONTACT_PHONE', 'Phone', 'tel') + '</div><div class="grid g2">' + f('CONTACT_EMAIL', 'Contact email', 'email') + f('WEBSITE', 'Website') + '</div>' + f('COMPANY_ADDRESS', 'Mailing address *') + f('LOGO_URL', 'Logo image URL', 'url') + '</div></div>' +
      '<div class="card"><div class="hd"><h3>Investor Lists</h3></div><div class="bd stack">' + f('TIERS', 'Tiers') + f('CATEGORIES', 'Categories', 'area') + f('PROPERTY_TYPES', 'Property types', 'area') + f('MARKETS', 'Markets', 'area') + '</div></div>' +
      '</div><div class="stack">' +
      '<div class="card"><div class="hd"><h3>Email</h3></div><div class="bd stack"><div class="grid g2">' + f('SENDER_NAME', 'From name') + f('REPLY_TO', 'Reply-To address', 'email') + '</div>' + f('FROM_ALIAS', 'Send-as alias (optional)', 'email') + f('SUBJECT_TEMPLATE', 'Subject line') +
      '<div class="grid g3">' + f('EMAIL_PHOTO_COUNT', 'Photos in email', 'number') + f('SHARE_MEDIA_LINKS', 'Share gallery link', 'bool') + f('SHOW_ASSIGNMENT_DEFAULT', 'Show assignment price', 'bool') + '</div>' + f('DISCLAIMER', 'Disclaimer', 'area') + '</div></div>' +
      '<div class="card"><div class="hd"><h3>Response Tracking</h3></div><div class="bd stack"><div class="muted small">Scans this Gmail inbox for investor replies to deal emails (matched by the deal ID in the subject), logs them as responses, and automatically opts out anyone who replies UNSUBSCRIBE.</div>' +
      f('RESPONSE_LOOKBACK_DAYS', 'Look back (days)', 'number') +
      '<div class="row">' + (st.autoTracking ? '<span class="tag" style="color:var(--accent-2)">Auto-tracking ON · every 15 min</span><button type="button" class="btn sm" data-act="autoTrack" data-val="off">Turn off</button>' : '<span class="tag">Auto-tracking off</span><button type="button" class="btn sm primary" data-act="autoTrack" data-val="on">Turn on</button>') +
      '<button type="button" class="btn sm" data-act="scanInbox">Scan now</button></div></div></div>' +
      '<div class="card"><div class="hd"><h3>System</h3></div><div class="bd small stack"><div>Signed in as <b>' + esc(st.user) + '</b></div><div>Gmail quota remaining today: <b>' + (st.quota >= 0 ? st.quota : 'unknown') + '</b> <span class="muted">(Gmail: ~100/day, Google Workspace: ~1,500/day — larger lists are queued automatically)</span></div><div><a href="' + esc(st.spreadsheetUrl) + '" target="_blank">Open database spreadsheet ↗</a></div><div class="muted">Version ' + esc(st.version) + '</div></div></div>' +
      '<button type="submit" class="btn primary" style="width:100%;padding:13px">Save Settings</button>' +
      '</div></div></form>';
  },
  mount() {
    $('#setForm').addEventListener('submit', async e => {
      e.preventDefault();
      try { S.settings = await api('saveSettings', formData(e.target)); toast('Settings saved.'); render(); } catch (err) { fail(err); }
    });
  }
};

// ============================================================
// ACTIONS (event delegation)
// ============================================================
const ACT = {
  closeModal,
  chip: el => el.classList.toggle('on'),
  dealFilter: el => { S.dealFilter = el.dataset.val; render(); },
  distribute: el => openDistribute(el.dataset.id),
  saveAndSend: () => saveDealForm(true),
  pickVideo: () => $('#videoInput').click(),
  removePending: el => { S.pendingPhotos.splice(+el.dataset.i, 1); renderPhotos(); },
  removePhoto: async el => {
    if (!confirm('Remove this photo? It will be moved to Drive trash.')) return;
    try { await api('removeDealPhoto', S.params.id, el.dataset.id); S.photoPreviews = S.photoPreviews.filter(p => p.id !== el.dataset.id); syncDealPhotos(); renderPhotos(); } catch (e) { fail(e); }
  },
  coverPhoto: async el => {
    try { await api('setCoverPhoto', S.params.id, el.dataset.id); const p = S.photoPreviews.find(x => x.id === el.dataset.id); S.photoPreviews = [p].concat(S.photoPreviews.filter(x => x !== p)); syncDealPhotos(); renderPhotos(); } catch (e) { fail(e); }
  },
  trackTab: el => { S.trackTab = el.dataset.val; render(); },
  setStatus: el => {
    const s = el.dataset.val, id = el.dataset.id, d = S.deals.find(x => x.id === id);
    if (s === 'Available') return doStatus(id, s, {});
    openModal('Mark ' + esc(d.address) + ' as ' + s,
      '<div class="grid g2" id="stForm">' + field(s === 'Sold' ? 'Buyer' : 'Buyer (under contract with)', inp('buyer', d.buyer, 'text', 'list="buyerList"') + '<datalist id="buyerList">' + S.investors.map(i => '<option value="' + esc(((i.firstName + ' ' + i.lastName).trim() || i.company) + ' (' + i.email + ')') + '">').join('') + '</datalist>') +
      (s === 'Sold' ? field('Final sale / assignment price', moneyInp('soldPrice', d.soldPrice || d.askingPrice)) : '') + '</div>',
      '<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary" data-act="confirmStatus" data-id="' + esc(id) + '" data-val="' + s + '">Mark ' + s + '</button>');
  },
  confirmStatus: el => { const v = formData($('#stForm')); closeModal(); doStatus(el.dataset.id, el.dataset.val, v); },
  sendTest: async el => {
    const to = ($('#testTo') || {}).value;
    el.disabled = true; const old = el.innerHTML; el.innerHTML = '<span class="spinner"></span> Sending…';
    try { const r = await api('sendTestEmail', el.dataset.id, to); toast('Test email sent to <b>' + esc(r.sentTo) + '</b>.'); S.settings.quota = r.quota; renderChrome(); } catch (e) { fail(e); }
    el.disabled = false; el.innerHTML = old;
  },
  distMode: el => { DIST.audience.mode = el.dataset.val; renderDist(); },
  pickAll: () => { $$('[data-change="pickInv"]').forEach(c => { if (!DIST.audience.investorIds.includes(c.value)) DIST.audience.investorIds.push(c.value); }); renderDist(); },
  pickNone: () => { DIST.audience.investorIds = []; renderDist(); },
  distNext: () => { syncSegments(); if (DIST.preview && !DIST.preview.count) return toast('No investors match this audience.', 'warn'); DIST.step = 2; renderDist(); },
  distBack: () => { DIST.step = Math.max(1, DIST.step - 1); renderDist(); },
  distPrepare: async el => {
    el.disabled = true; el.innerHTML = '<span class="spinner"></span> Preparing…';
    try { DIST.prepared = await api('prepareDistribution', DIST.deal.id, DIST.audience); DIST.step = 3; renderDist(); }
    catch (e) { fail(e); el.disabled = false; el.textContent = 'Next: Review & Confirm →'; }
  },
  distConfirm: () => distConfirm(),
  closeDistDone: () => { closeModal(); render(); },
  closeDistTrack: () => { const id = DIST.deal.id; closeModal(); go('deal', { id }); },
  cancelJob: async el => {
    if (!confirm('Cancel all emails in this distribution that have not been sent yet?')) return;
    try { await api('cancelJob', el.dataset.id); toast('Remaining emails cancelled.'); S.jobs = null; S.tracking = null; render(); } catch (e) { fail(e); }
  },
  refreshJobs: () => { S.jobs = null; render(); },
  newInvestor: () => investorModal(null),
  editInvestor: (el, e) => { if (e.target.closest('[data-stop]')) return; investorModal(el.dataset.id); },
  saveInvestor: el => saveInvestorModal(el.dataset.id),
  bulkStatus: el => bulk({ status: el.dataset.val }, el.dataset.val === 'Active' ? 'Activated' : 'Deactivated'),
  bulkDelete: async () => {
    const typed = prompt('Permanently delete ' + S.selected.size + ' investors? Deactivating keeps their history.\n\nType DELETE to confirm:');
    if (typed == null) return;
    try { const r = await api('deleteInvestors', Array.from(S.selected), typed); S.investors = r.investors; S.selected.clear(); toast(r.deleted + ' investors deleted.'); render(); } catch (e) { fail(e); }
  },
  clearSel: () => { S.selected.clear(); render(); },
  impPreview: async el => {
    S.imp.url = $('#impUrl').value.trim();
    const tabEl = $('#impTab') || $('[name=impTab]');
    const tab = S.imp.preview && S.imp.url === S.imp.lastUrl ? (tabEl ? tabEl.value : '') : ($('#impTab') ? $('#impTab').value.trim() : '');
    el.disabled = true; el.innerHTML = '<span class="spinner"></span> Loading…';
    try { S.imp.preview = await api('previewImport', S.imp.url, tab); S.imp.lastUrl = S.imp.url; S.imp.result = null; render(); }
    catch (e) { fail(e); el.disabled = false; el.textContent = 'Load Sheet'; }
  },
  impRun: async el => {
    const p = S.imp.preview, mapping = {};
    p.fields.forEach(f => { const v = $('[name=map_' + f + ']').value; if (v !== '') mapping[f] = Number(v); });
    if (mapping.email === undefined) return toast('Map the Email column first.', 'warn');
    const opts = { defaultTier: $('[name=impTier]').value, defaultCategory: $('[name=impCat]').value, updateExisting: $('[name=impUpdate]').checked };
    el.disabled = true; el.innerHTML = '<span class="spinner"></span> Importing…';
    try {
      S.imp.result = await api('runImport', S.imp.url, p.tab, mapping, opts);
      S.investors = await api('listInvestors');
      toast('Import complete: ' + S.imp.result.added + ' added, ' + S.imp.result.updated + ' updated.'); render();
    } catch (e) { fail(e); el.disabled = false; el.textContent = 'Import'; }
  },
  scanInbox: async el => {
    const old = el.innerHTML; el.disabled = true; el.innerHTML = '<span class="spinner"></span> Scanning…';
    try {
      const r = await api('scanInboxForResponses');
      toast('Inbox scanned: <b>' + r.found + '</b> new responses' + (r.unsubscribed ? ', ' + r.unsubscribed + ' unsubscribed' : '') + '.');
      S.responses = null; S.tracking = null; await refreshData();
    } catch (e) { fail(e); el.disabled = false; el.innerHTML = old; }
  },
  logResponse: el => logResponseModal(el.dataset.id),
  saveResponse: async () => {
    const v = formData($('#respForm'));
    try { await api('logResponse', v); closeModal(); toast('Response logged.'); S.responses = null; S.tracking = null; await refreshData(); } catch (e) { fail(e); }
  },
  respNote: async el => {
    const r = (S.responses || (S.tracking && S.tracking.responses) || []).find(x => x.id === el.dataset.id);
    const n = prompt('Notes for this response:', r ? r.notes : '');
    if (n == null) return;
    try { const u = await api('updateResponse', el.dataset.id, { notes: n }); patchResponse(u); render(); } catch (e) { fail(e); }
  },
  goLive: () => {
    openModal('Switch to LIVE mode',
      '<div class="confirm-box live"><h4>Emails will go to real investors</h4><p>In live mode, distributions send an individual email to every investor in the audience you choose. Each distribution still requires typing SEND to confirm.</p>' +
      '<p class="small muted">Before going live: set your mailing address and contact info, send yourself a test email, and run at least one test distribution.</p>' +
      '<div class="field"><label>Type <b style="color:#fff;letter-spacing:2px">GO LIVE</b> to confirm</label><input type="text" class="confirm-input" id="goLiveText" style="max-width:260px" autocomplete="off"></div></div>',
      '<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn danger" data-act="confirmGoLive">Switch to Live</button>');
    $('#goLiveText').focus();
  },
  confirmGoLive: async () => {
    try { S.settings = await api('setTestMode', false, $('#goLiveText').value); closeModal(); toast('Live mode is ON.', 'warn'); render(); } catch (e) { fail(e); }
  },
  goTest: async () => { try { S.settings = await api('setTestMode', true, ''); toast('Test mode is ON.'); render(); } catch (e) { fail(e); } },
  autoTrack: async el => {
    try { S.settings = await api(el.dataset.val === 'on' ? 'enableAutoTracking' : 'disableAutoTracking'); toast('Auto-tracking ' + (el.dataset.val === 'on' ? 'enabled' : 'disabled') + '.'); render(); } catch (e) { fail(e); }
  }
};

function patchResponse(u) {
  [S.responses, S.tracking && S.tracking.responses].forEach(arr => { if (!arr) return; const i = arr.findIndex(x => x.id === u.id); if (i > -1) arr[i] = u; });
}

function syncSegments() {
  if (!DIST || DIST.audience.mode !== 'segments') return;
  DIST.audience.tiers = chipVals('d_tiers'); DIST.audience.categories = chipVals('d_categories'); DIST.audience.markets = chipVals('d_markets');
}

async function doStatus(id, status, extra) {
  try {
    const d = await api('setDealStatus', id, status, extra);
    replaceDeal(d); toast(esc(d.address) + ' marked <b>' + status + '</b>.');
    api('getDashboard').then(x => { S.dashboard = x; }).catch(() => {});
    render();
  } catch (e) { fail(e); }
}

const CHANGE = {
  showTest: el => { S.showTest = el.checked; render(); },
  respFollow: async el => { try { const u = await api('updateResponse', el.dataset.id, { followUp: el.value }); patchResponse(u); toast('Follow-up updated.'); } catch (e) { fail(e); } },
  respFilter: el => { S.respFilter[el.name] = el.value; render(); },
  pickInv: el => { const ids = DIST.audience.investorIds; if (el.checked) { if (!ids.includes(el.value)) ids.push(el.value); } else DIST.audience.investorIds = ids.filter(x => x !== el.value); const s = $('.pick-list + .row .muted'); if (s) s.textContent = DIST.audience.investorIds.length + ' selected'; refreshAudience(); },
  distOpt: el => { DIST.audience[el.name] = el.checked; refreshAudience(); },
  invFilter: el => { S.inv[el.name] = el.value; render(); },
  selAll: el => { (S._invShown || []).forEach(i => el.checked ? S.selected.add(i.id) : S.selected.delete(i.id)); render(); },
  selOne: el => { el.checked ? S.selected.add(el.value) : S.selected.delete(el.value); render(); },
  bulkTier: el => el.value && bulk({ tier: el.value }, 'Tier set to ' + el.value),
  bulkAddCat: el => el.value && bulk({ addCategory: el.value }, 'Added ' + el.value),
  bulkRemoveCat: el => el.value && bulk({ removeCategory: el.value }, 'Removed ' + el.value)
};

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g && !e.target.closest('[data-act]')) {
    e.preventDefault();
    if ($('.overlay')) closeModal();
    if (g.dataset.go === 'dashboard') api('getDashboard').then(d => { S.dashboard = d; if (S.view === 'dashboard') render(); }).catch(() => {});
    if (g.dataset.go === 'responses') S.responses = null;
    if (g.dataset.go === 'jobs') S.jobs = null;
    return go(g.dataset.go, g.dataset.id ? { id: g.dataset.id } : {});
  }
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) {
    if (a.tagName === 'A' || a.tagName === 'BUTTON') e.preventDefault();
    ACT[a.dataset.act](a, e);
    if (a.dataset.act === 'chip' && DIST && DIST.step === 1) { syncSegments(); refreshAudience(); }
    return;
  }
  if (e.target.matches('[data-overlay]')) closeModal();
});
document.addEventListener('change', e => {
  const c = e.target.closest('[data-change]');
  if (c && CHANGE[c.dataset.change]) CHANGE[c.dataset.change](c, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('.overlay')) closeModal(); });

// ---------- boot ----------
api('getBootstrap').then(b => {
  S.settings = b.settings; S.investors = b.investors; S.deals = b.deals; S.dashboard = b.dashboard;
  $('#boot').remove();
  render();
}).catch(e => {
  $('#boot').innerHTML = '<div class="inner" style="max-width:520px"><div class="word">SameDay<span>Investments</span></div><p style="color:#FF9A95">' + esc(e.message || e) + '</p><p class="muted small">If this is a new install, open the Google Sheet → Extensions → Apps Script and run <b>setup</b> once, then reload.</p></div>';
});

})();
</script>
